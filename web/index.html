.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10000;opacity:0;visibility:hidden;transition:.2s}

.drawer{position:fixed;top:0;bottom:0;width:min(300px,85vw);z-index:10001;background:var(--surface);padding:14px;padding-top:calc(14px + var(--safe-t));padding-bottom:calc(14px + var(--safe-b));transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
.drawer.left{left:0;transform:translateX(-105%);border-right:1px solid var(--border)}

.dlogo{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-weight:900}
.dclose{margin-left:auto;padding:6px;font-size:18px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{padding:12px;border-radius:14px;color:#e5e5e5;text-align:left;display:flex;flex-direction:column;gap:2px;align-items:flex-start;width:100%}

.nav button small{font-size:10px;color:var(--muted);font-weight:400}
.session-meta{font-size:11px;color:var(--muted);padding:8px 4px 12px;line-height:1.5;border-bottom:1px solid var(--border);margin-bottom:8px}
.toast{position:fixed;z-index:10002;bottom:140px;left:50%;transform:translate(-50%,12px);opacity:0;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px 14px;font-size:12px;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

.voice-bar.show{opacity:1}
</style>

<script>
(function(){
  var REG={core:"coordination and governance",chat:"conversation interface",sidebar:"navigation and entity discovery",voice:"context-aware voice processing",storage:"file indexing and organization",tool_factory:"safe tool creation and execution",quran_research:"Quran language research"};
  var STORE_KEY="mosharrof_chat_v1";

  var msgEl=$("#messages"),scrollEl=$("#chatScroll"),input=$("#input"),sendBtn=$("#sendBtn"),plusBtn=$("#plusBtn");
  var imageInput=$("#imageInput"),imagePreview=$("#imagePreview"),previewImage=$("#previewImage"),previewName=$("#previewName"),removeImage=$("#removeImage");
  var pendingImage=null;
  var leftBtn=$("#leftBtn"),rightBtn=$("#rightBtn"),scrim=$("#scrim"),dL=$("#drawerLeft"),dR=$("#drawerRight");
  var toastEl=$("#toast"),vStatus=$("#voiceStatus");
  var QE=["কি","কী","কেন","কোথায়","কোথায়","কখন","কীভাবে","কিভাবে","কত","কার","কে","কোন","কোনটি"];
  var CM={"গবেষনা":"গবেষণা","প্রজেকট":"প্রজেক্ট","খুজে":"খুঁজে","কোরান":"কুরআন","কুরান":"কুরআন","মোশারফ":"মোশাররফ","করতেছ":"করছ"};
  function nowISO(){return new Date().toISOString();}
  function fmtTime(iso){if(!iso)return "—";try{var d=new Date(iso);return d.toLocaleString("bn-BD",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true});}catch(e){return iso;}}
  function shortTime(iso){if(!iso)return "";try{return new Date(iso).toLocaleTimeString("bn-BD",{hour:"2-digit",minute:"2-digit",hour12:true});}catch(e){return "";}}
  function loadStore(){try{var raw=localStorage.getItem(STORE_KEY);if(!raw)return null;return JSON.parse(raw);}catch(e){return null;}}
  function saveStore(data){try{localStorage.setItem(STORE_KEY,JSON.stringify(data));}catch(e){}}
  var session=loadStore();
  if(!session||!session.messages){session={openedAt:nowISO(),closedAt:null,lastActiveAt:nowISO(),messages:[]};}
  else{session.openedAt=session.openedAt||nowISO();session.lastActiveAt=nowISO();session.closedAt=null;}
  saveStore(session);
  window.addEventListener("beforeunload",function(){session.closedAt=nowISO();session.lastActiveAt=nowISO();saveStore(session);});
  document.addEventListener("visibilitychange",function(){if(document.hidden){session.closedAt=nowISO();session.lastActiveAt=nowISO();saveStore(session);}else{session.openedAt=session.openedAt||nowISO();session.lastActiveAt=nowISO();session.closedAt=null;saveStore(session);updateMeta();}});
  function punct(t){return String(t||"").trim().split(/(?:\n+|\s{3,})/).filter(Boolean).map(function(c){var v=c.trim();if(!v)return"";if(/[।?!,;:]$/.test(v))return v;return QE.some(function(w){return v.endsWith(w);})?v+"?":v+"।";}).filter(Boolean).join(" ");}
  function correct(t){var v=String(t||"").replace(/\s+/g," ").trim();var c=[];for(var f in CM){if(!Object.prototype.hasOwnProperty.call(CM,f))continue;var to=CM[f];var r=new RegExp("(^|\\s)"+f+"(?=\\s|$)","g");var n=v.replace(r,"$1"+to);if(n!==v)c.push({f:f,to:to});v=n;}v=v.replace(/(\S+)(\s+\1)+/gi,"$1");return{text:v,corrections:c};}
  function toast(m,ms){ms=ms||2000;toastEl.textContent=m;toastEl.classList.add("show");setTimeout(function(){toastEl.classList.remove("show");},ms);}

  function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,120)+"px";}
  function bottom(){requestAnimationFrame(function(){scrollEl.scrollTop=scrollEl.scrollHeight;});}
  function iconSvg(kind){
    var paths={edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4Z"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',retry:'<path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 6"/><path d="M18.4 15A7 7 0 0 1 6 18l-2-6"/>',share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.4M8.7 13.3l6.6 4.4"/>'};
    return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(paths[kind]||'')+'</svg>';
  }
  function addMessageToolbar(n,role,text){
    var wrap=document.createElement("div");wrap.className="message-actions-wrap";
    var toggle=document.createElement("button");toggle.type="button";toggle.className="message-actions-toggle";toggle.setAttribute("aria-label","মেসেজের কাজ দেখান");toggle.setAttribute("aria-expanded","false");toggle.textContent="⋯";
    var group=document.createElement("div");group.className="message-actions";group.setAttribute("role","group");group.setAttribute("aria-label","মেসেজ অ্যাকশন");
    function action(kind,label,fn){var b=document.createElement("button");b.type="button";b.className="message-action";b.innerHTML=iconSvg(kind)+'<span>'+label+'</span>';b.onclick=function(e){e.stopPropagation();fn();};group.appendChild(b);}

  var editTargetIndex=null;
  function copyMessage(text){

  function editMessage(node,role,text){

  function typing(){var n=document.createElement("div");n.className="message ai typing";n.id="typing";n.innerHTML='<span class="label">MOSHARROF AI · core</span><span class="dots"><span></span><span></span><span></span></span>';msgEl.appendChild(n);bottom();}

  dR.innerHTML='<div class="dhead"><div class="dlogo">⋮</div><div><strong>Options</strong></div><button class="dclose" id="cR">✕</button></div><nav class="nav"><button id="historyBtn">🕐 ইতিহাস<small>খোলা/বন্ধ সময়</small></button><button id="newChat">✦ New Chat</button><button id="clearMsg">⌫ Clear</button><button id="voiceBtn">🎙️ Voice</button></nav>';
  var navL=$("#navL");Object.keys(REG).forEach(function(id){var b=document.createElement("button");if(id==="chat")b.className="active";b.innerHTML="<span>• "+id+"</span>";b.onclick=function(){Array.prototype.forEach.call(navL.children,function(x){x.classList.remove("active");});b.classList.add("active");toast(id+" — "+REG[id]);};navL.appendChild(b);});
  updateMeta();
  var rec=null;
  function initV(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;rec=new SR();rec.lang="bn-BD";rec.continuous=false;rec.interimResults=true;rec.onstart=function(){showV("Listening…");};rec.onresult=function(e){var t="";for(var i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;var p=correct(t);input.value=punct(p.text);resize();showV(p.corrections.length?"Context corrected":"Voice ready");};rec.onerror=function(e){showV("Error: "+e.error);setTimeout(hideV,2000);};rec.onend=function(){if(vStatus.textContent==="Listening…")hideV();else setTimeout(hideV,1500);};}
