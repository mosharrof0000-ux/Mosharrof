<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06152f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MOSHARROF AI — Full Screen V5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./entities/shared/entity-glass.css">
<link rel="stylesheet" href="./entities/shared/entity-shapes.css">
<style>
:root{--bg:#041229;--bg2:#092650;--t:#f4f9ff;--m:#9db3cd;--l:#70c8ff2b;--b:#2caeff;--v:#7058ef;--safe-top:env(safe-area-inset-top,0px);--safe:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);--text:#eef4ff}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;margin:0;padding:0}body{font-family:"Inter","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;background:#020b1c;color:var(--t);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.app{width:100%;height:100dvh;height:100svh;min-height:100dvh;position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 20% 5%,#279bff30,transparent 34%),radial-gradient(circle at 88% 95%,#7058ef35,transparent 40%),linear-gradient(145deg,var(--bg),var(--bg2))}
.main{position:absolute;inset:0;display:flex;flex-direction:column}
.top{height:calc(64px + var(--safe-top));flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(8px + var(--safe-top)) 14px 8px;border-bottom:1px solid var(--l);background:#020d1f44}
.round{width:42px;height:42px;border-radius:50%;border:1px solid #7ed3ff47;background:#071d3be8;display:grid;place-items:center;font-size:20px}
.left-btn{justify-self:start}.right-btn{justify-self:end}.brand{text-align:center}.brand b{font-size:14px}.brand small{display:block;font-size:9px;color:var(--m);margin-top:1px}
.mlogo{display:inline-grid;width:35px;height:35px;border-radius:50%;place-items:center;background:linear-gradient(145deg,var(--b),var(--v));font-weight:900;margin-right:5px;vertical-align:middle}
.content{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px 14px calc(12px + var(--safe));overflow:auto}
.hero{text-align:center;width:min(850px,100%)}.hero-logo{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;font-size:32px;font-weight:900;background:linear-gradient(145deg,#2baeff,#6e58ed)}
h1{font-size:clamp(25px,4vw,38px)}h1 span{color:#55c7ff}.sub{color:#aec3db;font-size:13px;margin-top:7px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:700px;margin:25px auto 20px}.quick button{min-height:58px;border:1px solid #65caff33;border-radius:16px;background:#082346bb;padding:9px;color:#e4f2ff}.quick b{display:block;font-size:12px}.quick small{font-size:9px;color:var(--m)}
.composer{position:relative;width:min(820px,100%);margin:auto;border:1px solid #68ccff4d;border-radius:25px;background:#03132bf2;padding:7px;box-shadow:0 15px 45px #0006}
.row{display:flex;align-items:center;gap:6px}.plus{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid #6bcfff3d;background:#0d2b4fe8;font-size:25px}.input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px 5px;font-size:14px}.input::placeholder{color:#839ab5}.send{width:44px;height:44px;border:0;border-radius:50%;background:linear-gradient(145deg,#36b2ff,#5c50ea);font-size:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:3px 5px 1px 51px}.chip{border:1px solid #7ec7ff29;background:#0b2b50;border-radius:11px;padding:6px 9px;font-size:10px}
.scrim{position:absolute;inset:0;background:#000a;z-index:20;opacity:0;visibility:hidden;transition:.2s}.scrim.open{opacity:1;visibility:visible}
.drawer{position:absolute;top:0;bottom:0;width:min(330px,86vw);z-index:30;background:linear-gradient(180deg,#04142bf9,#020c1ffb);padding:13px;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.drawer.left{left:0;transform:translateX(-105%);border-right:1px solid var(--l)}.drawer.right{right:0;transform:translateX(105%);border-left:1px solid var(--l)}.drawer.open{transform:translateX(0)}
.dhead{display:flex;align-items:center;gap:10px;padding:3px 3px 13px;border-bottom:1px solid var(--l);margin-bottom:10px}.dlogo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--b),var(--v));font-weight:900}.dhead strong{font-size:14px}.dhead small{display:block;color:var(--m);font-size:9px;margin-top:2px}.dclose{margin-left:auto}
.nav{display:flex;flex-direction:column;gap:4px;overflow:auto;height:calc(100% - 110px)}.nav button{border:0;background:transparent;border-radius:14px;padding:11px;color:#e5f0fd;text-align:left;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:linear-gradient(100deg,#218fe8,#624fe2)}.ni{width:25px;text-align:center;font-size:18px}
.profile{position:absolute;left:13px;right:13px;bottom:12px;border-top:1px solid var(--l);padding-top:11px;display:flex;gap:9px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#218fff,#6555e9);font-weight:800}.profile small{display:block;color:var(--m);font-size:9px;margin-top:2px}
.modules{height:calc(100% - 75px);overflow:auto}.module{width:100%;display:flex;align-items:center;gap:10px;border:1px solid #78caff27;background:#08294dcc;border-radius:16px;padding:10px;margin-bottom:8px;text-align:left}.module.featured{background:linear-gradient(105deg,#1391dc66,#6447dc66)}.mi{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:#38c1ff20;font-size:19px;flex:none}.module strong{display:block;font-size:12px}.module span{display:block;color:var(--m);font-size:9px;margin-top:3px}.arrow{margin-left:auto;font-size:20px;color:#a9c0d8}.add{width:100%;border:1px dashed #62d0ff77;background:#061c38;border-radius:15px;padding:12px;font-size:11px}.note{font-size:9px;color:#7189a5;line-height:1.5;padding:9px 2px}
.toast{position:absolute;z-index:70;bottom:calc(92px + var(--safe));left:50%;transform:translate(-50%,12px);opacity:0;background:#03162ff5;border:1px solid #6acfff40;border-radius:12px;padding:8px 12px;font-size:10px;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.top{height:58px;padding:7px 10px}.round{width:40px;height:40px}.quick{grid-template-columns:1fr 1fr}.drawer{width:min(85vw,320px)}}
.chat-mode .top{position:absolute;left:0;right:0;top:0;height:0;z-index:12;padding:0;border:0;background:transparent;pointer-events:none}
.chat-mode .brand{display:none}
.chat-mode .left-btn,.chat-mode .right-btn{position:absolute;top:calc(14px + var(--safe-top));pointer-events:auto;z-index:13}
.chat-mode .left-btn{left:14px}.chat-mode .right-btn{right:14px}
.chat-mode .round{background:rgba(7,29,59,.72);backdrop-filter:blur(14px)}
.chat-mode .content{position:absolute;inset:0;padding:0;display:block;overflow:hidden}
.chat-mode .hero{width:100%;height:100%;max-width:none;display:flex;flex-direction:column;text-align:left;align-items:stretch}
.chat-mode .hero-logo,.chat-mode h1,.chat-mode .sub,.chat-mode .quick{display:none}
.chat-mode .composer{order:2;flex:none;width:min(900px,calc(100% - 24px));margin:0 auto calc(10px + var(--safe));z-index:10;position:relative}
.chat-mode .chat-scroll{display:block;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:calc(76px + var(--safe-top)) 0 18px;scroll-behavior:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y}
.chat-mode .messages{width:100%;min-height:100%;max-width:48rem;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;justify-content:flex-end;gap:22px}
.chat-mode .message.user{align-self:flex-end;max-width:min(78%,34rem);padding:12px 16px;border-radius:18px 18px 6px 18px;background:linear-gradient(145deg,#168ad0,#5648cf);font-size:15px;line-height:1.6;word-break:break-word;animation:msgAppear .45s cubic-bezier(.22,1,.36,1) both}
.chat-mode .message.ai{align-self:stretch;width:100%;max-width:100%;padding:4px 0 8px;background:transparent;border:0;animation:msgAppear .5s cubic-bezier(.22,1,.36,1) both}
.chat-mode .message.ai .label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:#8eb4d8;margin-bottom:10px}.chat-mode .message.ai .timer{margin-left:auto;color:#70c8ff;font-variant-numeric:tabular-nums;font-size:10px;opacity:.9}
.chat-mode .message.ai .label::before{content:"";width:22px;height:22px;border-radius:50%;background:linear-gradient(145deg,#2baeff,#6e58ed);flex:none}
.chat-mode .message.ai .ai-text{display:block;color:var(--text);font-size:16px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.chat-mode .message.ai .ai-text p{margin:0 0 .85em}.chat-mode .message.ai .ai-text p:last-child{margin-bottom:0}
.chat-mode .message.ai .ai-text strong{font-weight:600;color:#fff}
.chat-mode .message.ai .ai-text ul{margin:.5em 0 .9em;padding-left:1.35em}
.chat-mode .message.ai .ai-text li{margin:.28em 0}
.chat-mode .message.ai .ai-text code{font-family:ui-monospace,monospace;font-size:.9em;background:rgba(112,200,255,.12);padding:.12em .4em;border-radius:6px}
.chat-mode .message.ai .ai-text.streaming::after{content:"▋";display:inline-block;margin-left:2px;opacity:.7;animation:caretBlink .85s step-end infinite;color:#70c8ff}
.chat-mode .chips{display:none}
@keyframes msgAppear{from{opacity:0;filter:blur(5px);transform:translateY(14px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes caretBlink{50%{opacity:0}}
@media(max-width:760px){.chat-mode .messages{padding:0 14px}.chat-mode .message.ai .ai-text{font-size:15px}}

/* MOSHARROF Entity Engine — original message-entity language */
.mos-entity-rail{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:12px;padding:0 2px;min-height:38px;opacity:1;transform:none;transition:opacity .28s ease,transform .28s ease}
.message.ai:hover .mos-entity-rail,.message.ai:focus-within .mos-entity-rail,.mos-entity-rail.ready{opacity:1;transform:none}
.mos-entity{--entity-scale:1;position:relative;display:inline-flex;align-items:center;justify-content:center;width:calc(34px * var(--entity-scale));height:calc(34px * var(--entity-scale));min-width:calc(34px * var(--entity-scale));padding:0;border:1px solid rgba(154,220,255,.22);color:rgba(235,250,255,.88);background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(77,154,255,.055));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.13);cursor:pointer;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,opacity .2s ease}
.mos-entity:hover{transform:translateY(-2px) scale(1.04);border-color:rgba(129,221,255,.58);box-shadow:0 10px 28px rgba(39,155,255,.16),inset 0 1px 0 rgba(255,255,255,.2)}
.mos-entity:active{transform:translateY(1px) scale(.96)}
.mos-entity svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mos-entity .entity-core{display:flex;align-items:center;justify-content:center;width:100%;height:100%;transition:transform .25s ease}
.mos-entity[data-state="processing"] .entity-core{animation:mosEntityPulse 1s ease-in-out infinite}
.mos-entity[data-state="completed"] .entity-core{transform:scale(1.08)}
.mos-entity[data-state="error"]{border-color:rgba(255,130,130,.5)}
.mos-entity[data-action="coffee"]{border-radius:14px 20px 12px 18px}
.mos-entity[data-action="like"]{border-radius:20px 12px 18px 10px}
.mos-entity[data-action="voice"]{border-radius:50%}
.mos-entity[data-action="share"]{border-radius:11px 18px 11px 18px}
.mos-entity[data-action="copy"]{border-radius:8px 16px 10px 16px}
.mos-entity[data-action="branch"]{border-radius:18px 8px 18px 8px}
.mos-entity[data-state="active"][data-action="like"]{color:#ff9fca;border-color:rgba(255,130,190,.55);box-shadow:0 10px 28px rgba(255,90,170,.13)}
.mos-entity .entity-mark{position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;border-radius:50%;background:rgba(114,224,255,.8);box-shadow:0 0 10px rgba(114,224,255,.55);opacity:0;transform:scale(.5);transition:.2s}
.mos-entity[data-state="processing"] .entity-mark{opacity:1;transform:scale(1)}
@keyframes mosEntityPulse{50%{transform:scale(.84);opacity:.58}}
@media (max-width:560px){.mos-entity-rail{opacity:1;transform:none}.mos-entity{width:33px;height:33px}}
</style>
</head>
<body>

<main class="main">

</main>

<script>
(()=>{
var $=function(s){return document.querySelector(s);};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
var L=$('#leftDrawer'),R=$('#rightDrawer'),S=$('#scrim'),T=$('#toast');
var scrollEl=$('#chatScroll');
var CHAT_URL='https://mosharrof-screenshot-analysis.mosharrof0000.workers.dev/chat';

function msg(x){T.textContent=x;T.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(function(){T.classList.remove('show');},1600);}
function closeAll(){L.classList.remove('open');R.classList.remove('open');S.classList.remove('open');}
function drawer(x){closeAll();x.classList.add('open');S.classList.add('open');}
var autoFollowChat=true;
var manualScrollIntent=false;
function updateChatScroll(){if(!scrollEl||!autoFollowChat)return;scrollEl.scrollTop=scrollEl.scrollHeight;}
function onScroll(){if(!scrollEl)return;var nearBottom=scrollEl.scrollHeight-scrollEl.scrollTop-scrollEl.clientHeight<80;if(nearBottom){autoFollowChat=true;manualScrollIntent=false;}else{autoFollowChat=false;}}
if(scrollEl){scrollEl.addEventListener('scroll',onScroll,{passive:true});}
function setChatMode(on){document.body.classList.toggle('chat-mode',!!on);if(on){setTimeout(updateChatScroll,50);}}
function escapeHtml(s){return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');}
function formatAi(t){t=String(t||'');t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');t=t.replace(/(?:^|\n)[•\-\*]\s+(.+)/g,'\n<li>$1</li>');t=t.replace(/(<li>[\s\S]*?<\/li>)/g,function(m){return '<ul>'+m+'</ul>';});t=t.split(/\n{2,}/).map(function(block){if(block.indexOf('<ul>')===0)return block;if(block.indexOf('<li>')===0)return '<ul>'+block+'</ul>';return '<p>'+block.replace(/\n/g,'<br>')+'</p>';}).join('');return t;}
function addUser(text){var m=document.createElement('div');m.className='message user';m.textContent=text;$('#messages').appendChild(m);setChatMode(true);updateChatScroll();}
function addAi(text,streaming){var m=document.createElement('div');m.className='message ai';var label=document.createElement('div');label.className='label';label.innerHTML='<span>MOSHARROF</span><span class="timer"></span>';var body=document.createElement('div');body.className='ai-text'+(streaming?' streaming':'');body.innerHTML=formatAi(text);m.appendChild(label);m.appendChild(body);$('#messages').appendChild(m);if(window.MosharrofEntityEngine){try{window.MosharrofEntityEngine.attach(m,{text:text});}catch(e){}}updateChatScroll();return {el:m,body:body,label:label};}
function streamText(el,text,cb){var i=0,parts=text.split(/(\s+)/);function step(){if(i>=parts.length){el.classList.remove('streaming');if(cb)cb();return;}el.innerHTML=formatAi(parts.slice(0,i+1).join(''));i++;updateChatScroll();setTimeout(step,18+Math.random()*22);}step();}
async function send(){var input=$('#input');var text=(input.value||'').trim();if(!text)return;input.value='';addUser(text);var ai=addAi('',true);var t0=Date.now();try{var r=await fetch(CHAT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});var data=await r.json().catch(function(){return {};});var reply=(data&& (data.reply||data.response||data.message||data.text))||'দুঃখিত, এখন উত্তর দিতে পারছি না। আবার চেষ্টা করুন।';streamText(ai.body,reply,function(){var sec=((Date.now()-t0)/1000).toFixed(1);ai.label.querySelector('.timer').textContent=sec+'s';});}catch(e){ai.body.classList.remove('streaming');ai.body.innerHTML=formatAi('নেটওয়ার্ক সমস্যা। পরে আবার চেষ্টা করুন।');}}
$('#form').addEventListener('submit',function(e){e.preventDefault();send();});
$('#openLeft').addEventListener('click',function(){drawer(L);});
$('#openRight').addEventListener('click',function(){drawer(R);});
$('#closeLeft').addEventListener('click',closeAll);
$('#closeRight').addEventListener('click',closeAll);
$('#scrim').addEventListener('click',closeAll);
$$('.nav button').forEach(function(b){b.addEventListener('click',function(){msg(b.getAttribute('data-toast')||'');closeAll();});});
$$('[data-mod]').forEach(function(b){b.addEventListener('click',function(){msg(b.querySelector('b')?b.querySelector('b').textContent:'মডিউল');closeAll();});});
$('#plus').addEventListener('click',function(){msg('অ্যাটাচমেন্ট শীঘ্রই আসছে');});
$$('.chip').forEach(function(c){c.addEventListener('click',function(){msg(c.textContent.trim());});});
$('#add').addEventListener('click',function(){msg('নতুন মডিউল শীঘ্রই');});
// Icon bootstrap placeholder
if(window.MosharrofEntityEngine&&window.MosharrofEntityEngine.bootUI){try{window.MosharrofEntityEngine.bootUI();}catch(e){}}
})();
</script>
