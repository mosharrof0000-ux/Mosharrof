<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="application-name" content="Mosharrof">
<title>MOSHARROF AI — Full Screen V5</title>
<!-- Mosharrof live pages contract -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atma:wght@300;400;500;600;700&family=Galada&family=Hind+Siliguri:wght@300;400;500;600;700&family=Mina:wght@400;700&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --header-h:56px;
  --bg:#000;--surface:#171717;--surface2:#202123;--surface3:#2f2f2f;
  --text:#f5f5f5;--muted:#a1a1aa;--border:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif}
button,textarea,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:transparent}
.app{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden;
  background:linear-gradient(145deg,#000 0%,#0a0a0a 100%)}
.main{position:absolute;inset:0;display:flex;flex-direction:column}
header.top{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:calc(var(--header-h) + var(--safe-t));
  padding:var(--safe-t) 12px 0;
  display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;
  background:#000;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.round{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:#050505;color:#fff;display:grid;place-items:center;padding:0;box-shadow:0 4px 16px rgba(0,0,0,.45);transition:transform .16s ease,background .16s ease,border-color .16s ease}
.round:active{transform:scale(.92)}
.round:hover{background:#111;border-color:rgba(255,255,255,.3)}
.menu-icon{width:21px;height:21px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand{text-align:center}.brand b{font-size:14px;color:#f5f5f5}.brand small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.mlogo{display:inline-grid;width:28px;height:28px;border-radius:50%;place-items:center;background:#2a2a2a;font-weight:900;margin-right:4px;vertical-align:middle;font-size:12px}
.content{position:absolute;inset:0;overflow:hidden}
.hero{position:absolute;inset:0;display:flex;flex-direction:column}
.chat-scroll{
  position:absolute;left:0;right:0;top:0;bottom:0;
  display:flex;flex-direction:column;justify-content:flex-start;min-height:0;
  overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior-y:contain;
  padding:calc(var(--header-h) + var(--safe-t) + 16px) 14px 140px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch
}
.chat-scroll::-webkit-scrollbar{display:none}
.messages{width:min(900px,100%);margin:auto auto 0;display:flex;flex-direction:column;gap:20px;flex-shrink:0}
.message{max-width:min(88%,760px);font-size:15px;line-height:1.7;word-break:break-word;color:#ececec}
.message .label{display:block;font-size:11px;color:#8e8e93;margin-bottom:6px}
.message .time{display:inline-block;font-size:10px;color:#6b6b70;margin:0;white-space:nowrap}.message-meta-row{display:flex;align-items:center;gap:7px;min-height:26px}.message-speak-shortcut,.message-download-shortcut{display:inline-grid;place-items:center;width:28px;height:26px;padding:0;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:#080808;color:#f2f2f2}.message-speak-shortcut svg,.message-download-shortcut svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.message-speak-shortcut:active,.message-download-shortcut:active{background:#303030}.message-speak-shortcut.is-ready,.message-action.is-ready,.message-speak-shortcut.is-speaking,.message-action.is-speaking{background:#12351f;border-color:rgba(74,190,110,.8);color:#b9f5c9}.message-speak-shortcut.is-stop-requested,.message-action.is-stop-requested{background:#3a1014;border-color:rgba(239,68,68,.85);color:#ffb4b4}
.message.user{align-self:flex-end;background:var(--surface3);padding:11px 16px;border-radius:20px;border-bottom-right-radius:6px;max-width:min(80%,680px)}
.message.ai{align-self:flex-start;max-width:min(92%,760px)}

/* MOSHARROF rich-text response system */
.message.ai .rich-content{font-size:15.5px;line-height:1.82;letter-spacing:.005em;color:#ededed;overflow-wrap:anywhere}
.message.ai .rich-content>*+*{margin-top:1em}
.message.ai .rich-content h1,.message.ai .rich-content h2,.message.ai .rich-content h3,.message.ai .rich-content h4{font-weight:750;line-height:1.35;letter-spacing:-.02em;color:#fff;margin-top:1.25em;margin-bottom:.5em}
.message.ai .rich-content h1{font-size:1.55em}.message.ai .rich-content h2{font-size:1.32em}.message.ai .rich-content h3{font-size:1.14em}.message.ai .rich-content h4{font-size:1.03em}
.message.ai .rich-content p{margin:.65em 0}.message.ai .rich-content strong{font-weight:750;color:#fff}.message.ai .rich-content em{font-style:italic;color:#e4e4e7}
.message.ai .rich-content ul,.message.ai .rich-content ol{padding-left:1.55em;margin:.65em 0}.message.ai .rich-content li{padding-left:.25em;margin:.28em 0}.message.ai .rich-content li::marker{color:#a1a1aa}
.message.ai .rich-content blockquote{margin:.9em 0;padding:.55em .9em;border-left:3px solid #777;border-radius:0 10px 10px 0;background:rgba(255,255,255,.045);color:#d4d4d8}
.message.ai .rich-content a{color:#9ecbff;text-decoration:underline;text-decoration-color:rgba(158,203,255,.5);text-underline-offset:3px}.message.ai .rich-content hr{border:0;border-top:1px solid rgba(255,255,255,.16);margin:1.25em 0}
.message.ai .rich-content :not(pre)>code{padding:.13em .4em;border:1px solid rgba(255,255,255,.12);border-radius:6px;background:#202124;color:#f0c98b;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.88em}
.message.ai .rich-content .table-wrap{max-width:100%;overflow-x:auto;border:1px solid rgba(255,255,255,.14);border-radius:12px;margin:1em 0}
.message.ai .rich-content table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9em;line-height:1.55;background:#0c0c0c}
.message.ai .rich-content th,.message.ai .rich-content td{padding:10px 12px;text-align:left;vertical-align:top;border-right:1px solid rgba(255,255,255,.09);border-bottom:1px solid rgba(255,255,255,.09)}
.message.ai .rich-content th{background:#202124;color:#fff;font-weight:700;white-space:nowrap}.message.ai .rich-content tr:last-child td{border-bottom:0}.message.ai .rich-content th:last-child,.message.ai .rich-content td:last-child{border-right:0}
.message.ai .rich-content .code-block{margin:1em 0;border:1px solid rgba(255,255,255,.13);border-radius:13px;overflow:hidden;background:#0d1117;box-shadow:0 5px 18px rgba(0,0,0,.18)}
.message.ai .rich-content .code-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;background:#171b22;border-bottom:1px solid rgba(255,255,255,.1);font-size:11px;color:#aeb6c2}
.message.ai .rich-content .code-toolbar .code-language{text-transform:lowercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.message.ai .rich-content .copy-code{flex:none;border:1px solid rgba(255,255,255,.16);border-radius:7px;background:#252a33;color:#f4f4f5;padding:5px 9px;font-size:11px}.message.ai .rich-content .copy-code:active{background:#3b414c}
.message.ai .rich-content pre{margin:0;max-width:100%;overflow:auto;padding:14px;background:#0d1117;color:#e6edf3;font:12.5px/1.7 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;tab-size:2;scrollbar-width:thin}
.message.ai .rich-content pre code{font:inherit;white-space:pre}.message.ai .rich-content .code-block pre code{padding:0;border:0;border-radius:0;background:transparent;color:inherit}.message.ai .rich-content img{max-width:100%;height:auto;border-radius:10px}

/* Dynamic Bengali typography: font families are mapped by the central registry. */
.message.ai .rich-content.font-song{font-size:17px;line-height:2.02;letter-spacing:.012em}
.message.ai .rich-content.font-song h1,.message.ai .rich-content.font-song h2,.message.ai .rich-content.font-song h3{line-height:1.5;letter-spacing:0}
.message.ai .rich-content.font-song p{margin:1em 0}
.message.ai .rich-content.font-poem{font-size:16.5px;line-height:2.02;letter-spacing:.008em}
.message.ai .rich-content.font-poem h1,.message.ai .rich-content.font-poem h2,.message.ai .rich-content.font-poem h3{line-height:1.55;letter-spacing:0}
.message.ai .rich-content.font-poem p{margin:.85em 0}
.message.ai .rich-content.font-story{font-size:15.5px;line-height:1.88}
.message.ai .rich-content.font-story h1{font-size:1.65em}
.message.ai .rich-content.font-story h2{font-size:1.38em}
.message.ai .rich-content.font-story h3{font-size:1.16em}
.message.ai .rich-content.font-song blockquote,.message.ai .rich-content.font-poem blockquote{border-left-color:#9b83c7;background:rgba(155,131,199,.08)}
.message.ai .rich-content .font-song,.message.ai .rich-content .font-poem,.message.ai .rich-content .font-story{overflow-wrap:anywhere}
.song-design-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 2px;padding:0 2px;color:#aeb6c2;font-size:11px}
.song-design-next{border:1px solid rgba(145,165,210,.42);border-radius:999px;background:rgba(72,92,140,.16);color:inherit;padding:7px 11px;font:inherit;cursor:pointer}
.song-design-next:active{background:rgba(95,125,190,.3)}
.song-design-label{opacity:.8}
.message.ai .rich-content.font-song[data-song-style]{transition:background .2s ease,border-color .2s ease}

@media(max-width:480px){.message.ai .rich-content{font-size:15px;line-height:1.78}.message.ai .rich-content th,.message.ai .rich-content td{padding:8px 9px}.message.ai .rich-content pre{font-size:12px;padding:11px}}

.message-actions-wrap{display:flex;flex-direction:column;align-items:flex-start;margin-top:7px;gap:6px}
.message.user .message-actions-wrap{align-items:flex-end;margin-right:-5px;margin-bottom:-3px}
.message-actions-toggle{width:28px;height:24px;display:inline-grid;place-items:center;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:#080808;color:#f2f2f2;font-size:16px;line-height:1}
.message-actions{display:none;align-items:center;flex-wrap:wrap;gap:5px;padding:4px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:#050505}
.message-actions-wrap.open .message-actions{display:flex}
.message-action{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:30px;padding:5px 8px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:#111;color:#f5f5f5;font-size:11px;line-height:1.2;white-space:nowrap}
.message-action:active,.message-actions-toggle:active{background:#303030}
.message-action svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.message-action:focus-visible,.message-actions-toggle:focus-visible{outline:2px solid #aaa;outline-offset:2px}
@media(hover:hover){.message-actions-wrap:hover .message-actions{display:flex}}
.message-feedback-shortcut{display:inline-grid;place-items:center;width:28px;height:26px;padding:0;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:#080808;color:#f2f2f2;flex:none}
.message-feedback-shortcut svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.message-feedback-shortcut:active,.message-feedback-shortcut.is-active{background:#102218;border-color:rgba(91,190,125,.7);color:#b9f5c9}
.message-feedback-shortcut.online-feedback-shortcut:active,.message-feedback-shortcut.online-feedback-shortcut.is-active-online{background:#351313;border-color:rgba(239,83,80,.85);color:#ffb4b4}
.feedback-panel{display:none;width:min(340px,calc(100vw - 54px));max-width:100%;padding:10px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:#080808;box-shadow:0 8px 24px rgba(0,0,0,.35);gap:8px}
.feedback-panel.open{display:flex;flex-direction:column}
.feedback-title{font-size:12px;font-weight:650;color:#f5f5f5;line-height:1.5}
.feedback-options{display:flex;flex-direction:column;gap:5px}
.feedback-option{display:flex;align-items:center;gap:8px;width:100%;padding:8px;text-align:left;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:#111;color:#e5e5e5;font-size:12px;line-height:1.4}
.feedback-option .feedback-check{width:16px;height:16px;flex:none;display:grid;place-items:center;border:1px solid rgba(255,255,255,.32);border-radius:50%;font-size:10px}
.feedback-option.selected{border-color:#39865A;background:#102218}
.feedback-option.selected .feedback-check{border-color:#65bd83;background:#28623d;color:#fff}
.feedback-panel.online-feedback-panel .feedback-option.selected{border-color:#d84a4a;background:#351313}
.feedback-panel.online-feedback-panel .feedback-option.selected .feedback-check{border-color:#f06b6b;background:#8f2424;color:#fff}
.feedback-comment{display:block;width:100%;min-height:54px;max-height:110px;resize:vertical;padding:8px;border:1px solid rgba(255,255,255,.14);border-radius:8px;outline:0;background:#141414;color:#f5f5f5;font-size:12px;line-height:1.45}
.feedback-comment::placeholder{color:#8e8e93}
.feedback-buttons{display:flex;align-items:center;flex-wrap:wrap;gap:5px}
.feedback-button{min-height:30px;padding:6px 9px;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:#171717;color:#f5f5f5;font-size:11px}
.feedback-button.primary{border-color:rgba(91,190,125,.55);background:#163321}
.feedback-panel.online-feedback-panel .feedback-button.primary{border-color:rgba(239,83,80,.75);background:#521b1b;color:#ffe3e3}
.feedback-button.negative{border-color:rgba(239,83,80,.65);background:#351313;color:#ffb4b4}
.feedback-button:active{background:#303030}
.message.generated-image{max-width:min(94%,820px)}
.generated-image img{display:block;width:100%;max-width:820px;border-radius:16px;border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 28px rgba(0,0,0,.45)}
.generated-image .image-actions{display:flex;gap:8px;margin-top:8px}
.generated-image .image-actions a{display:inline-flex;align-items:center;padding:7px 11px;border-radius:12px;background:#222;color:#fff;text-decoration:none;font-size:12px}
.message.typing .dots{display:inline-flex;gap:4px}
.message.typing .dots span{width:6px;height:6px;border-radius:50%;background:#8e8e93;animation:blink 1.2s infinite}
.message.typing .dots span:nth-child(2){animation-delay:.2s}
.message.typing .dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.quick{display:none}
.composer{
  position:fixed;left:12px;right:12px;bottom:max(16px,calc(12px + var(--safe-b)));
  max-width:820px;margin-left:auto;margin-right:auto;z-index:9999;
  background:#2f2f2f;border:1px solid rgba(255,255,255,.18);border-radius:24px;
  padding:8px 10px;box-shadow:0 8px 32px rgba(0,0,0,.7)
}
.row{display:flex;align-items:flex-end;gap:6px}
.composer-tools{position:relative;flex:none;display:flex;align-items:center}
.composer-tool-toggle,.composer-action,.send{width:36px;height:36px;flex:none;display:inline-grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.16);border-radius:9px;background:#080808;color:#f2f2f2;transition:transform .16s ease,background .16s ease,border-color .16s ease}
.composer-tool-toggle{font-size:21px;line-height:1}
.composer-tool-toggle:active,.composer-action:active,.send:active{transform:scale(.94);background:#303030}
.composer-tool-toggle:hover,.composer-action:hover,.send:hover:not(:disabled){background:#111;border-color:rgba(255,255,255,.3)}
.composer-action.is-listening{background:#123d2a;border-color:rgba(74,222,128,.95);color:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.14)}
.composer-action.is-listening svg{transform-origin:50% 50%;animation:voice-mic-bob .68s ease-in-out infinite alternate}
@keyframes voice-mic-bob{from{transform:translateY(-2px) scale(1.02)}to{transform:translateY(2px) scale(.96)}}
.composer-action.is-processing{width:76px;min-width:76px;border-radius:18px;background:#111;border-color:rgba(255,255,255,.22);color:#f5f5f5;font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;letter-spacing:.01em;cursor:wait}
.composer-action.is-processing .voice-timer{white-space:nowrap}
.composer-action.is-transcription-success{width:76px;min-width:76px;background:#123d2a;border-color:#4ade80;color:#4ade80;font-size:11px;font-weight:750;font-variant-numeric:tabular-nums}
.composer-action.is-transcription-error{width:76px;min-width:76px;background:#451a1a;border-color:#f87171;color:#f87171;font-size:11px;font-weight:750;font-variant-numeric:tabular-nums}
.composer-action:disabled{opacity:.55;cursor:not-allowed}
.composer-tool-toggle:focus-visible,.composer-action:focus-visible,.send:focus-visible{outline:2px solid #aaa;outline-offset:2px}
.composer-action svg,.send svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.composer-tools-menu{position:absolute;left:0;bottom:44px;display:none;align-items:center;gap:5px;padding:5px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:#050505;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:2}
.composer-tools-menu.open{display:flex}
.attach{position:relative}
.attach input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.image-preview{display:none;align-items:center;gap:8px;margin:0 4px 7px;padding:6px 8px;border-radius:14px;background:#202020;border:1px solid rgba(255,255,255,.1)}
.image-preview.show{display:flex}
.image-preview img{width:42px;height:42px;object-fit:cover;border-radius:9px}
.image-preview span{font-size:11px;color:#d4d4d8;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.image-preview button{width:28px;height:28px;border-radius:50%;color:#fff;background:#333;font-size:15px}
.input{flex:1;min-width:0;min-height:40px;max-height:120px;border:0;outline:0;background:transparent;padding:10px 6px;font-size:16px;line-height:1.4;resize:none;overflow-y:auto;color:var(--text)}
.input::placeholder{color:#8e8e93}
.send:disabled{opacity:.35}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10000;opacity:0;visibility:hidden;transition:.2s}
.scrim.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;bottom:0;width:min(300px,85vw);z-index:10001;background:var(--surface);padding:14px;padding-top:calc(14px + var(--safe-t));padding-bottom:calc(14px + var(--safe-b));transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
.drawer.left{left:0;transform:translateX(-105%);border-right:1px solid var(--border)}
.drawer.right{right:0;transform:translateX(105%);border-left:1px solid var(--border)}
.drawer.open{transform:translateX(0)}
.dhead{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.dlogo{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-weight:900}
.dclose{margin-left:auto;padding:6px;font-size:18px}
.nav{display:flex;flex-direction:column;gap:12px}
.nav-family{padding:10px;border:1px solid var(--border);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;gap:5px}
.nav-family-title{display:flex;align-items:center;gap:8px;padding:2px 4px 8px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.09em;text-transform:uppercase}
.nav-family-title svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-family-items{display:flex;flex-direction:column;gap:4px}
.nav button{padding:10px;border-radius:12px;color:#e5e5e5;text-align:left;display:flex;flex-direction:row;gap:10px;align-items:center;width:100%;min-height:48px;border:1px solid transparent;transition:background .16s ease,border-color .16s ease}
.nav button:hover{background:var(--surface2)}
.nav button.active{background:var(--surface2);border-color:var(--border)}
.nav-icon{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--surface2);color:var(--text)}
.nav-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.active .nav-icon{background:var(--surface3);color:var(--text)}
.nav-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:3px}
.nav-copy span{font-size:13px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.nav button small{font-size:10px;color:var(--muted);font-weight:400;line-height:1.35}
.nav button:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
.history-tools{display:flex;flex-direction:column;gap:8px;padding:4px 0 12px;border-bottom:1px solid var(--border);margin-bottom:10px}
.history-search{width:100%;min-height:42px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:#101010;color:#f5f5f5;padding:10px 12px;font-size:13px;outline:none}
.history-search:focus{border-color:rgba(255,255,255,.38)}.history-search::placeholder{color:#8e8e93}
.history-new{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:42px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:#242424;color:#f5f5f5;font-size:13px;font-weight:650}
.history-new:active{background:#333}
.history-heading{padding:4px 4px 2px;color:var(--muted);font-size:11px;font-weight:700}
.history-list{display:flex;flex-direction:column;gap:4px;max-height:min(42vh,420px);overflow-y:auto;overscroll-behavior:contain;padding:2px 0 8px;scrollbar-width:thin}
.history-item{display:flex;align-items:center;gap:8px;width:100%;min-height:42px;padding:9px 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:#e5e5e5;text-align:left;font-size:12px;line-height:1.4}
.history-item span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.history-item small{flex:none;color:#8e8e93;font-size:10px}.history-item:hover{background:#202020}.history-item.active{background:#252525;border-color:rgba(255,255,255,.12)}
.history-empty{padding:10px 8px;color:#8e8e93;font-size:12px;line-height:1.5}
.session-meta{font-size:11px;color:var(--muted);padding:8px 4px 12px;line-height:1.5;border-bottom:1px solid var(--border);margin-bottom:8px}
.toast{position:fixed;z-index:10002;bottom:140px;left:50%;transform:translate(-50%,12px);opacity:0;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px 14px;font-size:12px;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.voice-bar{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:9998;font-size:11px;color:var(--muted);opacity:0;transition:.2s;pointer-events:none}
.voice-bar.show{opacity:1}
.audio-setting-row{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--border);border-radius:12px;background:#111}
.audio-setting-row label{font-size:12px;color:#e5e5e5;font-weight:650}
.audio-setting-row small{font-size:10px;line-height:1.45;color:var(--muted)}
.audio-setting-row select{width:100%;min-height:40px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:#080808;color:#f5f5f5;padding:8px;font-size:12px}

  function setVoiceButtonState(listening){voiceListening=!!listening;[composerVoiceBtn,$("#voiceBtn")].forEach(function(button){if(!button)return;button.classList.toggle("is-listening",voiceListening);button.setAttribute("aria-pressed",voiceWanted?"true":"false");button.title=voiceWanted?"অডিও রেকর্ড হচ্ছে · শেষ করতে চাপুন":voiceProcessing?"অডিও থেকে লেখা তৈরি হচ্ছে":"গান/কথা রেকর্ড করুন";});}
  function formatVoiceElapsed(){var seconds=Math.max(0,Math.floor((Date.now()-voiceProcessingStartedAt)/1000));return String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");}
  function startVoiceProcessingTimer(){if(voiceTimerInterval)clearInterval(voiceTimerInterval);if(voiceTimerRestoreTimeout)clearTimeout(voiceTimerRestoreTimeout);voiceMicMarkup=voiceMicMarkup||composerVoiceBtn.innerHTML;voiceProcessingStartedAt=Date.now();hideV();composerVoiceBtn.classList.remove("is-listening","is-transcription-success","is-transcription-error");composerVoiceBtn.classList.add("is-processing");composerVoiceBtn.innerHTML='<span class="voice-timer" aria-hidden="true">00:00</span>';composerVoiceBtn.setAttribute("aria-label","অডিও থেকে লেখা তৈরি হচ্ছে, সময় "+formatVoiceElapsed());composerVoiceBtn.title="টেক্সটে রূপান্তরের সময়";var tick=function(){var value=formatVoiceElapsed();var timer=composerVoiceBtn.querySelector(".voice-timer");if(timer)timer.textContent=value;composerVoiceBtn.setAttribute("aria-label","অডিও থেকে লেখা তৈরি হচ্ছে, সময় "+value);};tick();voiceTimerInterval=setInterval(tick,200);}
  function finishVoiceProcessingTimer(success){if(!voiceProcessingStartedAt)return;var elapsed=((Date.now()-voiceProcessingStartedAt)/1000).toFixed(1);if(voiceTimerInterval){clearInterval(voiceTimerInterval);voiceTimerInterval=null;}composerVoiceBtn.classList.remove("is-processing","is-listening");composerVoiceBtn.classList.add(success?"is-transcription-success":"is-transcription-error");composerVoiceBtn.innerHTML=success?("✓ "+elapsed+"s"):("! "+elapsed+"s");composerVoiceBtn.setAttribute("aria-label",success?"অডিও থেকে লেখা তৈরি হয়েছে, "+elapsed+" সেকেন্ডে":"অডিও থেকে লেখা তৈরি ব্যর্থ, "+elapsed+" সেকেন্ডে");composerVoiceBtn.title=success?"লেখা তৈরি সম্পন্ন":"লেখা তৈরি ব্যর্থ";voiceTimerRestoreTimeout=setTimeout(function(){if(voiceWanted||voiceProcessing)return;composerVoiceBtn.innerHTML=voiceMicMarkup||composerVoiceBtn.innerHTML;composerVoiceBtn.classList.remove("is-processing","is-transcription-success","is-transcription-error","is-listening");composerVoiceBtn.setAttribute("aria-label","ভয়েস ইনপুট");composerVoiceBtn.title="ভয়েস ইনপুট";voiceProcessingStartedAt=0;},2200);}

  function releaseVoiceStream(){if(voiceStream){voiceStream.getTracks().forEach(function(track){track.stop();});voiceStream=null;}}
  function transcribeAudioBlob(blob){
    if(!blob||!blob.size){voiceProcessing=false;releaseVoiceStream();showVoiceMessage("কোনো অডিও রেকর্ড হয়নি। আবার চেষ্টা করুন।");return;}
    if(blob.size>12*1024*1024){voiceProcessing=false;releaseVoiceStream();showVoiceMessage("অডিওটি অনেক বড় হয়েছে। ছোট ছোট অংশে রেকর্ড করুন।");return;}

        .then(function(response){return response.json().catch(function(){return {};}).then(function(data){if(!response.ok)throw new Error(data.error||("HTTP "+response.status));return data;});})
        .then(function(data){

        })
        .catch(function(error){var message=String(error&&error.message||"");finishVoiceProcessingTimer(false);showVoiceMessage(message==="transcription_provider_not_configured"?"Gemini অডিও সংযোগ প্রস্তুত নয়।":message==="audio_too_large"?"অডিওটি ছোট করে আবার চেষ্টা করুন।":"অডিও থেকে লেখা তৈরি হয়নি। সংযোগ বা অডিও ফরম্যাট পরীক্ষা করে আবার চেষ্টা করুন।");})
        .finally(function(){voiceProcessing=false;releaseVoiceStream();setVoiceButtonState(false);});
    };

  }

  async function startV(){
    if(voiceProcessing)return;
    if(voiceWanted){
      voiceWanted=false;setVoiceButtonState(false);
      if(voiceRecorder&&voiceRecorder.state!=="inactive"){try{voiceRecorder.stop();}catch(e){voiceProcessing=false;releaseVoiceStream();showVoiceMessage("রেকর্ডিং বন্ধ করা যায়নি।");}}
      return;
    }
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){var unsupported="এই ব্রাউজারে অডিও রেকর্ডিং সমর্থিত নয়। আপডেটেড Chrome ব্যবহার করুন।";toast(unsupported,4000);showVoiceMessage(unsupported);return;}
    voiceBaseText=input.value.trim();voiceChunks=[];voiceWanted=true;setVoiceButtonState(true);showV("শুনছি… পুরো গান/কথা বলুন; শেষ হলে মাইক্রোফোনে চাপুন");

      voiceRecorder.onstop=function(){voiceWanted=false;setVoiceButtonState(false);var blob=new Blob(voiceChunks,{type:voiceRecorder.mimeType||"audio/webm"});transcribeAudioBlob(blob);};
      voiceRecorder.start(1000);
    }catch(error){voiceWanted=false;setVoiceButtonState(false);releaseVoiceStream();showVoiceMessage(audioErrorMessage(error));}
  }
