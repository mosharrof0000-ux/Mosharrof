<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MOSHARROF AI — Full Screen V5</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --bg:#000;--surface:#171717;--surface2:#202123;--surface3:#2f2f2f;
  --text:#f5f5f5;--muted:#a1a1aa;--border:rgba(255,255,255,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif}
button,textarea,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:transparent}
.app{position:fixed;inset:0;width:100vw;height:100dvh;min-height:100svh;background:#000;overflow:hidden}
.main{position:absolute;inset:0;display:flex;flex-direction:column}
header.top{
  position:absolute;top:0;left:0;right:0;z-index:80;height:auto;min-height:58px;
  padding:calc(7px + var(--safe-t)) 12px 7px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  background:rgba(255,255,255,.05);border:0
}
.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:#111;color:#f5f5f5;display:grid;place-items:center;font-size:20px}
.left-btn{justify-self:start}.right-btn{justify-self:end}
.brand{text-align:center}.brand b{font-size:14px}.brand small{display:block;font-size:9px;color:var(--muted);margin-top:1px}
.mlogo{display:inline-grid;width:32px;height:32px;border-radius:50%;place-items:center;background:#2a2a2a;font-weight:900;margin-right:4px;vertical-align:middle}
.content{position:absolute;inset:0;overflow:hidden}
.hero{position:absolute;inset:0;display:flex;flex-direction:column}
.chat-scroll{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  overflow-y:auto;overflow-x:hidden;padding:calc(70px + var(--safe-t)) 12px calc(100px + var(--safe-b));
  scrollbar-width:none;-webkit-overflow-scrolling:touch
}
.chat-scroll::-webkit-scrollbar{display:none}
.messages{width:min(900px,100%);margin:0 auto;display:flex;flex-direction:column;gap:22px}
.message{max-width:min(85%,760px);font-size:15px;line-height:1.7;word-break:break-word;color:#ececec}
.message .label{display:block;font-size:11px;color:#8e8e93;margin-bottom:6px}
.message.user{align-self:flex-end;background:var(--surface3);padding:11px 16px;border-radius:20px;border-bottom-right-radius:6px;max-width:min(78%,680px)}
.message.ai{align-self:flex-start;max-width:min(92%,760px)}
.message.typing .dots{display:inline-flex;gap:4px}
.message.typing .dots span{width:6px;height:6px;border-radius:50%;background:#8e8e93;animation:blink 1.2s infinite}
.message.typing .dots span:nth-child(2){animation-delay:.2s}
.message.typing .dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.composer{
  position:absolute;left:12px;right:12px;bottom:calc(10px + var(--safe-b));
  max-width:820px;margin:0 auto;z-index:85;
  background:var(--surface3);border:1px solid var(--border);border-radius:26px;padding:7px 8px
}
.row{display:flex;align-items:flex-end;gap:6px}
.plus{width:42px;height:42px;flex:none;border-radius:50%;color:#e5e5e5;font-size:24px;display:grid;place-items:center}
.input{flex:1;min-width:0;min-height:42px;max-height:140px;border:0;outline:0;background:transparent;padding:9px 8px;font-size:15px;resize:none;overflow-y:auto;color:var(--text)}
.input::placeholder{color:#8e8e93}
.send{width:40px;height:40px;flex:none;border-radius:50%;background:#f4f4f5;color:#111;font-size:18px;display:grid;place-items:center}
.send:disabled{opacity:.4}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:90;opacity:0;visibility:hidden;transition:.2s}
.scrim.open{opacity:1;visibility:visible}
.drawer{position:absolute;top:var(--safe-t);bottom:var(--safe-b);width:min(320px,86vw);z-index:95;background:var(--surface);padding:13px;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.drawer.left{left:0;transform:translateX(-105%);border-right:1px solid var(--border)}
.drawer.right{right:0;transform:translateX(105%);border-left:1px solid var(--border)}
.drawer.open{transform:translateX(0)}
.dhead{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.dlogo{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-weight:900}
.dclose{margin-left:auto;padding:6px;font-size:18px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{padding:12px;border-radius:14px;color:#e5e5e5;text-align:left;display:flex;gap:12px;align-items:center}
.nav button:hover,.nav button.active{background:var(--surface2)}
.toast{position:absolute;z-index:100;bottom:calc(110px + var(--safe-b));left:50%;transform:translate(-50%,12px);opacity:0;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px 14px;font-size:12px;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.voice-bar{position:absolute;left:50%;bottom:calc(70px + var(--safe-b));transform:translateX(-50%);z-index:86;font-size:11px;color:var(--muted);opacity:0;transition:.2s;pointer-events:none}
.voice-bar.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <header class="top">
      <button class="round left-btn" id="leftBtn" aria-label="Menu">☰</button>
      <div class="brand"><span class="mlogo">M</span><b>MOSHARROF AI</b><small>Intelligent Entity</small></div>
      <button class="round right-btn" id="rightBtn" aria-label="Options">⋮</button>
    </header>
    <div class="content">
      <div class="hero">
        <div class="chat-scroll" id="chatScroll">
          <div class="messages" id="messages">
            <div class="message ai"><span class="label">MOSHARROF AI · core</span>আমি কীভাবে আপনাকে সাহায্য করতে পারি?</div>
          </div>
        </div>
        <div class="composer">
          <div class="row">
            <button class="plus" id="plusBtn" aria-label="Voice">+</button>
            <textarea class="input" id="input" placeholder="আপনার প্রশ্ন লিখুন..." rows="1"></textarea>
            <button class="send" id="sendBtn" aria-label="Send">➤</button>
          </div>
        </div>
        <div class="voice-bar" id="voiceStatus">Voice ready</div>
      </div>
    </div>
  </main>
  <aside class="drawer left" id="drawerLeft" aria-hidden="true"></aside>
  <aside class="drawer right" id="drawerRight" aria-hidden="true"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast"></div>
</div>
<script>
(function(){
  var REG={core:"coordination and governance",chat:"conversation interface",sidebar:"navigation and entity discovery",voice:"context-aware voice processing",storage:"file indexing and organization",tool_factory:"safe tool creation and execution",quran_research:"Quran language research"};
  function $(s){return document.querySelector(s);}
  var msgEl=$("#messages"),scrollEl=$("#chatScroll"),input=$("#input"),sendBtn=$("#sendBtn"),plusBtn=$("#plusBtn");
  var leftBtn=$("#leftBtn"),rightBtn=$("#rightBtn"),scrim=$("#scrim"),dL=$("#drawerLeft"),dR=$("#drawerRight");
  var toastEl=$("#toast"),vStatus=$("#voiceStatus");
  var QE=["কি","কী","কেন","কোথায়","কোথায়","কখন","কীভাবে","কিভাবে","কত","কার","কে","কোন","কোনটি"];
  var CM={"গবেষনা":"গবেষণা","প্রজেকট":"প্রজেক্ট","খুজে":"খুঁজে","কোরান":"কুরআন","কুরান":"কুরআন","মোশারফ":"মোশাররফ","করতেছ":"করছ"};

  function punct(t){return String(t||"").trim().split(/(?:\n+|\s{3,})/).filter(Boolean).map(function(c){var v=c.trim();if(!v)return"";if(/[।?!,;:]$/.test(v))return v;return QE.some(function(w){return v.endsWith(w);})?v+"?":v+"।";}).filter(Boolean).join(" ");}
  function correct(t){var v=String(t||"").replace(/\s+/g," ").trim();var c=[];for(var f in CM){if(!Object.prototype.hasOwnProperty.call(CM,f))continue;var to=CM[f];var r=new RegExp("(^|\\s)"+f+"(?=\\s|$)","g");var n=v.replace(r,"$1"+to);if(n!==v)c.push({f:f,to:to});v=n;}v=v.replace(/(\S+)(\s+\1)+/gi,"$1");return{text:v,corrections:c};}
  function toast(m,ms){ms=ms||2000;toastEl.textContent=m;toastEl.classList.add("show");setTimeout(function(){toastEl.classList.remove("show");},ms);}
  function showV(t){vStatus.textContent=t;vStatus.classList.add("show");}
  function hideV(){vStatus.classList.remove("show");}
  function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,140)+"px";}
  function bottom(){requestAnimationFrame(function(){scrollEl.scrollTop=scrollEl.scrollHeight;});}

  function addMsg(role,text){
    var n=document.createElement("div");n.className="message "+role;
    var l=document.createElement("span");l.className="label";l.textContent=role==="user"?"আপনি":"MOSHARROF AI · core";
    n.appendChild(l);n.appendChild(document.createTextNode(text));msgEl.appendChild(n);bottom();return n;
  }
  function typing(){var n=document.createElement("div");n.className="message ai typing";n.id="typing";n.innerHTML='<span class="label">MOSHARROF AI · core</span><span class="dots"><span></span><span></span><span></span></span>';msgEl.appendChild(n);bottom();}
  function untype(){var t=$("#typing");if(t)t.remove();}

  function coreReply(t){
    return new Promise(function(resolve){
      setTimeout(function(){
        if(/কুরআন|কোরান|আয়াত|সূরা/.test(t)){resolve("কুরআন গবেষণা (quran_research) প্রস্তুত। নির্দিষ্ট আয়াত বললে প্রেক্ষাপট দিতে পারি। মডেল অ্যাডাপ্টার কানেক্ট হলে পূর্ণ উত্তর আসবে।");return;}
        if(/ভয়েস|voice/.test(t)){resolve("Voice entity সক্রিয়। + বাটনে চাপ দিয়ে বাংলায় কথা বলুন।");return;}
        if(/এন্টিটি|entity|রেজিস্ট্রি|সিস্টেম/.test(t)){resolve(Object.keys(REG).map(function(i){return "• "+i+" — "+REG[i];}).join("\n"));return;}
        resolve("Foundation UI অনলাইন। Core সক্রিয়। মডেল অ্যাডাপ্টার কানেক্ট করলে পূর্ণ AI চালু হবে। আপনি কী জানতে চান?");
      },500+Math.random()*300);
    });
  }

  var busy=false;
  function send(){
    var raw=input.value.trim();if(!raw||busy)return;
    busy=true;sendBtn.disabled=true;
    var p=correct(raw);var text=punct(p.text);
    input.value="";resize();addMsg("user",text);
    if(p.corrections.length)toast("Context corrected");
    typing();
    coreReply(text).then(function(r){untype();addMsg("ai",r);busy=false;sendBtn.disabled=false;input.focus();}).catch(function(){untype();addMsg("ai","Core-এ সমস্যা। আবার চেষ্টা করুন।");busy=false;sendBtn.disabled=false;input.focus();});
  }

  function openD(side){scrim.classList.add("open");(side==="left"?dL:dR).classList.add("open");(side==="left"?dL:dR).setAttribute("aria-hidden","false");}
  function closeD(){scrim.classList.remove("open");dL.classList.remove("open");dR.classList.remove("open");dL.setAttribute("aria-hidden","true");dR.setAttribute("aria-hidden","true");}

  dL.innerHTML='<div class="dhead"><div class="dlogo">M</div><div><strong>MOSHARROF</strong><small>Entity System</small></div><button class="dclose" id="cL">✕</button></div><nav class="nav" id="navL"></nav>';
  dR.innerHTML='<div class="dhead"><div class="dlogo">⋮</div><div><strong>Options</strong><small>chat</small></div><button class="dclose" id="cR">✕</button></div><nav class="nav"><button id="newChat">✦ New Chat</button><button id="clearMsg">⌫ Clear</button><button id="voiceBtn">🎙️ Voice</button></nav>';
  var navL=$("#navL");
  Object.keys(REG).forEach(function(id){
    var b=document.createElement("button");b.dataset.entity=id;if(id==="chat")b.className="active";
    b.innerHTML="<span style='width:24px;text-align:center'>•</span> "+id;
    b.onclick=function(){Array.prototype.forEach.call(navL.children,function(x){x.classList.remove("active");});b.classList.add("active");toast(id+" — "+REG[id]);};
    navL.appendChild(b);
  });

  var rec=null;
  function initV(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
    rec=new SR();rec.lang="bn-BD";rec.continuous=false;rec.interimResults=true;
    rec.onstart=function(){showV("Listening…");};
    rec.onresult=function(e){var t="";for(var i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;var p=correct(t);input.value=punct(p.text);resize();showV(p.corrections.length?"Context corrected":"Voice ready");};
    rec.onerror=function(e){showV("Error: "+e.error);setTimeout(hideV,2000);};
    rec.onend=function(){if(vStatus.textContent==="Listening…")hideV();else setTimeout(hideV,1500);};
  }
  function startV(){if(!rec){toast("Voice API নেই");return;}try{rec.start();}catch(e){}}

  sendBtn.onclick=send;
  input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
  input.addEventListener("input",resize);
  plusBtn.onclick=startV;
  leftBtn.onclick=function(){openD("left");};
  rightBtn.onclick=function(){openD("right");};
  scrim.onclick=closeD;
  document.addEventListener("click",function(e){
    if(e.target.id==="cL"||e.target.id==="cR")closeD();
    if(e.target.id==="newChat"){msgEl.innerHTML="";addMsg("ai","নতুন কথোপকথন। আমি কীভাবে সাহায্য করতে পারি?");closeD();toast("New chat");}
    if(e.target.id==="clearMsg"){msgEl.innerHTML="";addMsg("ai","মেসেজ মুছে ফেলা হয়েছে।");closeD();toast("Cleared");}
    if(e.target.id==="voiceBtn"){closeD();startV();}
  });

  initV();resize();input.focus();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});
  console.log("[MOSHARROF] web/index.html ready");
})();
</script>
</body>
</html>
