<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Mosharrof Karim — Intelligent Entity and AI Brain Architecture">
  <title>Mosharrof Karim</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,sans-serif;background:#080808;color:#f5f5f5;min-height:100vh}
    main{max-width:760px;margin:auto;padding:56px 20px}
    .card{border:1px solid #2b2b2b;border-radius:22px;padding:28px;background:#101010}
    h1{font-size:42px;margin:0 0 10px}
    p{line-height:1.65;color:#cfcfcf}
    .status{display:inline-flex;padding:8px 12px;border:1px solid #333;border-radius:999px;font-size:14px}
    a{color:#fff}
    pre{white-space:pre-wrap;background:#070707;padding:16px;border-radius:14px;overflow:auto}
  </style>
</head>
<body>
<main>
  <section class="card">
    <span class="status" id="status">Checking core…</span>
    <h1>Mosharrof Karim</h1>
    <p>Intelligent Entity and AI Brain Architecture</p>
    <p>This page is the public entry point for the Mosharrof Core project.</p>
    <pre id="core">Loading project contract…</pre>
    <p><a href="https://github.com/mosharrof0000-ux/Mosharrof">Open GitHub Repository</a></p>
  </section>
</main>
<script>
fetch("../config/project_manifest.json")
  .then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(m=>{
    document.querySelector("#status").textContent="Core contract available";
    document.querySelector("#core").textContent=JSON.stringify({
      project_id:m.project_id,name:m.name,owner:m.owner,
      model_strategy:m.model_strategy,first_tool_project:m.first_tool_project,
      delete_allowed:m.immutable_safety_rules.delete
    },null,2);
  })
  .catch(()=>document.querySelector("#status").textContent="Core page online");
</script>
</body>
</html>
