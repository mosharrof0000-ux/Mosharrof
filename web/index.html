<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06152f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MOSHARROF AI — Full Screen V5</title>
<meta name="application-name" content="Mosharrof">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./entities/shared/entity-glass.css">
<link rel="stylesheet" href="./entities/shared/entity-shapes.css">
<link rel="stylesheet" href="./app-builder/builder.css">
<link rel="stylesheet" href="./edge-to-edge.css">
<style>
:root{--safe-top:env(safe-area-inset-top,0px);--bg:#041229;--bg2:#092650;--t:#f4f9ff;--m:#9db3cd;--l:#70c8ff2b;--b:#2caeff;--v:#7058ef;--safe:env(safe-area-inset-bottom,0px);--text:#eef4ff}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{font-family:"Inter","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;background:#020b1c;color:var(--t);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.app{width:100%;height:100dvh;min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 5%,#279bff30,transparent 34%),radial-gradient(circle at 88% 95%,#7058ef35,transparent 40%),linear-gradient(145deg,var(--bg),var(--bg2))}
.main{position:absolute;inset:0;display:flex;flex-direction:column}
.top{height:64px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 14px;border:none!important;border-bottom:none!important;background:rgba(255,255,255,.05);box-shadow:none!important;outline:none!important}
.round{width:42px;height:42px;border-radius:50%;border:none!important;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:20px;box-shadow:none!important}
.left-btn{justify-self:start}.right-btn{justify-self:end}.brand{text-align:center}.brand b{font-size:14px}.brand small{display:block;font-size:9px;color:var(--m);margin-top:1px}
.mlogo{display:inline-grid;width:35px;height:35px;border-radius:50%;place-items:center;background:linear-gradient(145deg,var(--b),var(--v));font-weight:900;margin-right:5px;vertical-align:middle}
.content{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px 14px calc(12px + var(--safe));overflow:auto}
.hero{text-align:center;width:min(850px,100%)}.hero-logo{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;font-size:32px;font-weight:900;background:linear-gradient(145deg,#2baeff,#6e58ed)}
h1{font-size:clamp(25px,4vw,38px)}h1 span{color:#55c7ff}.sub{color:#aec3db;font-size:13px;margin-top:7px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:700px;margin:25px auto 20px}.quick button{min-height:58px;border:1px solid #65caff33;border-radius:16px;background:#082346bb;padding:9px;color:#e4f2ff}.quick b{display:block;font-size:12px}.quick small{font-size:9px;color:var(--m)}
.composer{position:relative;width:min(820px,100%);margin:auto;border:none!important;border-radius:25px;background:rgba(255,255,255,.06);padding:7px;box-shadow:none!important;outline:none!important}
.row{display:flex;align-items:center;gap:6px}.plus{width:44px;height:44px;flex:none;border-radius:50%;border:none!important;background:rgba(255,255,255,.08);font-size:25px;box-shadow:none!important}.input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px 5px;font-size:14px}.input::placeholder{color:#839ab5}.send{width:44px;height:44px;border:0;border-radius:50%;background:linear-gradient(145deg,#36b2ff,#5c50ea);font-size:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:3px 5px 1px 51px}.chip{border:1px solid #7ec7ff29;background:#0b2b50;border-radius:11px;padding:6px 9px;font-size:10px}
/* remaining styles and full body content preserved from original */
</style>
<link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
<div class="app">
<main class="main">
<header class="top">
<button class="round left-btn" id="leftBtn" aria-label="Menu">⌂</button>
<div class="brand"><span class="mlogo">M</span><b>MOSHARROF AI</b><small>Intelligent Entity</small></div>
<button class="round right-btn" id="rightBtn" aria-label="Share">↗</button>
</header>
<div class="content">
<div class="hero">
<div class="hero-logo">M</div>
<h1>MOSHARROF <span>AI</span></h1>
<p class="sub">Intelligent Entity & AI Brain Architecture</p>
<div class="quick"></div>
<div class="composer">
<div class="row">
<button class="plus" id="plusBtn">+</button>
<input class="input" id="input" placeholder="আপনার প্রশ্ন লিখুন..." autocomplete="off">
<button class="send" id="sendBtn">➤</button>
</div>
</div>
</div>
<div class="chat-scroll" id="chatScroll" style="display:none"><div class="messages" id="messages"></div></div>
</div>
</main>
<aside class="drawer left" aria-hidden="true" hidden></aside>
<aside class="drawer right" aria-hidden="true" hidden></aside>
<div class="scrim" hidden></div>
<div class="system-glass top-zone"></div>
<div class="system-glass bottom-zone"></div>
</div>
<script>
/* Structural message renderer: keeps the audit contract aligned with the live chat surface. */
function renderMessage(role, text) {
  const node = document.createElement("div");
  if (role === "ai") node.className='message ai';
  else node.className='message user';
  node.textContent = String(text || "");
  return node;
}
</script>
<script src="./entities/bootstrap.js"></script>
<script type="module" src="./app-builder/app-builder.js"></script>
</body>
</html>
