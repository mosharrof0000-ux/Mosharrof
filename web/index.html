<style>
:root{
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --header-h:56px;
  --bg:#000;--surface:#171717;--surface2:#202123;--surface3:#2f2f2f;
  --text:#f5f5f5;--muted:#a1a1aa;--border:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif}
button,textarea,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:transparent}
.app{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden;
  background:linear-gradient(145deg,#000 0%,#0a0a0a 100%)}
.main{position:absolute;inset:0;display:flex;flex-direction:column}
header.top{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:calc(var(--header-h) + var(--safe-t));
  padding:var(--safe-t) 12px 0;
  display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;
  background:#000;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.round{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:#050505;color:#fff;display:grid;place-items:center;padding:0;box-shadow:0 4px 16px rgba(0,0,0,.45);transition:transform .16s ease,background .16s ease,border-color .16s ease}
.round:active{transform:scale(.92)}
.round:hover{background:#111;border-color:rgba(255,255,255,.3)}
.menu-icon{width:21px;height:21px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand{text-align:center}.brand b{font-size:14px;color:#f5f5f5}.brand small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.mlogo{display:inline-grid;width:28px;height:28px;border-radius:50%;place-items:center;background:#2a2a2a;font-weight:900;margin-right:4px;vertical-align:middle;font-size:12px}
.content{position:absolute;inset:0;overflow:hidden}
.hero{position:absolute;inset:0;display:flex;flex-direction:column}
.chat-scroll{
  position:absolute;left:0;right:0;top:0;bottom:0;
  display:flex;flex-direction:column;justify-content:flex-end;
  overflow-y:auto;overflow-x:hidden;
  padding:calc(var(--header-h) + var(--safe-t) + 16px) 14px 140px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch
}
.chat-scroll::-webkit-scrollbar{display:none}
.messages{width:min(900px,100%);margin:0 auto;display:flex;flex-direction:column;gap:20px}
.message{max-width:min(88%,760px);font-size:15px;line-height:1.7;word-break:break-word;color:#ececec}
.message .label{display:block;font-size:11px;color:#8e8e93;margin-bottom:6px}
.message .speak{display:inline-flex;align-items:center;margin-top:7px;margin-right:6px;padding:5px 9px;border-radius:10px;background:#222;color:#ddd;font-size:11px}.message .time{display:block;font-size:10px;color:#6b6b70;margin-top:4px}
.message.user{align-self:flex-end;background:var(--surface3);padding:11px 16px;border-radius:20px;border-bottom-right-radius:6px;max-width:min(80%,680px)}
.message.ai{align-self:flex-start;max-width:min(92%,760px)}
.message.generated-image{max-width:min(94%,820px)}
.generated-image img{display:block;width:100%;max-width:820px;border-radius:16px;border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 28px rgba(0,0,0,.45)}
.generated-image .image-actions{display:flex;gap:8px;margin-top:8px}
.generated-image .image-actions a{display:inline-flex;align-items:center;padding:7px 11px;border-radius:12px;background:#222;color:#fff;text-decoration:none;font-size:12px}
.message.typing .dots{display:inline-flex;gap:4px}
.message.typing .dots span{width:6px;height:6px;border-radius:50%;background:#8e8e93;animation:blink 1.2s infinite}
.message.typing .dots span:nth-child(2){animation-delay:.2s}
.message.typing .dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.quick{display:none}
.composer{
  position:fixed;left:12px;right:12px;bottom:max(16px,calc(12px + var(--safe-b)));
  max-width:820px;margin-left:auto;margin-right:auto;z-index:9999;
  background:#2f2f2f;border:1px solid rgba(255,255,255,.18);border-radius:24px;
  padding:8px 10px;box-shadow:0 8px 32px rgba(0,0,0,.7)
}
.row{display:flex;align-items:flex-end;gap:6px}
.plus{width:40px;height:40px;flex:none;border-radius:50%;color:#e5e5e5;font-size:22px;display:grid;place-items:center}
.attach{width:40px;height:40px;flex:none;border-radius:50%;color:#fff;display:grid;place-items:center;position:relative}
.attach svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.attach input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.image-preview{display:none;align-items:center;gap:8px;margin:0 4px 7px;padding:6px 8px;border-radius:14px;background:#202020;border:1px solid rgba(255,255,255,.1)}
.image-preview.show{display:flex}
.image-preview img{width:42px;height:42px;object-fit:cover;border-radius:9px}
.image-preview span{font-size:11px;color:#d4d4d8;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.image-preview button{width:28px;height:28px;border-radius:50%;color:#fff;background:#333;font-size:15px}
.input{flex:1;min-width:0;min-height:40px;max-height:120px;border:0;outline:0;background:transparent;padding:10px 6px;font-size:16px;line-height:1.4;resize:none;overflow-y:auto;color:var(--text)}
.input::placeholder{color:#8e8e93}
.send{width:40px;height:40px;flex:none;border-radius:50%;background:#f4f4f5;color:#111;font-size:18px;display:grid;place-items:center}
.send:disabled{opacity:.35}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10000;opacity:0;visibility:hidden;transition:.2s}
.scrim.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;bottom:0;width:min(300px,85vw);z-index:10001;background:var(--surface);padding:14px;padding-top:calc(14px + var(--safe-t));padding-bottom:calc(14px + var(--safe-b));transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
.drawer.left{left:0;transform:translateX(-105%);border-right:1px solid var(--border)}
.drawer.right{right:0;transform:translateX(105%);border-left:1px solid var(--border)}
.drawer.open{transform:translateX(0)}
.dhead{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.dlogo{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-weight:900}
.dclose{margin-left:auto;padding:6px;font-size:18px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{padding:12px;border-radius:14px;color:#e5e5e5;text-align:left;display:flex;flex-direction:column;gap:2px;align-items:flex-start;width:100%}
.nav button:hover,.nav button.active{background:var(--surface2)}
.nav button small{font-size:10px;color:var(--muted);font-weight:400}
.session-meta{font-size:11px;color:var(--muted);padding:8px 4px 12px;line-height:1.5;border-bottom:1px solid var(--border);margin-bottom:8px}
.toast{position:fixed;z-index:10002;bottom:140px;left:50%;transform:translate(-50%,12px);opacity:0;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px 14px;font-size:12px;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.voice-bar{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:9998;font-size:11px;color:var(--muted);opacity:0;transition:.2s;pointer-events:none}
.voice-bar.show{opacity:1}
</style>
</head>

<script>
(function(){
  var REG={core:"coordination and governance",chat:"conversation interface",sidebar:"navigation and entity discovery",voice:"context-aware voice processing",storage:"file indexing and organization",tool_factory:"safe tool creation and execution",quran_research:"Quran language research"};
  var STORE_KEY="mosharrof_chat_v1";

  var pendingImage=null;
  var leftBtn=$("#leftBtn"),rightBtn=$("#rightBtn"),scrim=$("#scrim"),dL=$("#drawerLeft"),dR=$("#drawerRight");
  var toastEl=$("#toast"),vStatus=$("#voiceStatus");
  var QE=["কি","কী","কেন","কোথায়","কোথায়","কখন","কীভাবে","কিভাবে","কত","কার","কে","কোন","কোনটি"];
  var CM={"গবেষনা":"গবেষণা","প্রজেকট":"প্রজেক্ট","খুজে":"খুঁজে","কোরান":"কুরআন","কুরান":"কুরআন","মোশারফ":"মোশাররফ","করতেছ":"করছ"};
  function nowISO(){return new Date().toISOString();}
  function fmtTime(iso){if(!iso)return "—";try{var d=new Date(iso);return d.toLocaleString("bn-BD",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true});}catch(e){return iso;}}
  function shortTime(iso){if(!iso)return "";try{return new Date(iso).toLocaleTimeString("bn-BD",{hour:"2-digit",minute:"2-digit",hour12:true});}catch(e){return "";}}
  function loadStore(){try{var raw=localStorage.getItem(STORE_KEY);if(!raw)return null;return JSON.parse(raw);}catch(e){return null;}}
  function saveStore(data){try{localStorage.setItem(STORE_KEY,JSON.stringify(data));}catch(e){}}
  var session=loadStore();
  if(!session||!session.messages){session={openedAt:nowISO(),closedAt:null,lastActiveAt:nowISO(),messages:[]};}
  else{session.openedAt=session.openedAt||nowISO();session.lastActiveAt=nowISO();session.closedAt=null;}
  saveStore(session);
  window.addEventListener("beforeunload",function(){session.closedAt=nowISO();session.lastActiveAt=nowISO();saveStore(session);});
  document.addEventListener("visibilitychange",function(){if(document.hidden){session.closedAt=nowISO();session.lastActiveAt=nowISO();saveStore(session);}else{session.openedAt=session.openedAt||nowISO();session.lastActiveAt=nowISO();session.closedAt=null;saveStore(session);updateMeta();}});
  function punct(t){return String(t||"").trim().split(/(?:\n+|\s{3,})/).filter(Boolean).map(function(c){var v=c.trim();if(!v)return"";if(/[।?!,;:]$/.test(v))return v;return QE.some(function(w){return v.endsWith(w);})?v+"?":v+"।";}).filter(Boolean).join(" ");}
  function correct(t){var v=String(t||"").replace(/\s+/g," ").trim();var c=[];for(var f in CM){if(!Object.prototype.hasOwnProperty.call(CM,f))continue;var to=CM[f];var r=new RegExp("(^|\\s)"+f+"(?=\\s|$)","g");var n=v.replace(r,"$1"+to);if(n!==v)c.push({f:f,to:to});v=n;}v=v.replace(/(\S+)(\s+\1)+/gi,"$1");return{text:v,corrections:c};}
  function toast(m,ms){ms=ms||2000;toastEl.textContent=m;toastEl.classList.add("show");setTimeout(function(){toastEl.classList.remove("show");},ms);}
  function showV(t){vStatus.textContent=t;vStatus.classList.add("show");}

  function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,120)+"px";}

    var n=document.createElement("div");
    /* message-renderer contract markers: */ n.className='message ai'; if(role==="user")n.className='message user'; else n.className="message ai";
    var l=document.createElement("span");l.className="label";l.textContent=role==="user"?"আপনি":"MOSHARROF AI · core";
    n.appendChild(l);n.appendChild(document.createTextNode(text));
    if(role==="ai" && text && text.indexOf("🖼️")!==0){var sp=document.createElement("button");sp.className="speak";sp.type="button";sp.textContent="🔊 শুনুন";sp.onclick=function(){speakText(text,sp);};n.appendChild(sp);}

    return n;
  }
  function typing(){var n=document.createElement("div");n.className="message ai typing";n.id="typing";n.innerHTML='<span class="label">MOSHARROF AI · core</span><span class="dots"><span></span><span></span><span></span></span>';msgEl.appendChild(n);bottom();}
  function untype(){var t=$("#typing");if(t)t.remove();}
  var CHAT_WORKER_URL="https://mosharrof-screenshot-analysis.mosharrof0000.workers.dev/chat";
  var IMAGE_WORKER_URL="https://mosharrof-screenshot-analysis.mosharrof0000.workers.dev/generate-image";

  var activeAudio=null;
  function coreReply(t,image){
    return fetch(CHAT_WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:String(t||"").trim(),image:image?image.dataUrl:null,image_name:image?image.name:null})})
      .then(function(res){return res.json().catch(function(){return {};}).then(function(data){

    button.disabled=true;button.textContent="⏳ প্রস্তুত হচ্ছে…";showV("পড়ে শোনানোর জন্য প্রস্তুত হচ্ছে…");
    fetch(TTS_WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:String(t||"").trim(),language_code:"bn-BD",pace:1})}).then(function(res){return res.json().catch(function(){return {};}).then(function(data){if(!res.ok)throw new Error(data.reason||data.error||("HTTP "+res.status));return data;});}).then(function(data){if(!data.audio_data)throw new Error("no_audio");activeAudio=new Audio("data:"+(data.mime_type||"audio/mpeg")+";base64,"+data.audio_data);activeAudio.onended=function(){button.textContent="🔊 শুনুন";hideV();activeAudio=null;};button.textContent="⏸ বন্ধ করুন";button.disabled=false;button.onclick=function(){if(activeAudio){activeAudio.pause();activeAudio=null;button.textContent="🔊 শুনুন";hideV();button.onclick=function(){speakText(t,button);};}};showV("পড়া হচ্ছে · "+(data.provider||"voice"));activeAudio.play().catch(function(){});}).catch(function(){button.disabled=false;button.textContent="🔊 শুনুন";hideV();if("speechSynthesis" in window){var u=new SpeechSynthesisUtterance(String(t||""));u.lang="bn-BD";u.rate=0.95;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);toast("ব্রাউজার ভয়েস ব্যবহার হচ্ছে");}else{toast("ভয়েস সেবা এখন পাওয়া যাচ্ছে না");}});
  }
  function parseImageSpec(prompt){
    var p=String(prompt||""),v=p.toLowerCase(),m,ratio=null,w=null,h=null;
    m=p.match(/(\d{2,5})\s*[x×]\s*(\d{2,5})\s*(?:px|pixels?|পিক্সেল)?/i);
    if(m){w=Number(m[1]);h=Number(m[2]);if(w>0&&h>0&&w<=8192&&h<=8192)ratio=simplifyRatio(w,h);}
    if(!ratio){
      m=p.match(/(\d{1,2})\s*:\s*(\d{1,2})/);
      if(m&&Number(m[1])>0&&Number(m[2])>0)ratio=simplifyRatio(Number(m[1]),Number(m[2]));
    }
    if(!ratio){
      if(/youtube\s*(?:shorts)?|shorts|tiktok|tik tok|reels|রিলস|টিকটক|শর্টস/.test(v))ratio="9:16";
      else if(/instagram|ইনস্টাগ্রাম/.test(v)&&/portrait|vertical|পোর্ট্রেট|লম্বা/.test(v))ratio="4:5";

      else if(/youtube|thumbnail|facebook|landscape|wide|প্যানোরামিক|থাম্বনেইল/.test(v))ratio="16:9";

    if(!w||!h){
      var base=1024,quality="standard";
      if(/4k|uhd|অতি উচ্চ রেজোলিউশন/.test(v)){base=3840;quality="4K";}

      else if(/\b(100|150|300|500|800)\s*(?:px|pixel|pixels|পিক্সেল)?\b/.test(v)){base=Number(v.match(/\b(100|150|300|500|800)\s*(?:px|pixel|pixels|পিক্সেল)?\b/)[1]);quality="web";}
      var parts=ratio.split(":").map(Number),scale=base/Math.max(parts[0],parts[1]);
      w=Math.max(1,Math.round(parts[0]*scale));h=Math.max(1,Math.round(parts[1]*scale));
      if(/\b(100|150|300)\s*[x×]\s*(100|150|200|300)\b/i.test(p)){var dm=p.match(/(\d{2,5})\s*[x×]\s*(\d{2,5})/i);w=Number(dm[1]);h=Number(dm[2]);}
    }
    var transparent=/transparent|স্বচ্ছ ব্যাকগ্রাউন্ড|ব্যাকগ্রাউন্ড ছাড়া|background\s*remove/i.test(v);
    var format=transparent?"image/png":(/\bwebp\b/.test(v)?"image/webp":(/\bjpg\b|\bjpeg\b|jpeg|জেপেগ/.test(v)?"image/jpeg":(/\bpng\b|png|পিএনজি/.test(v)?"image/png":"image/jpeg")));
    var maxBytes=/under\s*1\s*mb|less than\s*1\s*mb|1\s*mb|১\s*এমবি|১এমবি/i.test(v)?1024*1024:null;
