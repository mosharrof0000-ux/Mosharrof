<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06152f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MOSHARROF AI — Full Screen V5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#041229;--bg2:#092650;--t:#f4f9ff;--m:#9db3cd;--l:#70c8ff2b;--b:#2caeff;--v:#7058ef;--safe:env(safe-area-inset-bottom,0px);--text:#eef4ff}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation}body{font-family:"Inter","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;background:#020b1c;color:var(--t);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.app{width:100%;height:100dvh;min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 5%,#279bff30,transparent 34%),radial-gradient(circle at 88% 95%,#7058ef35,transparent 40%),linear-gradient(145deg,var(--bg),var(--bg2))}
.main{position:absolute;inset:0;display:flex;flex-direction:column}
.top{height:64px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 14px;border-bottom:1px solid var(--l);background:#020d1f44}
.round{width:42px;height:42px;border-radius:50%;border:1px solid #7ed3ff47;background:#071d3be8;display:grid;place-items:center;font-size:20px}
.left-btn{justify-self:start}.right-btn{justify-self:end}.brand{text-align:center}.brand b{font-size:14px}.brand small{display:block;font-size:9px;color:var(--m);margin-top:1px}
.mlogo{display:inline-grid;width:35px;height:35px;border-radius:50%;place-items:center;background:linear-gradient(145deg,var(--b),var(--v));font-weight:900;margin-right:5px;vertical-align:middle}
.content{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px 14px calc(12px + var(--safe));overflow:auto}
.hero{text-align:center;width:min(850px,100%)}.hero-logo{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;font-size:32px;font-weight:900;background:linear-gradient(145deg,#2baeff,#6e58ed)}
h1{font-size:clamp(25px,4vw,38px)}h1 span{color:#55c7ff}.sub{color:#aec3db;font-size:13px;margin-top:7px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:700px;margin:25px auto 20px}.quick button{min-height:58px;border:1px solid #65caff33;border-radius:16px;background:#082346bb;padding:9px;color:#e4f2ff}.quick b{display:block;font-size:12px}.quick small{font-size:9px;color:var(--m)}
.composer{position:relative;width:min(820px,100%);margin:auto;border:1px solid #68ccff4d;border-radius:25px;background:#03132bf2;padding:7px;box-shadow:0 15px 45px #0006}
.row{display:flex;align-items:center;gap:6px}.plus{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid #6bcfff3d;background:#0d2b4fe8;font-size:25px}.input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px 5px;font-size:14px}.input::placeholder{color:#839ab5}.send{width:44px;height:44px;border:0;border-radius:50%;background:linear-gradient(145deg,#36b2ff,#5c50ea);font-size:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:3px 5px 1px 51px}.chip{border:1px solid #7ec7ff29;background:#0b2b50;border-radius:11px;padding:6px 9px;font-size:10px}
.scrim{position:absolute;inset:0;background:#000a;z-index:20;opacity:0;visibility:hidden;transition:.2s}.scrim.open{opacity:1;visibility:visible}
.drawer{position:absolute;top:0;bottom:0;width:min(330px,86vw);z-index:30;background:linear-gradient(180deg,#04142bf9,#020c1ffb);padding:13px;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.drawer.left{left:0;transform:translateX(-105%);border-right:1px solid var(--l)}.drawer.right{right:0;transform:translateX(105%);border-left:1px solid var(--l)}.drawer.open{transform:translateX(0)}
.dhead{display:flex;align-items:center;gap:10px;padding:3px 3px 13px;border-bottom:1px solid var(--l);margin-bottom:10px}.dlogo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--b),var(--v));font-weight:900}.dhead strong{font-size:14px}.dhead small{display:block;color:var(--m);font-size:9px;margin-top:2px}.dclose{margin-left:auto}
.nav{display:flex;flex-direction:column;gap:4px;overflow:auto;-webkit-overflow-scrolling:touch;height:calc(100% - 110px)}.nav button{border:0;background:transparent;border-radius:14px;padding:11px;color:#e5f0fd;text-align:left;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:linear-gradient(100deg,#218fe8,#624fe2)}.ni{width:25px;text-align:center;font-size:18px}
.profile{position:absolute;left:13px;right:13px;bottom:12px;border-top:1px solid var(--l);padding-top:11px;display:flex;gap:9px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#218fff,#6555e9);font-weight:800}.profile small{display:block;color:var(--m);font-size:9px;margin-top:2px}
.modules{height:calc(100% - 75px);overflow:auto;-webkit-overflow-scrolling:touch}.module{width:100%;display:flex;align-items:center;gap:10px;border:1px solid #78caff27;background:#08294dcc;border-radius:16px;padding:10px;margin-bottom:8px;text-align:left}.module.featured{background:linear-gradient(105deg,#1391dc66,#6447dc66)}.mi{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:#38c1ff20;font-size:19px;flex:none}.module strong{display:block;font-size:12px}.module span{display:block;color:var(--m);font-size:9px;margin-top:3px}.arrow{margin-left:auto;font-size:20px;color:#a9c0d8}.add{width:100%;border:1px dashed #62d0ff77;background:#061c38;border-radius:15px;padding:12px;font-size:11px}.note{font-size:9px;color:#7189a5;line-height:1.5;padding:9px 2px}
.toast{position:absolute;z-index:70;bottom:calc(92px + var(--safe));left:50%;transform:translate(-50%,12px);opacity:0;background:#03162ff5;border:1px solid #6acfff40;border-radius:12px;padding:8px 12px;font-size:10px;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.top{height:58px;padding:7px 10px}.round{width:40px;height:40px}.quick{grid-template-columns:1fr 1fr}.drawer{width:min(85vw,320px)}}
.chat-mode .top{position:absolute;left:0;right:0;top:0;height:0;z-index:12;padding:0;border:0;background:transparent;pointer-events:none}
.chat-mode .brand{display:none}
.chat-mode .left-btn,.chat-mode .right-btn{position:absolute;top:14px;pointer-events:auto;z-index:13}
.chat-mode .left-btn{left:14px}.chat-mode .right-btn{right:14px}
.chat-mode .round{background:rgba(7,29,59,.72);backdrop-filter:blur(14px)}
.chat-mode .content{position:absolute;inset:0;padding:0;display:flex;flex-direction:column;overflow:hidden}
.chat-mode .hero{width:100%;flex:1;min-height:0;max-width:none;display:flex;flex-direction:column;text-align:left;align-items:stretch}
.chat-mode .hero-logo,.chat-mode h1,.chat-mode .sub,.chat-mode .quick{display:none}
.chat-mode .composer{order:2;flex:none;width:min(900px,calc(100% - 24px));margin:0 auto calc(10px + var(--safe));z-index:10;position:relative}
.chat-mode .chat-scroll{order:1;flex:1 1 0;min-height:0;width:100%;overflow-x:hidden;overflow-y:scroll;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:76px 0 18px}
.chat-mode .messages{width:100%;max-width:48rem;margin-left:auto;margin-right:auto;margin-top:auto;padding:0 16px;display:flex;flex-direction:column;gap:22px}
.chat-mode .message.user{align-self:flex-end;max-width:min(78%,34rem);padding:12px 16px;border-radius:18px 18px 6px 18px;background:linear-gradient(145deg,#168ad0,#5648cf);font-size:15px;line-height:1.6;word-break:break-word;animation:msgAppear .45s cubic-bezier(.22,1,.36,1) both}
.chat-mode .message.ai{align-self:stretch;width:100%;max-width:100%;padding:4px 0 8px;background:transparent;border:0;animation:msgAppear .5s cubic-bezier(.22,1,.36,1) both}
.chat-mode .message.ai .label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:#8eb4d8;margin-bottom:10px}.chat-mode .message.ai .timer{margin-left:auto;color:#70c8ff;font-variant-numeric:tabular-nums;font-size:10px;opacity:.9}
.chat-mode .message.ai .label::before{content:"";width:22px;height:22px;border-radius:50%;background:linear-gradient(145deg,#2baeff,#6e58ed);flex:none}
.chat-mode .message.ai .ai-text{display:block;color:var(--text);font-size:16px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.chat-mode .message.ai .ai-text p{margin:0 0 .85em}.chat-mode .message.ai .ai-text p:last-child{margin-bottom:0}
.chat-mode .message.ai .ai-text strong{font-weight:600;color:#fff}
.chat-mode .message.ai .ai-text ul{margin:.5em 0 .9em;padding-left:1.35em}
.chat-mode .message.ai .ai-text li{margin:.28em 0}
.chat-mode .message.ai .ai-text code{font-family:ui-monospace,monospace;font-size:.9em;background:rgba(112,200,255,.12);padding:.12em .4em;border-radius:6px}
.chat-mode .message.ai .ai-text.streaming::after{content:"▋";display:inline-block;margin-left:2px;opacity:.7;animation:caretBlink .85s step-end infinite;color:#70c8ff}
.chat-mode .chips{display:none}
@keyframes msgAppear{from{opacity:0;filter:blur(5px);transform:translateY(14px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes caretBlink{50%{opacity:0}}
@media(max-width:760px){.chat-mode .messages{padding:0 14px}.chat-mode .message.ai .ai-text{font-size:15px}}
</style>
</head>
<body>
<div class="app">
<main class="main">
<header class="top">
 <div class="left-btn"><button class="round" id="openLeft">☰</button></div>
 <div class="brand"><span class="mlogo">M</span><b>MOSHARROF AI</b><small>Mosharrof — জ্ঞান • গবেষণা • অন্তর্দৃষ্টি</small></div>
 <div class="right-btn"><button class="round" id="openRight">⋮</button></div>
</header>
<section class="content"><div class="hero">
 <div class="hero-logo">M</div>
 <h1>আপনি কিভাবে <span>সাহায্য</span> চান?</h1>
 <p class="sub">কুরআন, গবেষণা, জ্ঞান অথবা অন্য কোনো বিষয়ে প্রশ্ন করুন...</p>
 <div class="quick">
  <button data-mod="quran">📖<b>কুরআন সার্চ</b><small>আয়াত খুঁজুন</small></button>
  <button data-mod="quran">▤<b>আয়াত বিশ্লেষণ</b><small>প্রেক্ষাপট ও শিক্ষা</small></button>
  <button data-mod="quran">🧠<b>শব্দ গবেষণা</b><small>আরবি মূল ও অর্থ</small></button>
  <button data-mod="quran">📚<b>তাফসীর</b><small>ব্যাখ্যা ও উৎস</small></button>
  <button data-mod="quran">🕌<b>হাদীস</b><small>সূত্র অনুসন্ধান</small></button>
  <button data-mod="quran">🔬<b>গবেষণা</b><small>গভীর অনুসন্ধান</small></button>
 </div>
 <div class="chat-scroll" id="chatScroll"><div class="messages" id="messages"></div></div>
 <form class="composer" id="form">
  <div class="row">
   <button type="button" class="plus" id="plus">＋</button>
   <input class="input" id="input" placeholder="আপনার প্রশ্ন লিখুন..." autocomplete="off">
   <button class="send">➤</button>
  </div>
  <div class="chips">
   <button type="button" class="chip">📎 ফাইল</button>
   <button type="button" class="chip">🖼️ ছবি</button>
   <button type="button" class="chip">🎙️ ভয়েস</button>
   <button type="button" class="chip">✦ আরও</button>
  </div>
 </form>
</div></section>
</main>
<aside class="drawer left" id="leftDrawer">
 <div class="dhead"><div class="dlogo">M</div><div><strong>MOSHARROF AI</strong><small>মূল সাইট নেভিগেশন</small></div><button class="round dclose" id="closeLeft">×</button></div>
 <nav class="nav">
  <button class="active" data-toast="হোম"><span class="ni">🏠</span>হোম</button>
  <button data-toast="চ্যাট"><span class="ni">💬</span>চ্যাট</button>
  <button data-toast="চ্যাট ইতিহাস"><span class="ni">◷</span>চ্যাট ইতিহাস</button>
  <button data-toast="জ্ঞান ভাণ্ডার"><span class="ni">📚</span>জ্ঞান ভাণ্ডার</button>
  <button data-toast="প্রজেক্ট"><span class="ni">🗂️</span>প্রজেক্ট</button>
  <button data-toast="নোটস"><span class="ni">📝</span>নোটস</button>
  <button data-toast="সেটিংস"><span class="ni">⚙️</span>সেটিংস</button>
 </nav>
 <div class="profile"><div class="avatar">M</div><div><b>মোশাররফ</b><small>সার্বভৌম পরিচালক • v1.0</small></div></div>
</aside>
<aside class="drawer right" id="rightDrawer">
 <div class="dhead"><div class="dlogo">▣</div><div><strong>MOSHARROF PROJECT HUB</strong><small>প্রতিটি মডিউল = আলাদা এন্টিটি</small></div><button class="round dclose" id="closeRight">×</button></div>
 <div class="modules">
  <button class="module featured" data-mod="quran"><div class="mi">📖</div><div><strong>Quran Research</strong><span>কুরআন Tools</span></div><div class="arrow">›</div></button>
  <button class="module" data-mod="lab"><div class="mi">🧪</div><div><strong>Research Lab</strong><span>গবেষণা</span></div><div class="arrow">›</div></button>
  <button class="add" id="add">＋ নতুন মডিউল</button>
 </div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>
</div>
<script>
(()=>{
var $=function(s){return document.querySelector(s);};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
var L=$('#leftDrawer'),R=$('#rightDrawer'),S=$('#scrim'),T=$('#toast');
var scrollEl=$('#chatScroll');
var CHAT_URL='https://mosharrof-screenshot-analysis.mosharrof0000.workers.dev/chat';

function msg(x){T.textContent=x;T.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(function(){T.classList.remove('show');},1600);}
function closeAll(){L.classList.remove('open');R.classList.remove('open');S.classList.remove('open');}
function drawer(x){closeAll();x.classList.add('open');S.classList.add('open');}
function smoothScrollBottom(){
  if(!scrollEl) return;
  requestAnimationFrame(function(){ scrollEl.scrollTop = scrollEl.scrollHeight; });
}
function startResponseTimer(label){
  var started=performance.now();
  if(label) label.textContent='00:00';
  var id=setInterval(function(){
    var elapsed=Math.min(30,Math.floor((performance.now()-started)/100)/10);
    if(label) label.textContent='00:'+elapsed.toFixed(1).padStart(4,'0');
    if(elapsed>=30) clearInterval(id);
  },100);
  return function(){ clearInterval(id); };
}

function escapeHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function formatRich(text){
  var t=escapeHtml(text);
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t=t.replace(/(?:^|\n)[•\-\*]\s+(.+)/g,'\n<li>$1</li>');
  if(t.indexOf('<li>')!==-1){
    t=t.replace(/((?:<li>[\s\S]*?<\/li>\s*)+)/g,'<ul>$1</ul>');
  }
  t=t.split(/\n{2,}/).map(function(block){
    block=block.trim();
    if(!block) return '';
    if(block.indexOf('<ul>')===0) return block;
    return '<p>'+block.replace(/\n/g,'<br>')+'</p>';
  }).filter(Boolean).join('');
  return t || escapeHtml(text);
}

function streamText(el, fullText){
  var text=String(fullText||'');
  el.classList.add('streaming');
  el.textContent='';
  var i=0;
  var timerId=null;
  return new Promise(function(resolve){
    timerId=setInterval(function(){
      if(i>=text.length){
        clearInterval(timerId);
        el.classList.remove('streaming');
        try{ el.innerHTML=formatRich(text); }catch(e){ el.textContent=text; }
        smoothScrollBottom();
        resolve();
        return;
      }
      var next=Math.min(i+2, text.length);
      el.textContent=text.slice(0, next);
      i=next;
      if(i%10===0 || next===text.length) smoothScrollBottom();
    }, 14);
  });
}

$('#openLeft').onclick=function(){drawer(L);};
$('#openRight').onclick=function(){drawer(R);};
$('#closeLeft').onclick=closeAll;
$('#closeRight').onclick=closeAll;
S.onclick=closeAll;
$$('[data-toast]').forEach(function(b){b.onclick=function(){msg(b.dataset.toast);closeAll();};});
$$('[data-mod]').forEach(function(b){b.onclick=function(){var s=b.querySelector('strong');msg((s&&s.textContent||'')+' — এন্টিটি');};});
if($('#add')) $('#add').onclick=function(){msg('নতুন এন্টিটি — অনুমোদন প্রয়োজন');};

$('#form').onsubmit=async function(e){
  e.preventDefault();
  var v=$('#input').value.trim();
  if(!v) return;
  document.querySelector('.app').classList.add('chat-mode');
  var box=$('#messages');

  var user=document.createElement('div');
  user.className='message user';
  user.textContent=v;
  box.appendChild(user);
  $('#input').value='';
  smoothScrollBottom();

  var ai=document.createElement('div');
  ai.className='message ai';
  ai.innerHTML='<span class="label"><span>MOSHARROF AI</span><span class="timer">00:00</span></span><span class="ai-text streaming">উত্তর আসছে…</span>';
  box.appendChild(ai);
  smoothScrollBottom();
  var textEl=ai.querySelector('.ai-text');
  var stopResponseTimer=startResponseTimer(ai.querySelector('.timer'));

  try{
    var res=await fetch(CHAT_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:v})
    });
    var data={};
    try{ data=await res.json(); }catch(_){}
    if(!res.ok){
      var detail=data.provider_message || data.error || ('HTTP '+res.status);
      throw new Error(detail);
    }
    var answer=data.text || 'কোনো উত্তর পাওয়া যায়নি।';
    await streamText(textEl, answer);
  }catch(err){
    textEl.classList.remove('streaming');
    var reason=(err && err.message) ? String(err.message) : 'unknown';
    textEl.textContent='দুঃখিত, সংযোগে সমস্যা হয়েছে। ('+reason+') একটু পর আবার চেষ্টা করুন।';
    console.error('Mosharrof chat error:', err);
    smoothScrollBottom();
  }finally{
    stopResponseTimer();
  }
};

document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeAll(); });
})();
</script>
</body>
</html>
