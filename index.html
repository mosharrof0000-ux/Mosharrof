<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MOSHARROF AI — Sovereign Chat</title>
<link rel="manifest" href="./manifest.webmanifest">
<!--
  MOSHARROF AI Frontend V5 — Entity-aligned
  Architecture: entity-first, model-agnostic
  Only Mosharrof (core) oversees all entities.
  Entities: core | chat | sidebar | ui | voice | storage | tool_factory | quran_research
-->
<style>
:root{
  --bg:#000;--surface:#171717;--surface2:#202123;--surface3:#2f2f2f;
  --text:#f5f5f5;--muted:#a1a1aa;--border:rgba(255,255,255,.10);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;
  -webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:transparent}

.app{position:fixed;inset:0;width:100vw;height:100dvh;min-height:100svh;background:#000;overflow:hidden}
.main,.content,.hero{position:absolute;inset:0;width:100%;height:100%;background:#000}

/* Top bar */
.top{position:fixed;inset:0;height:0;z-index:100;pointer-events:none}
.top .brand{display:none}
.top .left-btn,.top .right-btn{
  position:fixed;top:max(8px,var(--safe-t));z-index:101;pointer-events:auto
}
.top .left-btn{left:8px}.top .right-btn{right:8px}
.round{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--border);
  background:#111;color:#f5f5f5;display:grid;place-items:center;font-size:20px
}

/* Chat scroll */
.chat-scroll{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  overflow-y:auto;overflow-x:hidden;padding:8px 12px calc(100px + var(--safe-b));
  background:#000;scrollbar-width:none;-webkit-overflow-scrolling:touch
}
.chat-scroll::-webkit-scrollbar{display:none}
.messages{width:min(900px,100%);margin:0 auto;display:flex;flex-direction:column;gap:26px;padding-bottom:4px}

.message{max-width:min(82%,760px);font-size:15px;line-height:1.72;word-break:break-word;color:#ececec}
.message .label{display:block;font-size:11px;color:#8e8e93;margin-bottom:7px}
.message.user{
  align-self:flex-end;background:var(--surface3);color:#f3f3f3;
  padding:11px 16px;border-radius:20px;border-bottom-right-radius:6px;max-width:min(78%,680px)
}
.message.user .label{color:#b8b8bb}
.message.ai{align-self:flex-start;color:#e8e8e8;max-width:min(92%,760px)}
.message.typing .dots{display:inline-flex;gap:4px}
.message.typing .dots span{
  width:6px;height:6px;border-radius:50%;background:#8e8e93;animation:blink 1.2s infinite
}
.message.typing .dots span:nth-child(2){animation-delay:.2s}
.message.typing .dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* Composer */
.composer{
  position:absolute;left:50%;bottom:calc(10px + var(--safe-b));transform:translateX(-50%);
  width:min(820px,calc(100% - 20px));z-index:10;
  background:var(--surface3);border:1px solid var(--border);border-radius:26px;
  padding:7px 8px;box-shadow:0 8px 28px rgba(0,0,0,.55)
}
.composer:focus-within{border-color:rgba(255,255,255,.18)}
.row{display:flex;align-items:flex-end;gap:6px}
.plus{width:42px;height:42px;flex:none;border-radius:50%;color:#e5e5e5;font-size:25px;display:grid;place-items:center}
.input{
  flex:1;min-width:0;min-height:42px;max-height:160px;border:0;outline:0;
  background:transparent;padding:9px 8px;font-size:15px;line-height:1.55;
  color:var(--text);resize:none;overflow-y:auto
}
.input::placeholder{color:#8e8e93}
.send{
  width:40px;height:40px;flex:none;border-radius:50%;
  background:#f4f4f5;color:#111;font-size:18px;display:grid;place-items:center
}
.send:disabled{opacity:.4}

/* Drawer */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:20;opacity:0;visibility:hidden;transition:.2s}
.scrim.open{opacity:1;visibility:visible}
.drawer{
  position:absolute;top:var(--safe-t);bottom:var(--safe-b);width:min(320px,86vw);z-index:30;
  background:var(--surface);padding:13px;box-shadow:0 0 55px rgba(0,0,0,.75);
  transition:transform .28s cubic-bezier(.2,.8,.2,1)
}
.drawer.left{left:0;transform:translateX(-105%);border-right:1px solid var(--border)}
.drawer.right{right:0;transform:translateX(105%);border-left:1px solid var(--border)}
.drawer.open{transform:translateX(0)}
.dhead{display:flex;align-items:center;gap:10px;padding-bottom:13px;border-bottom:1px solid var(--border);margin-bottom:12px}
.dlogo{width:40px;height:40px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;font-weight:900}
.dhead strong{font-size:14px}.dhead small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.dclose{margin-left:auto;font-size:18px;padding:6px}
.nav{display:flex;flex-direction:column;gap:4px;overflow:auto;height:calc(100% - 100px)}
.nav button{
  border:0;background:transparent;border-radius:14px;padding:12px;color:#e5e5e5;
  text-align:left;display:flex;gap:12px;align-items:center
}
.nav button:hover,.nav button.active{background:var(--surface2)}
.nav .ni{width:24px;text-align:center;font-size:16px}

/* Voice status */
.voice-bar{
  position:absolute;left:50%;bottom:calc(70px + var(--safe-b));transform:translateX(-50%);
  z-index:15;font-size:11px;color:var(--muted);opacity:0;transition:.2s;pointer-events:none
}
.voice-bar.show{opacity:1}

/* Toast */
.toast{
  position:absolute;z-index:70;bottom:calc(110px + var(--safe-b));left:50%;
  transform:translate(-50%,12px);opacity:0;background:var(--surface2);
  border:1px solid var(--border);border-radius:12px;padding:8px 14px;font-size:12px;
  pointer-events:none;transition:.2s
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:760px){
  .top .left-btn{left:10px}.top .right-btn{right:10px}
  .round{width:40px;height:40px}
  .message{max-width:92%;font-size:15px}
  .message.user{max-width:82%}
  .composer{width:calc(100% - 16px)}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="main">
    <div class="top">
      <div class="left-btn"><button class="round" id="btn-left" aria-label="মেনু">☰</button></div>
      <div class="brand"><b>MOSHARROF AI</b><small>Intelligent Entity</small></div>
      <div class="right-btn"><button class="round" id="btn-right" aria-label="অপশন">⋮</button></div>
    </div>

    <div class="content">
      <div class="hero">
        <div class="chat-scroll" id="chat-scroll">
          <div class="messages" id="messages">
            <div class="message ai">
              <span class="label">MOSHARROF AI · core</span>
              আমি কীভাবে আপনাকে সাহায্য করতে পারি?
            </div>
          </div>
        </div>

        <div class="composer">
          <div class="row">
            <button class="plus" id="btn-plus" aria-label="অ্যাটাচ / ভয়েস">+</button>
            <textarea class="input" id="user-input" placeholder="আপনার প্রশ্ন লিখুন..." rows="1" aria-label="মেসেজ"></textarea>
            <button class="send" id="btn-send" aria-label="পাঠান">➔</button>
          </div>
        </div>
        <div class="voice-bar" id="voice-status">Voice ready</div>
      </div>
    </div>
  </div>

  <!-- Left drawer (sidebar entity) -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer left" id="drawer-left" aria-hidden="true">
    <div class="dhead">
      <div class="dlogo">M</div>
      <div><strong>MOSHARROF</strong><small>Entity System</small></div>
      <button class="dclose" id="close-left" aria-label="বন্ধ">✕</button>
    </div>
    <nav class="nav" id="nav-left">
      <button data-entity="core"><span class="ni">◎</span> Core</button>
      <button data-entity="chat" class="active"><span class="ni">💬</span> Chat</button>
      <button data-entity="quran_research"><span class="ni">📖</span> Quran Research</button>
      <button data-entity="voice"><span class="ni">🎙️</span> Voice</button>
      <button data-entity="storage"><span class="ni">📁</span> Storage</button>
      <button data-entity="tool_factory"><span class="ni">🔧</span> Tool Factory</button>
      <button data-entity="sidebar"><span class="ni">☰</span> Sidebar</button>
    </nav>
  </aside>

  <!-- Right drawer -->
  <aside class="drawer right" id="drawer-right" aria-hidden="true">
    <div class="dhead">
      <div class="dlogo">⋮</div>
      <div><strong>Options</strong><small>chat entity</small></div>
      <button class="dclose" id="close-right" aria-label="বন্ধ">✕</button>
    </div>
    <nav class="nav">
      <button id="btn-new-chat"><span class="ni">✦</span> New Chat</button>
      <button id="btn-clear"><span class="ni">⌫</span> Clear Messages</button>
      <button id="btn-voice-toggle"><span class="ni">🎙️</span> Voice Input</button>
    </nav>
  </aside>

  <div class="toast" id="toast"></div>
</div>

<script type="module" src="./web/app.js"></script>
</body>
</html>
