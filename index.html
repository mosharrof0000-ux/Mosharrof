<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <title>Mosharrof Karim — AI Ecosystem</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    body{margin:0;background:#0b0b0b;color:#f5f5f5;min-height:100vh;display:grid;place-items:center}
    main{width:min(900px,92vw);padding:48px 0}
    .card{border:1px solid #303030;border-radius:24px;padding:32px;background:#121212;box-shadow:0 20px 70px #0008}
    h1{font-size:clamp(2.2rem,8vw,5rem);margin:0 0 12px}
    p{color:#bdbdbd;font-size:1.05rem;line-height:1.7}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:28px}
    .item{border:1px solid #2a2a2a;border-radius:16px;padding:16px;background:#171717}
    .item strong{display:block;margin-bottom:6px}.item span{color:#9d9d9d;font-size:.9rem}
    footer{margin-top:28px;color:#777;font-size:.85rem}
  </style>
</head>
<body>
<main>
  <section class="card">
    <div aria-label="Mosharrof">◈</div>
    <h1>Mosharrof</h1>
    <p>Mosharrof Karim — Intelligent Entity and AI Brain Architecture.</p>
    <div class="grid">
      <div class="item"><strong>Core</strong><span>Central coordination</span></div>
      <div class="item"><strong>Chat</strong><span>Conversation entity</span></div>
      <div class="item"><strong>Voice</strong><span>Context-aware voice boundary</span></div>
      <div class="item"><strong>Tools</strong><span>Permission-bounded tools</span></div>
      <div class="item"><strong>Research</strong><span>Al-Quran Research integration boundary</span></div>
    </div>
    <footer>DELETE and destructive operations are permanently blocked.</footer>
  </section>
</main>
</body>
</html>
