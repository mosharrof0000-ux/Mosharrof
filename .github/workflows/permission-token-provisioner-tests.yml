name: Permission Token Provisioner Tests

on:
  pull_request:
    paths:
      - "permission-token-provisioner/**"
      - ".github/workflows/permission-token-provisioner-tests.yml"
  push:
    branches:
      - "feat/isolated-permission-token-provisioner-20261014"
    paths:
      - "permission-token-provisioner/**"
      - ".github/workflows/permission-token-provisioner-tests.yml"

permissions:
  contents: read

jobs:
  policy-tests:
    name: Fail-closed policy unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: permission-token-provisioner
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run policy tests
        run: python -m pytest -q
