name: MOSHARROF Read-only Observability
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
concurrency:
  group: mosharrof-read-only-observability
  cancel-in-progress: false
jobs:
  snapshot:
    name: Collect PR and Actions status snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate monitor script syntax
        run: node --check scripts/monitoring/mosharrof-observability.mjs
      - name: Collect read-only snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/monitoring/mosharrof-observability.mjs
      - name: Upload status snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-observability-${{ github.run_id }}
          path: observability-output/
          if-no-files-found: error
          retention-days: 30
