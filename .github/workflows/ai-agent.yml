name: Mosharrof GitHub Agent Access Check

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify-repository-access:
    runs-on: ubuntu-latest
    steps:
      - name: Verify repository access with the workflow token
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}" --jq '"GitHub API access: OK (" + .full_name + ")"'
          echo "This is a GitHub read-access check only; it does not claim Gemini or autonomous write access was verified."
