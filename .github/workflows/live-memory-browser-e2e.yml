name: Live Memory Browser E2E

on:
  workflow_dispatch:
    inputs:
      live_site_url:
        description: "Live site URL to test"
        required: true
        default: "https://mosharrof0000-ux.github.io/Mosharrof/"
      confirm_send_test_message:
        description: "Type SEND_TEST_MESSAGE to authorize one synthetic chat message"
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-memory-e2e:
    if: ${{ inputs.confirm_send_test_message == 'SEND_TEST_MESSAGE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser-test dependency
        run: |
          npm init -y
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Send one synthetic message and verify memory survives reload
        env:
          LIVE_SITE_URL: ${{ inputs.live_site_url }}
          E2E_TIMEOUT_MS: "30000"
        run: node tests/e2e/live-memory-smoke.mjs
      - name: Upload failure screenshot if present
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-memory-e2e-diagnostics
          path: live-memory-e2e-failure.png
          if-no-files-found: ignore
