name: Mosharrof Visual Inspection
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"
permissions:
  contents: read
jobs:
  visual-inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: 22}
      - name: Install
        working-directory: visual-inspector
        run: npm install
      - name: Install Chromium
        working-directory: visual-inspector
        run: npx playwright install --with-deps chromium
      - name: Inspect isolated design
        working-directory: visual-inspector
        run: npm run visual:test
      - name: Inspect live URL
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          BASE_URL: https://mosharrof0000-ux.github.io/Mosharrof/
        working-directory: visual-inspector
        run: npm run visual:test
      - name: Save screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-visual-inspection
          path: visual-inspector/test-results
          if-no-files-found: ignore