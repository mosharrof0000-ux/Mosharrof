name: Mosharrof Visual Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "URL to visually audit"
        required: false
        default: "https://mosharrof0000-ux.github.io/Mosharrof/"

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Start candidate server
        run: python3 -m http.server 4173 --directory web > /tmp/mosharrof-server.log 2>&1 &
      - name: Audit candidate design
        env:
          AUDIT_URL: http://127.0.0.1:4173/
          AUDIT_OUT: artifacts/candidate
        run: npm run audit
      - name: Audit live URL
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          AUDIT_URL: ${{ inputs.url || 'https://mosharrof0000-ux.github.io/Mosharrof/' }}
          AUDIT_OUT: artifacts/live
        run: npm run audit
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-visual-audit-${{ github.run_id }}
          path: artifacts/
