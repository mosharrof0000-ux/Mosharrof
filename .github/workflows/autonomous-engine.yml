name: Mosharrof Autonomous Engineer

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mosharrof-autonomous-engine
  cancel-in-progress: false

jobs:
  autonomous:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AGENT_ACCESS_TOKEN }}
      - name: Check required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_ACCESS_TOKEN: ${{ secrets.AGENT_ACCESS_TOKEN }}
        run: test -n "$GEMINI_API_KEY" && test -n "$AGENT_ACCESS_TOKEN"
      - name: Ask Mosharrof brain for safe patch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 automation/autonomous_engine.py
      - name: Validate and apply safe patch
        run: |
          if grep -qx 'NO_ACTION' /tmp/mosharrof.patch; then echo 'NO_ACTION=true' >> "$GITHUB_ENV"; exit 0; fi
          sed -i '/^```/d' /tmp/mosharrof.patch
          git apply --check /tmp/mosharrof.patch
          ! grep -nE '^--- /dev/null|^+++ /dev/null|^[-+].*(rm -rf|git push|git reset --hard|delete-repository)' /tmp/mosharrof.patch
          test "$(git apply --numstat /tmp/mosharrof.patch | wc -l)" -le 12
          git apply /tmp/mosharrof.patch
      - name: Run tests
        if: env.NO_ACTION != 'true'
        run: python3 -m pip install -r requirements.txt && python3 -m pytest -q
      - name: Create isolated branch and PR
        if: env.NO_ACTION != 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_ACCESS_TOKEN }}
        run: |
          BRANCH="auto/mosharrof-${GITHUB_RUN_ID}"
          git config user.name 'Mosharrof Autonomous Engine'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add web src tests config docs automation
          git diff --cached --quiet && exit 0
          git commit -m 'Auto: implement verified Mosharrof request'
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title 'Auto: Mosharrof verified feature' --body 'Generated by the bounded autonomous engine. Verification is mandatory before promotion; main is never edited directly.'
