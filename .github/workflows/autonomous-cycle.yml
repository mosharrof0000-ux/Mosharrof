name: Mosharrof Autonomous Work Cycle

on:
  schedule:
    # UTC hours 0,2,14,16,18,20,22 map to Bangladesh 06:00, 08:00, 20:00, 22:00, 00:00, 02:00, 04:00, 06:00. GitHub schedule is best-effort, not a continuous runner.
    - cron: "0 0,2,14,16,18,20,22 * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read

concurrency:
  group: mosharrof-autonomous
  cancel-in-progress: false

jobs:
  autonomous:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'opened') || (github.event_name == 'issue_comment' && github.event.action == 'created' && contains(github.event.comment.body, '/mosharrof'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main snapshot
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install runtime dependencies
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install requests

      - name: Baseline tests
        run: python3 -m pytest -q

      - name: Build backlog-aware task
        env:
          EVENT_NAME: \${{ github.event_name }}
          ISSUE_TITLE: \${{ github.event.issue.title }}
          ISSUE_BODY: \${{ github.event.issue.body }}
          COMMENT_BODY: \${{ github.event.comment.body }}
          GH_TOKEN: \${{ github.token }}
          GH_REPO: \${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            OPEN_PRS="$(gh pr list --repo "$GH_REPO" --state open --limit 30 --json number,title,url,headRefName,baseRefName,isDraft,mergeStateStatus,reviewDecision 2>/dev/null || printf '[]')"
            RECENT_RUNS="$(gh run list --repo "$GH_REPO" --limit 25 --json name,status,conclusion,createdAt,url,headBranch,event 2>/dev/null || printf '[]')"
          else
            OPEN_PRS='[]'
            RECENT_RUNS='[]'
          fi
          export OPEN_PRS RECENT_RUNS
          python3 - <<'PY'
          import os
          event=os.environ.get("EVENT_NAME","schedule")
          if event=="schedule":
              task=("NIGHTLY BACKLOG DUTY for MOSHARROF. Work only on already-existing tasks and plans; do not invent new features. "
                    "First triage open PRs, failed or still-running Actions, merge conflicts, and existing web/PWA plus Android chat verification. "
                    "Prioritize red checks and stalled work, then the oldest mergeable backlog items. Inspect evidence, identify root causes, make the smallest safe patch only in the allowed source/test/docs paths, and run the full test suite. "
                    "Never modify deployment/security workflows, bypass protection, merge PRs, or claim success without evidence. If a blocker needs unavailable permissions, physical-device access, or protected workflow changes, document it and continue to another safe task. "
                    "Keep main/Live safe. Do not add unrelated features until existing backlog is cleared.")
          elif event=="workflow_dispatch":
              task=("Manual MOSHARROF backlog recovery. Inspect existing PRs and failed/stalled workflows first; resolve the oldest safe blocker. "
                    "No new feature scope, no direct main edits, no unsafe merge/deploy, and no success claims without test evidence.")
          elif event=="issues":
              task="Existing user task:\n"+os.environ.get("ISSUE_TITLE","")+"\n"+os.environ.get("ISSUE_BODY","")
          else:
              task="Existing user task:\n"+os.environ.get("COMMENT_BODY","")
          if event in ("schedule","workflow_dispatch"):
              task += "\n\nOPEN PR BACKLOG (JSON):\n"+os.environ.get("OPEN_PRS","[]")
              task += "\n\nRECENT ACTION RUNS (JSON; inspect failed/in-progress items first):\n"+os.environ.get("RECENT_RUNS","[]")
          open("/tmp/task.txt","w",encoding="utf-8").write(task[:12000])
          PY

      - name: Autonomous planner and patcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
        run: |
          test -n "$GEMINI_API_KEY"
          python3 .github/scripts/mosharrof_agent.py /tmp/task.txt

      - name: Full verification
        run: python3 -m pytest -q

      - name: Protected change-surface check
        shell: bash
        run: |
          if git diff --name-only HEAD~1 2>/dev/null | grep -E '^\.github/workflows/(deploy-pages|verification-gate)\.yml$|^CODEOWNERS$' >/dev/null; then
            echo "Protected deployment/security file was modified."
            exit 1
          fi
          if git diff HEAD~1 -- . | grep -nE 'rm -rf|git push --force|git reset --hard|gh repo delete|delete-repository' >/dev/null; then
            echo "Destructive operation detected."
            exit 1
          fi
