name: Mosharrof Autonomous Work Cycle

on:
  schedule:
    # Bangladesh time 20:00–08:00: UTC hours 14–23 and 0–2. GitHub schedule is best-effort; this is recurring work, not a guaranteed continuous 12-hour runner.
    - cron: "0 0-2,14-23 * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read

concurrency:
  group: mosharrof-autonomous
  cancel-in-progress: false

jobs:
  autonomous:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'opened') || (github.event_name == 'issue_comment' && github.event.action == 'created' && contains(github.event.comment.body, '/mosharrof'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main snapshot
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install runtime dependencies
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install requests

      - name: Baseline tests
        run: python3 -m pytest -q

      - name: Build backlog-aware task
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ secrets.MOSHARROF_RECOVERY_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/build_backlog_task.py

      - name: Autonomous planner and patcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
        run: |
          test -n "$GEMINI_API_KEY"
          python3 .github/scripts/mosharrof_agent.py /tmp/task.txt

      - name: Full verification
        run: python3 -m pytest -q

      - name: Protected change-surface check
        run: python3 scripts/automation/protected_change_surface.py

      - name: Open review PR for verified autonomous change
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/open_verified_autonomous_pr.py
