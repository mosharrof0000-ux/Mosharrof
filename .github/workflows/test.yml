name: Mosharrof Tests
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js for memory and chat tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify image engine prompt parsing
        run: node scripts/test_image_engine.mjs
      - name: Test personal memory and chat context integration
        run: node --test tests/personal-memory-engine.test.mjs tests/test_chat_provider_failover_runtime.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python3 scripts/run_organ_checks.py
      - run: python -m pytest -q
