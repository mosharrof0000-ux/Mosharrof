name: Mosharrof Tests
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Engine regression checks
        run: node scripts/test_image_engine.mjs && node tests/test_personal_memory_engine.mjs && node --test tests/personal-memory-engine.test.mjs && node --check core/personal-memory-bridge.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt && python3 scripts/run_organ_checks.py && python -m pytest -q
