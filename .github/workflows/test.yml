name: Mosharrof Tests
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify image engine prompt parsing
        run: node scripts/test_image_engine.mjs
      - name: Test organ runtime contracts
        run: node --experimental-default-type=module --test tests/architecture/organ-runtime.test.mjs
      - name: Test user preference intelligence
        run: node --experimental-default-type=module --test organs/user-preference-intelligence/tests/preference-intelligence.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Validate organ manifests
        run: python3 scripts/mosharrof_registry.py --validate-only
