name: Mosharrof Tests
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify image engine prompt parsing
        run: node scripts/test_image_engine.mjs
      - name: Test personal memory engine
        run: node tests/test_personal_memory_engine.mjs
      - name: Test memory retrieval and timeline regressions
        run: node --test tests/personal-memory-engine.test.mjs
      - name: Test repository knowledge index
        run: node --test tests/repository-knowledge-index.test.mjs tests/repository-knowledge-crawler.test.mjs
      - name: Build repository knowledge snapshot (not published)
        run: node scripts/build-repository-knowledge-index.mjs --out /tmp/repository-knowledge-index.json
      - name: Check memory bridge syntax
        run: node --check core/personal-memory-bridge.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python3 scripts/run_organ_checks.py
      - run: python -m pytest -q
