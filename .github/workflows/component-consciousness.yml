name: Mosharrof Component Consciousness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  awareness:
    name: Component awareness heartbeat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run full component consciousness audit
        run: python3 scripts/mosharrof_component_consciousness.py
      - name: Verify autonomous engine is protected
        run: |
          # AI may create a review PR, but it must never merge its own proposal.
          ! grep -Fq '"gh", "pr", "merge"' scripts/mosharrof_autonomous_engine.py
          ! grep -Fq '"--auto"' scripts/mosharrof_autonomous_engine.py
          ! grep -Fq '"gh","pr","merge"' scripts/autonomous_agent.py
          ! grep -Fq '"--auto"' scripts/autonomous_agent.py
          grep -Fq 'PR created for review; automatic merge intentionally disabled' scripts/mosharrof_autonomous_engine.py
          grep -Fq 'PR opened for review; automatic merge intentionally disabled' scripts/autonomous_agent.py
          ! grep -Fq '"git", "push", "origin", "main' scripts/mosharrof_autonomous_engine.py
