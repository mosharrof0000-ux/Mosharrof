name: MOSHARROF Automation Heartbeat (15m)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: mosharrof-automation-heartbeat
  cancel-in-progress: false

jobs:
  inspect-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout orchestration registry and dispatcher
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Inspect registered projects and recover idle workers
        env:
          # Cross-repository dispatch requires Actions: write on Al-Quran Research.
          # Fallback github.token is limited to this repository.
          GH_TOKEN: ${{ secrets.MOSHARROF_AUTOMATION_TOKEN || secrets.MOSHARROF_RECOVERY_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/automation/dispatch_registered_workers.sh
          bash scripts/automation/dispatch_registered_workers.sh .github/automation/project-workers.json
