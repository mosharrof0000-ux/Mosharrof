name: One-time live chat smoke test

on:
  push:
    branches:
      - test/live-real-chat-smoke-once-20261017

permissions:
  contents: read

jobs:
  live-chat-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 playwright
          python -m playwright install --with-deps chromium

      - name: Send one synthetic prompt through the live UI
        run: |
          python3 scripts/live_real_chat_smoke.py \
            --url https://mosharrof0000-ux.github.io/Mosharrof/ \
            --output-dir artifacts/live-real-chat

      - name: Upload real-chat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-time-live-real-chat-smoke
          path: artifacts/live-real-chat/
          if-no-files-found: warn
          retention-days: 14
