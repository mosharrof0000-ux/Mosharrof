name: Cleanup Discipline Reminder

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cleanup-reminder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remind:
    name: Leave the repo clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run cleanup check
        id: check
        continue-on-error: true
        run: |
          set +e
          python scripts/cleanup_check.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "status=CLEAN" >> "$GITHUB_OUTPUT"
          else
            echo "status=NOT_CLEAN" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Print discipline reminder
        run: |
          echo "=============================================="
          echo "  MOSHARROF CLEANUP DISCIPLINE REMINDER"
          echo "=============================================="
          echo ""
          echo "Rule: কাজ → টেস্ট → মার্জ → পরিষ্কার → সাইন-অফ → চলে যাও"
          echo ""
          echo "Checklist:"
          echo "  [ ] No temp/debug files left behind"
          echo "  [ ] Feature branch merged / cleaned"
          echo "  [ ] Tests passing"
          echo "  [ ] Live not broken"
          echo "  [ ] Short sign-off written"
          echo ""
          echo "Full rules: docs/CLEANUP_DISCIPLINE.md"
          echo "Script:     python scripts/cleanup_check.py"
          echo ""
          echo "Cleanup check status: ${{ steps.check.outputs.status }}"
          echo "=============================================="

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.check.outputs.status }}' || 'UNKNOWN';
            const body = [
              '## Cleanup Discipline Reminder',
              '',
              status === 'CLEAN'
                ? '✅ **Cleanup check: CLEAN** — safe to leave after merge.'
                : '⚠️ **Cleanup check: NOT CLEAN** — fix issues before leaving.',
              '',
              '**Rule:** কাজ → টেস্ট → মার্জ → পরিষ্কার → সাইন-অফ → চলে যাও',
              '',
              '### Checklist',
              '- [ ] No temp/debug files',
              '- [ ] Feature branch cleaned after merge',
              '- [ ] Tests passing',
              '- [ ] Live not broken',
              '- [ ] Short sign-off written',
              '',
              'See `docs/CLEANUP_DISCIPLINE.md` · Run `python scripts/cleanup_check.py`',
              '',
              '_Non-blocking reminder — does not fail the PR._'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## Cleanup Discipline Reminder';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
