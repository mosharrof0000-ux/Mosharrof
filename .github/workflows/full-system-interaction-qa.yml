name: MOSHARROF Full-System Interaction QA

on:
  schedule:
    # One live verification at 20:37 Bangladesh time; GitHub schedule is best-effort.
    - cron: "37 14 * * *"
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Deploy Mosharrof Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Choose safe mock checks or one real live chat test (uses provider quota)"
        type: choice
        required: true
        default: live
        options:
          - live
          - candidate
          - live-real-chat

permissions:
  contents: read

concurrency:
  group: mosharrof-full-system-qa-${{ github.ref }}
  # Queue overlapping runs instead of cancelling in-progress verification.
  cancel-in-progress: false

jobs:
  interaction-qa:
    # A completed deployment can be a failure or cancellation; inspect live only
    # after a successful Pages deployment. PR, schedule and manual runs remain enabled.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright with transient-network retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 5 --timeout 60 playwright &&
               python -m playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Network/dependency setup attempt $attempt failed; retrying."
            sleep $((attempt * 15))
          done
          echo "Browser dependencies remained unavailable after retries."
          exit 1

      - name: Prepare candidate Pages assets
        if: github.event_name == 'pull_request' || inputs.target == 'candidate'
        run: python3 scripts/prepare_web_organ_runtime.py

      - name: Start candidate Pages server
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') || inputs.target == 'candidate'
        run: |
          python3 -m http.server 4173 --directory web >/tmp/mosharrof-inspector-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mosharrof-inspector-server.log
          exit 1

      - name: Select safe inspection target
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" || ("${{ github.event_name }}" == "push" && "${{ github.ref }}" != "refs/heads/main") || "${{ inputs.target }}" == "candidate" ]]; then
            echo "url=http://127.0.0.1:4173/" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://mosharrof0000-ux.github.io/Mosharrof/" >> "$GITHUB_OUTPUT"
          fi

      - name: Run safe mobile interaction inspection
        if: github.event_name != 'workflow_dispatch' || inputs.target != 'live-real-chat'
        run: |
          python3 scripts/live_screen_inspector.py --url "${{ steps.target.outputs.url }}" --output-dir artifacts/live-screen-inspector

      - name: Run one real live chat round-trip
        if: (github.event_name == 'workflow_dispatch' && inputs.target == 'live-real-chat') || (github.event_name == 'schedule') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'pull_request' && (github.head_ref == 'feature/main-chat-newchat-floating-popup-20261018' || github.head_ref == 'fix/live-floating-chat-path-qa-20261018' || github.head_ref == 'fix/refresh-pwa-cache-for-floating-chat-20261018'))
        run: python3 scripts/live_real_chat_smoke.py --url "${{ steps.target.outputs.url }}" --output-dir artifacts/live-screen-inspector

      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-live-screen-inspector-${{ github.run_id }}
          path: artifacts/live-screen-inspector/
          if-no-files-found: warn
          retention-days: 14
