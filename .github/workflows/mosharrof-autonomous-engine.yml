name: MOSHARROF AI Engine
on:
  push:
    branches: [main]
    paths: [".github/workflows/mosharrof-autonomous-engine.yml"]
  schedule:
    - cron: "0 0-2,14-23 * * *"
  workflow_dispatch:
    inputs:
      request: {required: false, type: string}
permissions: {contents: write, pull-requests: write}
concurrency: {group: mosharrof-autonomous-engine, queue: max}
jobs:
  autonomous-work:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - name: Preflight configured AI provider without exposing secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ]; then echo "AI provider configured: Gemini";
          elif [ -n "${GROQ_API_KEY:-}" ]; then echo "AI provider configured: Groq";
          elif [ -n "${OPENROUTER_API_KEY:-}" ]; then echo "AI provider configured: OpenRouter";
          else
            echo "::error::No AI provider credentials are configured. Add GEMINI_API_KEY, GROQ_API_KEY, or OPENROUTER_API_KEY in repository Actions secrets; values are never printed."
            exit 1
          fi
      - name: Install test and browser dependencies
        run: |
          pip install -r requirements.txt
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run guarded autonomous engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUEST: ${{ inputs.request }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/mosharrof_autonomous_engine.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "engine-${{ github.run_id }}", path: artifacts/, retention-days: 30}
