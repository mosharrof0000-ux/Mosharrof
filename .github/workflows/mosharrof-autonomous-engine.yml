name: Mosharrof Autonomous Engine
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      request:
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write
  checks: read
concurrency:
  group: mosharrof-autonomous-engine
jobs:
  autonomous-work:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Install autonomous engine test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run autonomous agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUEST: ${{ inputs.request }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/mosharrof_autonomous_engine.py
