name: MOSHARROF AI Engine
on:
  schedule:
    - cron: "0 0-2,14-23 * * *"
  workflow_dispatch:
    inputs:
      request: {required: false, type: string}
permissions:
  contents: write
  pull-requests: write
concurrency: {group: mosharrof-autonomous-engine, queue: max}
jobs:
  autonomous-work:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - name: Install deps
        run: |
          python -m pip install -r requirements.txt
          node --version
          npm --version
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUEST: ${{ inputs.request }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/mosharrof_autonomous_engine.py
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-engine-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
