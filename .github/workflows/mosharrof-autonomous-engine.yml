name: Mosharrof Autonomous Engine
on:
  schedule:
    # Bangladesh time 20:00–08:00; GitHub schedules are best-effort, not continuous execution.
    - cron: "0 0-2,14-23 * * *"
  workflow_dispatch:
    inputs:
      request:
        description: "Optional task for the autonomous engine"
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write
  checks: read
concurrency:
  group: mosharrof-autonomous-engine
  cancel-in-progress: false
jobs:
  autonomous-work:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Install autonomous engine test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install Node.js and Playwright for required visual QA
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser QA dependencies
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run autonomous agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUEST: ${{ inputs.request }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/mosharrof_autonomous_engine.py
