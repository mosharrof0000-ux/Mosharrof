name: Mosharrof Visual Inspector
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install browser inspection tools
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start proposed site
        run: |
          python3 -m http.server 4173 --directory web >/tmp/mosharrof-server.log 2>&1 &
          sleep 2
      - name: Capture screenshots and inspect UI
        run: node scripts/visual_inspector.mjs
      - name: Compare visual baseline
        run: node scripts/visual_compare.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-visual-inspection
          path: |
            visual-inspection/
            visual-baseline-report.json