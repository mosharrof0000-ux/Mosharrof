name: Automation Recovery Unit Tests

on:
  pull_request:
    paths:
      - "scripts/automation_recovery/**"
      - "tests/test_automation_supervisor.py"
      - ".github/workflows/automation-recovery-tests.yml"
  push:
    branches:
      - main
      - "feat/automation-watchdog-ai-recovery-*"
    paths:
      - "scripts/automation_recovery/**"
      - "tests/test_automation_supervisor.py"
      - ".github/workflows/automation-recovery-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-recovery-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile recovery module
        run: python -m py_compile scripts/automation_recovery/supervisor.py
      - name: Run recovery unit tests
        run: python -m pytest -q tests/test_automation_supervisor.py
