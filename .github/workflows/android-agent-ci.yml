name: Android Agent CI

on:
  pull_request:
    paths:
      - "android-agent/**"
      - ".github/workflows/android-agent-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "android-agent/**"
      - ".github/workflows/android-agent-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Run emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: cd android-agent && gradle --no-daemon connectedDebugAndroidTest
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-android-agent-debug
          path: android-agent/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
