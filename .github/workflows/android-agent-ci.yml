name: Android Agent CI

on:
  pull_request:
    paths:
      - "android-agent/**"
      - ".github/workflows/android-agent-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "android-agent/**"
      - ".github/workflows/android-agent-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Run emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          emulator-port: 5556
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          disable-spellchecker: true
          # Fold into a single shell command: this action executes script lines separately.
          script: >-
            adb wait-for-device;
            for attempt in $(seq 1 60); do boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')"; if [ "$boot_completed" = "1" ]; then break; fi; sleep 2; done;
            test "$(adb shell getprop sys.boot_completed | tr -d '\\r')" = "1";
            adb devices -l;
            adb shell getprop ro.build.version.sdk;
            adb shell wm dismiss-keyguard || true;
            adb shell input keyevent 224 || true;
            adb shell settings put global window_animation_scale 0;
            adb shell settings put global transition_animation_scale 0;
            adb shell settings put global animator_duration_scale 0;
            cd android-agent;
            if ! timeout 300s gradle --no-daemon connectedDebugAndroidTest; then adb logcat -d -t 3000 || true; exit 1; fi
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-android-agent-debug
          path: android-agent/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
