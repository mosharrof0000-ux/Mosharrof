name: MOSHARROF One-Time Real Live Chat Smoke Test

on:
  push:
    branches:
      - automation/run-live-real-chat-smoke-20261017

permissions:
  contents: read

concurrency:
  group: mosharrof-one-time-live-chat-smoke
  cancel-in-progress: false

jobs:
  real-live-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout one-time smoke branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 playwright
          python -m playwright install --with-deps chromium

      - name: Open live site and submit one real synthetic chat prompt
        run: |
          python3 scripts/live_real_chat_smoke.py \
            --url https://mosharrof0000-ux.github.io/Mosharrof/ \
            --output-dir artifacts/live-screen-inspector

      - name: Upload browser screenshots and real chat report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-one-time-real-live-chat-${{ github.run_id }}
          path: artifacts/live-screen-inspector/
          if-no-files-found: warn
          retention-days: 14
