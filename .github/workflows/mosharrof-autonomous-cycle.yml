name: Mosharrof Autonomous Cycle

on:
  schedule:
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      request:
        description: "Optional one-line Mosharrof task"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: mosharrof-autonomous-cycle
  cancel-in-progress: true

jobs:
  autonomous:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Baseline tests
        run: python -m pytest -q
      - name: Autonomous agent
        if: ${{ secrets.GEMINI_API_KEY != '' && secrets.AGENT_ACCESS_TOKEN != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_ACCESS_TOKEN: ${{ secrets.AGENT_ACCESS_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AUTONOMOUS_REQUEST: ${{ inputs.request }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/autonomous_agent.py
      - name: Safe no-op
        if: ${{ secrets.GEMINI_API_KEY == '' || secrets.AGENT_ACCESS_TOKEN == '' }}
        run: echo "Autonomous coding paused safely because required credentials are not configured."