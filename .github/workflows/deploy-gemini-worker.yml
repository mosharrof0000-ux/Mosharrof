name: Deploy Mosharrof Gemini Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-gemini-worker.yml"

permissions:
  contents: read

concurrency:
  group: deploy-gemini-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Gemini Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize and validate Cloudflare secrets
        shell: bash
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          clean() {
            printf '%s' "$1" \
              | tr -d '\r\n' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                    -e 's/^Authorization:[[:space:]]*//' \
                    -e 's/^authorization:[[:space:]]*//' \
                    -e 's/^Bearer //' -e 's/^bearer //' \
                    -e 's/^Token //' -e 's/^token //' \
                    -e 's/^CLOUDFLARE_API_TOKEN[=:][[:space:]]*//' \
                    -e 's/^CLOUDFLARE_ACCOUNT_ID[=:][[:space:]]*//' \
                    -e 's/^"//' -e 's/"$//' \
                    -e "s/^'//" -e "s/'$//" \
              | tr -d '[:space:]'
          }

          TOKEN="$(clean "$RAW_TOKEN")"
          ACCOUNT="$(clean "$RAW_ACCOUNT")"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN secret is empty or missing."
            exit 1
          fi
          if [ -z "$ACCOUNT" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID secret is empty or missing."
            exit 1
          fi

          echo "Token length: ${#TOKEN}"
          echo "Account ID (first 8): ${ACCOUNT:0:8}..."
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Verify token against Cloudflare API
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Token verify (GET /user/tokens/verify) ==="
          VERIFY="$(curl -sS -w "\nHTTP:%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" || true)"
          echo "$VERIFY"
          if ! echo "$VERIFY" | grep -q '"status":"active"'; then
            echo "ERROR: Cloudflare API token is not active or invalid."
            echo "Create a new token with permissions: Account → Workers Scripts → Edit"
            echo "Also include: Account → Account Settings → Read"
            exit 1
          fi

          echo "=== List accounts visible to this token ==="
          ACCTS="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=20" || true)"
          echo "$ACCTS" | head -c 2000
          echo

          if ! echo "$ACCTS" | grep -q "$CLOUDFLARE_ACCOUNT_ID"; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID does not match any account visible to this token."
            echo "Expected account id: $CLOUDFLARE_ACCOUNT_ID"
            echo "Fix: copy Account ID from Cloudflare Dashboard (right sidebar) into GitHub secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "Account ID matches token. OK."

      - name: Deploy Worker
        working-directory: worker
        run: |
          set -euo pipefail
          echo "Deploying with account $CLOUDFLARE_ACCOUNT_ID ..."
          npx --yes wrangler@3 deploy --config wrangler.toml 2>&1 | tee /tmp/wrangler-deploy.log
          echo "Deploy command finished."

      - name: Enable workers.dev subdomain for script
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="mosharrof-screenshot-analysis"
          echo "Enabling workers.dev route for $SCRIPT ..."
          RESP="$(curl -sS -w "\nHTTP:%{http_code}" -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"enabled":true,"previews_enabled":false}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT/subdomain" || true)"
          echo "$RESP"

      - name: Set Gemini secret
        working-directory: worker
        env:
          RAW_GEMINI: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          GEMINI="$(printf '%s' "$RAW_GEMINI" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$GEMINI" ]; then
            echo "ERROR: GEMINI_API_KEY secret is empty or missing."
            exit 1
          fi
          echo "Gemini key length: ${#GEMINI}"
          printf '%s' "$GEMINI" | npx --yes wrangler@3 secret put GEMINI_API_KEY --config wrangler.toml


      - name: Set optional TTS provider secrets
        working-directory: worker
        env:
          RAW_ELEVENLABS: ${{ secrets.ELEVENLABS_API_KEY }}
          RAW_ELEVENLABS_VOICE: ${{ secrets.ELEVENLABS_VOICE_ID }}
          RAW_ELEVENLABS_ALLOW_PAID: ${{ secrets.ELEVENLABS_ALLOW_PAID }}
          RAW_ELEVENLABS_EXPIRES_AT: ${{ secrets.ELEVENLABS_KEY_EXPIRES_AT }}
          RAW_SARVAM: ${{ secrets.SARVAM_API_KEY }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }

          ELEVENLABS="$(clean "$RAW_ELEVENLABS")"
          ELEVENLABS_VOICE="$(clean "$RAW_ELEVENLABS_VOICE")"
          ELEVENLABS_ALLOW_PAID="$(clean "$RAW_ELEVENLABS_ALLOW_PAID")"
          ELEVENLABS_EXPIRES_AT="$(clean "$RAW_ELEVENLABS_EXPIRES_AT")"
          SARVAM="$(clean "$RAW_SARVAM")"

          if [ -n "$ELEVENLABS" ]; then
            printf '%s' "$ELEVENLABS" | npx --yes wrangler@3 secret put ELEVENLABS_API_KEY --config wrangler.toml
          fi
          if [ -n "$ELEVENLABS_VOICE" ]; then
            printf '%s' "$ELEVENLABS_VOICE" | npx --yes wrangler@3 secret put ELEVENLABS_VOICE_ID --config wrangler.toml
          fi
          if [ -n "$ELEVENLABS_ALLOW_PAID" ]; then
            printf '%s' "$ELEVENLABS_ALLOW_PAID" | npx --yes wrangler@3 secret put ELEVENLABS_ALLOW_PAID --config wrangler.toml
          fi
          if [ -n "$ELEVENLABS_EXPIRES_AT" ]; then
            printf '%s' "$ELEVENLABS_EXPIRES_AT" | npx --yes wrangler@3 secret put ELEVENLABS_KEY_EXPIRES_AT --config wrangler.toml
          fi
          if [ -n "$SARVAM" ]; then
            printf '%s' "$SARVAM" | npx --yes wrangler@3 secret put SARVAM_API_KEY --config wrangler.toml
          fi

      - name: Verify live TTS end-to-end
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="https://mosharrof-screenshot-analysis.mosharrof0000.workers.dev/health"
          TTS="https://mosharrof-screenshot-analysis.mosharrof0000.workers.dev/tts"
          echo "Checking live TTS configuration..."
          curl -fsS --connect-timeout 10 --max-time 20 "$HEALTH" > /tmp/tts-health.json
          cat /tmp/tts-health.json

          if grep -q '"elevenlabs_configured":true' /tmp/tts-health.json; then
            echo "ElevenLabs configured: running primary clear Bengali TTS verification."
            HTTP_CODE="$(curl -sS --connect-timeout 10 --max-time 120 -o /tmp/tts-response.json -w '%{http_code}' -X POST               -H "Origin: https://mosharrof0000-ux.github.io"               -H "Content-Type: application/json"               --data '{"text":"এটি মোশাররফ এআই-এর লাইভ পরিষ্কার বাংলা কণ্ঠ পরীক্ষা।","language_code":"bn-BD","pace":0.95}'               "$TTS" || true)"
            echo "Live primary TTS HTTP status: $HTTP_CODE"
            cat /tmp/tts-response.json
            test "$HTTP_CODE" = "200"
            python - <<'PY'
          import base64,json
          d=json.load(open("/tmp/tts-response.json",encoding="utf-8"))
          assert d.get("ok") is True, d
          assert d.get("provider") == "elevenlabs", d
          raw=base64.b64decode(d["audio_data"])
          assert len(raw)>500, len(raw)
          assert raw[:3] == b"ID3" or raw[:2] in (b"\xff\xfb",b"\xff\xf3",b"\xff\xf2"), raw[:8]
          print("PRIMARY BENGALI TTS VERIFIED:", len(raw), "bytes; provider=", d.get("provider"), "model=", d.get("model"), "chunks=", d.get("chunks"))
          PY
          elif grep -q '"sarvam_configured":true' /tmp/tts-health.json; then
            echo "ElevenLabs unavailable; Sarvam configured. Running Bengali fallback verification."
            HTTP_CODE="$(curl -sS --connect-timeout 10 --max-time 120 -o /tmp/tts-response.json -w '%{http_code}' -X POST               -H "Origin: https://mosharrof0000-ux.github.io"               -H "Content-Type: application/json"               --data '{"text":"এটি মোশাররফ এআই-এর লাইভ বাংলা কণ্ঠ পরীক্ষা।","language_code":"bn-IN","speaker":"rehan","pace":1,"output_audio_codec":"mp3"}'               "$TTS" || true)"
            echo "Live fallback TTS HTTP status: $HTTP_CODE"
            cat /tmp/tts-response.json
            test "$HTTP_CODE" = "200"
            python - <<'PY'
          import base64,json
          d=json.load(open("/tmp/tts-response.json",encoding="utf-8"))
          assert d.get("ok") is True, d
          assert d.get("provider") == "sarvam", d
          raw=base64.b64decode(d["audio_data"])
          assert len(raw)>1000, len(raw)
          assert raw[:3] == b"ID3" or raw[:2] in (b"\xff\xfb",b"\xff\xf3",b"\xff\xf2"), raw[:8]
          print("FALLBACK BENGALI TTS VERIFIED:", len(raw), "bytes; provider=", d.get("provider"), "model=", d.get("model"), "chunks=", d.get("chunks"))
          PY
          else
            echo "No advanced TTS provider key is configured on the Worker."
            echo "This is not a deployment failure; browser speech synthesis remains the final fallback."
          fi

      - name: Generate and verify a real image
        shell: bash
        run: |
          set -euo pipefail
          URL="https://mosharrof-screenshot-analysis.mosharrof0000.workers.dev/generate-image"
          echo "Generating verification image through the deployed Worker..."
          HTTP_CODE="$(curl -sS --connect-timeout 10 --max-time 120 -o /tmp/image-response.json -w '%{http_code}' -X POST \
            -H "Origin: https://mosharrof0000-ux.github.io" \
            -H "Content-Type: application/json" \
            --data '{"prompt":"A simple verification image: a blue circle on a white background, no text.","aspect_ratio":"1:1","image_size":"1K"}' \
            "$URL" || true)"
          echo "Image verification HTTP status: $HTTP_CODE"
          cat /tmp/image-response.json
          test "$HTTP_CODE" = "200"
          python - <<'PY'
          import base64,json
          d=json.load(open("/tmp/image-response.json",encoding="utf-8"))
          assert d.get("ok") is True, d
          raw=base64.b64decode(d["image_data"])
          assert len(raw)>1000, len(raw)
          assert raw[:3] == b"\xff\xd8\xff" or raw[:8] == b"\x89PNG\r\n\x1a\n", raw[:8]
          print("REAL FREE IMAGE GENERATION VERIFIED:", len(raw), "bytes")
          print("Model:", d.get("model"))
          PY

      - name: Verify Worker health
        run: |
          set -euo pipefail
          URL="https://mosharrof-screenshot-analysis.mosharrof0000.workers.dev/health"
          echo "Waiting for Worker edge propagation at $URL ..."
          for i in {1..15}; do
            if curl -fsS --connect-timeout 5 --max-time 10 "$URL" > /tmp/health.json; then
              cat /tmp/health.json
              grep -q '"ok":true' /tmp/health.json
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "ERROR: Worker health endpoint did not become reachable."
          echo "Trying alternate subdomain mosharrof000 ..."
          curl -sS "https://mosharrof-screenshot-analysis.mosharrof000.workers.dev/health" || true
          exit 1
