name: Deploy Mosharrof Gemini Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-gemini-worker.yml"

permissions:
  contents: read

concurrency:
  group: deploy-gemini-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Gemini Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Wrangler
        run: npm install --global wrangler@3

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          wrangler deploy --config worker/wrangler.toml

      - name: Set Gemini secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY"
          printf '%s' "$GEMINI_API_KEY" | wrangler secret put GEMINI_API_KEY --config worker/wrangler.toml

      - name: Verify Worker health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3             https://mosharrof-screenshot-analysis.mosharrof0000.workers.dev/health
