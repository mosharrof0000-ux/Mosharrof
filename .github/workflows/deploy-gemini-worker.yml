name: Deploy Mosharrof Gemini Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-gemini-worker.yml"

permissions:
  contents: read

concurrency:
  group: deploy-gemini-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Gemini Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize and validate Cloudflare secrets
        shell: bash
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          clean() {
            printf '%s' "$1" \
              | tr -d '\r\n' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                    -e 's/^Authorization:[[:space:]]*//' \
                    -e 's/^authorization:[[:space:]]*//' \
                    -e 's/^Bearer //' -e 's/^bearer //' \
                    -e 's/^Token //' -e 's/^token //' \
                    -e 's/^CLOUDFLARE_API_TOKEN[=:][[:space:]]*//' \
                    -e 's/^CLOUDFLARE_ACCOUNT_ID[=:][[:space:]]*//' \
                    -e 's/^"//' -e 's/"$//' \
                    -e "s/^'//" -e "s/'$//" \
              | tr -d '[:space:]'
          }

          TOKEN="$(clean "$RAW_TOKEN")"
          ACCOUNT="$(clean "$RAW_ACCOUNT")"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN secret is empty or missing."
            echo "Go to: Repo Settings → Secrets and variables → Actions"
            echo "Add secret named exactly: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          if [ -z "$ACCOUNT" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID secret is empty or missing."
            echo "Go to: Repo Settings → Secrets and variables → Actions"
            echo "Add secret named exactly: CLOUDFLARE_ACCOUNT_ID"
            echo "(From Cloudflare Dashboard → right sidebar Account ID)"
            exit 1
          fi

          echo "Token length: ${#TOKEN}"
          echo "Account ID length: ${#ACCOUNT}"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Deploy Worker
        working-directory: worker
        run: |
          set -euo pipefail
          npx --yes wrangler@3 deploy --config wrangler.toml

      - name: Set Gemini secret
        working-directory: worker
        env:
          RAW_GEMINI: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          GEMINI="$(printf '%s' "$RAW_GEMINI" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$GEMINI" ]; then
            echo "ERROR: GEMINI_API_KEY secret is empty or missing."
            echo "Add secret named exactly: GEMINI_API_KEY"
            exit 1
          fi
          printf '%s' "$GEMINI" | npx --yes wrangler@3 secret put GEMINI_API_KEY --config wrangler.toml

      - name: Verify Worker health
        run: |
          set -euo pipefail
          URL="https://mosharrof-screenshot-analysis.mosharrof0000.workers.dev/health"
          echo "Waiting for Worker edge propagation..."
          for i in {1..12}; do
            if curl -fsS --connect-timeout 5 --max-time 10 "$URL" > /tmp/health.json; then
              cat /tmp/health.json
              grep -q '"ok":true' /tmp/health.json
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "ERROR: Worker health endpoint did not become reachable."
          exit 1
