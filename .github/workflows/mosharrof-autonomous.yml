name: Mosharrof Autonomous Pipeline

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Task for Mosharrof"
        required: false
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: mosharrof-autonomous
  cancel-in-progress: false

jobs:
  propose:
    name: Isolated task + tests + visual QA + PR
    runs-on: ubuntu-latest
    outputs:
      app_configured: ${{ steps.preflight.outputs.configured }}
    steps:
      - name: Check autonomous credentials without exposing values
        id: preflight
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.MOSHARROF_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.MOSHARROF_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "${APP_CLIENT_ID:-}" && -n "${APP_PRIVATE_KEY:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "GitHub App credentials are configured; isolated agent work may proceed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SAFE PAUSE: autonomous PR creation was skipped because MOSHARROF_APP_CLIENT_ID and/or MOSHARROF_APP_PRIVATE_KEY is not configured. No credentials were printed and no repository changes were made." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create short-lived GitHub App token
        if: steps.preflight.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MOSHARROF_APP_CLIENT_ID }}
          private-key: ${{ secrets.MOSHARROF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Mosharrof
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read

      - name: Checkout main
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Install test and browser dependencies
        if: steps.preflight.outputs.configured == 'true'
        run: |
          python3 -m pip install -r requirements.txt
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Select request
        if: steps.preflight.outputs.configured == 'true'
        id: request
        env:
          INPUT_REQUEST: ${{ inputs.request }}
        run: |
          if [ -n "$INPUT_REQUEST" ]; then
            printf '%s' "$INPUT_REQUEST" > /tmp/request.txt
          else
            printf '%s' 'Scheduled Mosharrof maintenance audit: inspect for a clear safe user-visible defect or small missing feature; if none exists, make no change.' > /tmp/request.txt
          fi

      - name: Run guarded autonomous implementation
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          REQUEST_FILE: /tmp/request.txt
        run: python3 scripts/mosharrof_autonomous_engine.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-autonomous-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore

  boundary:
    name: Protected promotion boundary
    needs: propose
    if: needs.propose.outputs.app_configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Autonomous coding ends at a verified pull request."
          echo "Main remains protected."
          echo "Pages deploys only after an approved change reaches main."
