name: Mosharrof Autonomous Pipeline

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Task for Mosharrof"
        required: false
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: mosharrof-autonomous
  cancel-in-progress: false

jobs:
  propose:
    name: Isolated task + tests + visual QA + PR
    runs-on: ubuntu-latest
    steps:
      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MOSHARROF_APP_CLIENT_ID }}
          private-key: ${{ secrets.MOSHARROF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Mosharrof
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Install test and browser dependencies
        run: |
          python3 -m pip install -r requirements.txt
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: System awareness heartbeat
        env:
          AWARENESS_REPORT_FILE: /tmp/awareness_report.json
          AWARENESS_REQUEST_FILE: /tmp/awareness_request.txt
        run: python3 scripts/mosharrof_system_awareness.py

      - name: Select request
        id: request
        env:
          INPUT_REQUEST: ${{ inputs.request }}
        run: |
          if [ -n "$INPUT_REQUEST" ]; then
            printf '%s' "$INPUT_REQUEST" > /tmp/request.txt
          elif [ -s /tmp/awareness_request.txt ]; then
            cp /tmp/awareness_request.txt /tmp/request.txt
          else
            printf '%s' 'Scheduled Mosharrof maintenance audit: inspect for a clear safe user-visible defect or small missing feature; if none exists, make no change.' > /tmp/request.txt
          fi

      - name: Run guarded autonomous implementation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          REQUEST_FILE: /tmp/request.txt
        run: python3 scripts/mosharrof_autonomous_engine.py

      - name: Preserve awareness report
        if: always()
        run: |
          mkdir -p artifacts/awareness
          cp /tmp/awareness_report.json artifacts/awareness/report.json || true
          cp /tmp/awareness_request.txt artifacts/awareness/request.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-autonomous-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore

  boundary:
    name: Protected promotion boundary
    needs: propose
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Autonomous coding ends at a verified pull request."
          echo "Main remains protected."
          echo "Pages deploys only after an approved change reaches main."
