name: MOSHARROF Android APK WebView Real Chat QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mosharrof-apk-webview-real-chat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk-webview-real-chat:
    name: apk-webview-real-chat-attempt-${{ matrix.attempt }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        attempt: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout APK source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate smoke-test script syntax
        run: python -m py_compile scripts/android/apk_webview_real_chat_smoke.py
      - name: Validate emulator shell script syntax
        run: bash -n scripts/android/run_apk_webview_smoke.sh scripts/android/run_apk_webview_smoke_impl.sh
      - name: Install WebView CDP WebSocket client
        run: python -m pip install --disable-pip-version-check websocket-client
      - name: Download APK from the matching source build
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 150); do
            matching="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-apk.yml --branch "$SOURCE_BRANCH" --limit 20 --json databaseId,headSha,status,conclusion --jq 'first(.[] | select(.headSha == env.SOURCE_SHA))')"
            if [ -n "$matching" ] && [ "$matching" != "null" ]; then
              build_status="$(printf '%s' "$matching" | jq -r '.status')"
              build_conclusion="$(printf '%s' "$matching" | jq -r '.conclusion // ""')"
              if [ "$build_status" = "completed" ] && [ "$build_conclusion" = "success" ]; then
                run_id="$(printf '%s' "$matching" | jq -r '.databaseId')"
                break
              fi
              if [ "$build_status" = "completed" ] && [ "$build_conclusion" != "success" ]; then
                echo "::error::Matching APK build $SOURCE_SHA completed with conclusion '$build_conclusion'; failing fast."
                exit 1
              fi
            fi
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::No successful APK build for $SOURCE_SHA after 25 minutes."
            exit 1
          fi
          mkdir -p artifacts/apk
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name MOSHARROF-AI-Android-APK --dir artifacts/apk
          test -s artifacts/apk/app-debug.apk
      - name: Download latest successful main APK for scheduled/manual runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-apk.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id" && test "$run_id" != "null"
          mkdir -p artifacts/apk
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name MOSHARROF-AI-Android-APK --dir artifacts/apk
          test -s artifacts/apk/app-debug.apk
      - name: Initialize durable QA evidence before emulator boot
        run: |
          set -euo pipefail
          mkdir -p artifacts/apk-webview-chat
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "source_sha=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
            echo "event=$GITHUB_EVENT_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "emulator_stage=pre_boot"
            echo "note=Pre-boot evidence; smoke script may not have started."
          } > artifacts/apk-webview-chat/preflight.txt
      - name: Install APK and test real chat inside its WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 6144M
          heap-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          script: QA_ATTEMPT=${{ matrix.attempt }} bash scripts/android/run_apk_webview_smoke.sh
      - name: Upload APK WebView chat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-apk-webview-real-chat-${{ github.run_id }}-attempt-${{ matrix.attempt }}
          path: artifacts/apk-webview-chat/**
          if-no-files-found: warn
          retention-days: 30

  require-visible-real-chat-proof:
    name: require-visible-real-chat-proof
    if: always()
    needs: apk-webview-real-chat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find a successful install-launch-chat-screenshot attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/retries
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "mosharrof-apk-webview-real-chat-${GITHUB_RUN_ID}-attempt-*" --dir artifacts/retries
          echo "Attempt artifacts and success markers:"
          find artifacts/retries -name success-marker.txt -type f -print
          marker="$(find artifacts/retries -name success-marker.txt -type f -print -quit)"
          if [ -z "$marker" ]; then
            echo "::error::All three Android emulator attempts failed to prove a visible real-chat answer and screenshot. Inspect each attempt artifact before changing app code."
            exit 1
          fi
          echo "Verified success marker: $marker"
          cat "$marker"
          screenshot="$(find "$(dirname "$marker")" -maxdepth 1 -type f \\( -iname "*.png" -o -iname "*.jpg" \\) -print -quit)"
          if [ -z "$screenshot" ]; then
            echo "::error::Success marker exists but no screenshot file is present in that attempt artifact."
            exit 1
          fi
          echo "Screenshot proof file: $screenshot"
