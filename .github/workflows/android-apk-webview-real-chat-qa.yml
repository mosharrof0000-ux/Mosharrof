name: MOSHARROF Android APK WebView Real Chat QA

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feat/current-main-apk-real-chat-qa-20261019"]
  workflow_run:
    workflows: ["Build MOSHARROF Android APK"]
    types: [completed]
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mosharrof-apk-webview-real-chat-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  apk-webview-real-chat:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout APK source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || (github.event_name == 'push' && github.sha) || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate smoke-test script syntax
        run: python -m py_compile scripts/android/apk_webview_real_chat_smoke.py

      - name: Validate emulator shell script syntax
        run: bash -n scripts/android/run_apk_webview_smoke.sh

      - name: Install WebView CDP WebSocket client
        run: python -m pip install --disable-pip-version-check websocket-client

      - name: Download APK from triggering successful build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: MOSHARROF-AI-Android-APK
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts/apk

      - name: Select APK matching app-source changes (or main for test-only PRs)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          SOURCE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/apk artifacts/apk-webview-chat
          changed_files="$(git diff --name-only "${SOURCE_BASE_SHA}...${SOURCE_SHA}")"
          if printf '%s\n' "$changed_files" | grep -Eq '^(android/|web/|organs/|entities/|core/|native/|config/|scripts/android/|scripts/prepare_web_organ_runtime\.py$|scripts/mosharrof_registry\.py$|scripts/manual_provider_runtime_patch\.py$|scripts/mosharrof_size_gate\.py$|\.github/workflows/build-apk\.yml$)'; then
            echo "APK-affecting source changes detected; require a successful build for exact head $SOURCE_SHA."
            run_id=""
            for attempt in $(seq 1 90); do
              run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-apk.yml --branch "$SOURCE_BRANCH" --limit 20 --json databaseId,headSha,status,conclusion --jq 'first(.[] | select(.headSha == env.SOURCE_SHA and .status == "completed" and .conclusion == "success")) | .databaseId // empty')"
              if [ -n "$run_id" ]; then break; fi
              sleep 10
            done
            if [ -z "$run_id" ]; then
              echo "::error::APK-affecting changes were detected, but no successful exact-head APK build appeared within 15 minutes."
              exit 1
            fi
          else
            echo "No APK build inputs changed; using the latest successful main APK for the QA harness-only change."
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-apk.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -z "$run_id" ]; then
              echo "::error::No successful main APK build is available for this harness-only change."
              exit 1
            fi
          fi
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,headSha,headBranch,name,conclusion --jq '{run_id: .databaseId, head_sha: .headSha, branch: .headBranch, workflow: .name, conclusion: .conclusion}' > artifacts/apk-webview-chat/apk-source.json
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name MOSHARROF-AI-Android-APK --dir artifacts/apk
          test -s artifacts/apk/app-debug.apk

      - name: Download latest successful main APK for scheduled/manual runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-apk.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id" && test "$run_id" != "null"
          mkdir -p artifacts/apk
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name MOSHARROF-AI-Android-APK --dir artifacts/apk
          test -s artifacts/apk/app-debug.apk

      - name: Install APK and test real chat inside its WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 produced repeated system_server/System UI ANRs and a WebView renderer
          # crash in the 2026-10-28 artifact (CPU pressure exceeded 80%; no app CDP socket).
          # API 30 previously rendered the app/composer; bounded CDP retries are now in place.
          api-level: 30
          target: default
          arch: x86_64
          cores: 3
          ram-size: 3072M
          heap-size: 768M
          emulator-port: 5554
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash scripts/android/run_apk_webview_smoke.sh

      - name: Upload APK WebView chat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-apk-webview-real-chat-${{ github.run_id }}
          path: artifacts/apk-webview-chat/**
          if-no-files-found: warn
          retention-days: 30
