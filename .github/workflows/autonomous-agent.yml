name: Mosharrof Autonomous Agent

on:
  schedule:
    - cron: "17 */6 * * *"
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: mosharrof-autonomous
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.title, '[AUTO]') ||
      contains(github.event.issue.labels.*.name, 'mosharrof-auto')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq

      - name: Create isolated working branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="agent/auto-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Read automation request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            gh issue view "$ISSUE_NUMBER" --json title,body,labels > /tmp/request.json
            jq -r '"TITLE: "+.title+"\nBODY:\n"+(.body//"")' /tmp/request.json > /tmp/request.txt
          else
            printf '%s\n' 'Scheduled autonomous maintenance: inspect the project, identify only safe, clearly justified improvements, run all tests, and do not make speculative changes.' > /tmp/request.txt
          fi
          cat /tmp/request.txt

      - name: AI implementation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REQUEST: ${{ github.event.issue.body }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is not configured; stopping safely."; exit 1; }
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          req=pathlib.Path("/tmp/request.txt").read_text()
          prompt=f"""You are the Mosharrof autonomous project engineer.
Repository is already checked out. Work ONLY inside the current isolated branch.
USER REQUEST:
{req}
RULES:
- Never edit or push main.
- Never delete repository/project/critical files.
- Inspect existing code before changing it.
- Make the smallest safe implementation that satisfies the request.
- For screenshots/images in the request, analyze them if accessible and use them as UI requirements.
- Preserve existing working features.
- Do not invent secrets, credentials, permissions, URLs, or external services.
- Run the repository tests after changes.
- If the request is ambiguous or unsafe, make no change and explain why.
Return a concise implementation summary."""
          data=json.dumps({"contents":[{"parts":[{"text":prompt}]}]}).encode()
          url="https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key="+os.environ["GEMINI_API_KEY"]
          r=urllib.request.urlopen(urllib.request.Request(url,data=data,headers={"Content-Type":"application/json"}),timeout=120)
          out=json.loads(r.read())
          text=out["candidates"][0]["content"]["parts"][0]["text"]
          pathlib.Path("/tmp/ai-plan.txt").write_text(text)
          print(text)
          PY

      - name: Verify and test
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pytest -q
          test -f web/index.html

      - name: Create promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Mosharrof Autonomous Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m "auto: verified Mosharrof autonomous update"
          git push --set-upstream origin "$BRANCH"
          PR=$(gh pr create --base main --head "$BRANCH" --title "AUTO: verified Mosharrof update" --body "Autonomous change created in an isolated branch. Tests passed before promotion. AI report:\n\n$(cat /tmp/ai-plan.txt)")
          echo "PR=$PR" >> "$GITHUB_ENV"

      - name: Enable controlled auto-merge
        if: env.NO_CHANGES != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "$PR" --auto --squash
