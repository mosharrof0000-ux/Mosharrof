name: Mosharrof Visual QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: "URL to inspect"
        required: true
        default: "https://mosharrof0000-ux.github.io/Mosharrof/"
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory web >/tmp/mosharrof-server.log 2>&1 &
          sleep 3
      - name: Capture candidate screenshots
        env:
          TARGET_URL: ${{ inputs.url || 'http://127.0.0.1:4173/' }}
        run: node scripts/visual_qa.js "$TARGET_URL" artifacts/candidate
      - name: Visual structure checks
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("artifacts/candidate/report.json"))
          required=["header","composer","messages","drawer","fadeTop","fadeBottom"]
          missing=[x for x in required if not d["elements"].get(x)]
          if missing: raise SystemExit("Missing UI elements: "+", ".join(missing))
          if not d["page_ok"]: raise SystemExit("Visual QA page check failed")
          print("VISUAL QA: PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mosharrof-visual-qa
          path: artifacts/candidate/
