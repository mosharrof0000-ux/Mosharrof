name: Mosharrof Visual QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-qa-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install visual QA tools
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start candidate site
        run: |
          python3 -m http.server 4173 --directory web > /tmp/mosharrof-server.log 2>&1 &
          echo $! > /tmp/mosharrof-server.pid
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:4173/", timeout=2)
                  print("Candidate server ready")
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Candidate server did not start")
          PY

      - name: Capture and analyze desktop/mobile screenshots
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/visual_qa.py http://127.0.0.1:4173/ artifacts/visual-qa

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-visual-qa
          path: artifacts/visual-qa/
          retention-days: 30
