name: Mosharrof Verification Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify before promotion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed version
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify Pages entrypoint
        shell: bash
        run: |
          test -f web/index.html
          grep -q 'MOSHARROF AI' web/index.html
          grep -q 'setInterval' web/index.html
          grep -q '120000' web/index.html
          grep -q 'class="messages"' web/index.html
          grep -q 'class="composer"' web/index.html
          grep -q 'class="drawer-left"' web/index.html
          grep -q 'class="drawer-right"' web/index.html

      - name: Run project tests
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pytest -q

      - name: Start browser test server
        run: |
          nohup python3 -m http.server 4173 --directory web >/tmp/mosharrof-pages.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null

      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture mobile and desktop screenshots
        run: |
          mkdir -p artifacts/visual
          node scripts/mosharrof_visual_qa.mjs http://127.0.0.1:4173/

      - name: Verify screenshots are valid
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image
          names=["mobile.png","desktop.png","mobile-after-2s.png","desktop-after-2s.png"]
          for n in names:
              im=Image.open("artifacts/visual/"+n)
              assert im.width >= 320 and im.height >= 500
              assert im.getbbox()
          PY

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-visual-evidence
          path: artifacts/visual/
          if-no-files-found: error

      - name: Promotion decision
        run: echo "ALL VERIFICATION CHECKS PASSED — eligible for controlled promotion."
