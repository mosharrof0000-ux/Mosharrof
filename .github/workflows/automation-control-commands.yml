name: MOSHARROF Cross-Page Automation Commands

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  issues: write
  pull-requests: read

jobs:
  control-command:
    if: ${{ github.event.issue.number == 756 && github.event.comment.user.login == github.repository_owner && (startsWith(github.event.comment.body, '/mosharrof start') || startsWith(github.event.comment.body, '/mosharrof resume') || startsWith(github.event.comment.body, '/mosharrof status')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Route command
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const command = context.payload.comment.body.trim().split(/\s+/).slice(0, 2).join(' ');
            if (command === '/mosharrof start' || command === '/mosharrof resume') {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo,
                workflow_id: 'parallel-engine-builder.yml',
                ref: 'main'
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: 756,
                body: 'অটোমেশন কমান্ড গ্রহণ করা হয়েছে: **' + command + '**। [Actions রান দেখুন](https://github.com/' + owner + '/' + repo + '/actions/workflows/parallel-engine-builder.yml).'
              });
              return;
            }
            if (command === '/mosharrof status') {
              const [runs, pulls] = await Promise.all([
                github.rest.actions.listWorkflowRunsForRepo({ owner, repo, per_page: 10 }),
                github.rest.pulls.list({ owner, repo, state: 'open', per_page: 20 })
              ]);
              const runLines = runs.data.workflow_runs.slice(0, 8).map(r =>
                '- [' + r.name + ' #' + r.run_number + '](' + r.html_url + ') — ' + r.status + (r.conclusion ? ' / ' + r.conclusion : '')
              );
              const prLines = pulls.data.slice(0, 10).map(p =>
                '- [PR #' + p.number + ': ' + p.title + '](' + p.html_url + ')'
              );
              const body = [
                '## MOSHARROF অটোমেশন স্ট্যাটাস', '',
                '### সাম্প্রতিক রান', ...(runLines.length ? runLines : ['- কোনো রান পাওয়া যায়নি']), '',
                '### খোলা PR', ...(prLines.length ? prLines : ['- খোলা PR নেই']), '',
                'অটোমেশন যাচাই করা patch-এর জন্য review-only PR খোলে; নিজে merge/deploy করে না.',
                'সব রান: https://github.com/' + owner + '/' + repo + '/actions'
              ].join('\n');
              await github.rest.issues.createComment({ owner, repo, issue_number: 756, body });
            }
