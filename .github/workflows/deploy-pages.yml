name: Deploy Mosharrof Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Enforce file and folder size budgets
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main^' }}
        run: python3 scripts/mosharrof_size_gate.py --base "$BASE_REF"
      - run: python -m pytest -q
      - name: Verify Pages artifact
        shell: bash
        run: |
          test -f web/index.html
          grep -q 'MOSHARROF AI' web/index.html
      - name: Prepare candidate organ runtime assets
        run: python3 scripts/prepare_web_organ_runtime.py
      - name: Install Chromium for candidate runtime smoke test
        run: python -m pip install playwright && python -m playwright install chromium
      - name: Start candidate Pages server
        shell: bash
        run: |
          nohup python3 -m http.server 4173 --directory web >/tmp/mosharrof-pages.log 2>&1 &
          pid=$!
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            kill -0 "$pid" 2>/dev/null || { cat /tmp/mosharrof-pages.log; exit 1; }
            sleep 1
          done
          cat /tmp/mosharrof-pages.log
          echo "Server readiness timed out."
          exit 1
      - name: Test candidate organ runtime in Chromium
        env:
          PAGE_URL: http://127.0.0.1:4173/
        run: python3 scripts/live_organ_browser_health.py
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/prepare_web_organ_runtime.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Install Chromium for Live runtime health check
        run: python -m pip install playwright && python -m playwright install chromium
      - name: Live deployment health check
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3; do
            echo "Live Pages health check attempt $attempt/3"
            if python3 scripts/live_organ_browser_health.py; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Waiting 15 seconds for Pages/CDN and runtime assets to converge..."
              sleep 15
            fi
          done
          echo "Live Pages health check failed after 3 attempts."
          exit 1
