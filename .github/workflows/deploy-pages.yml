name: Deploy Mosharrof Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build public entry page
        run: |
          mkdir -p web
          cat > web/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Mosharrof Karim</title>
          <meta name="description" content="Mosharrof Karim — Intelligent Entity and AI Brain Architecture">
          <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071018;color:#f4f7fb;font-family:system-ui,sans-serif}main{width:min(680px,88vw);padding:40px;border:1px solid #294252;border-radius:24px;background:#0b1720}h1{font-size:clamp(2rem,8vw,4rem);margin:0 0 12px}p{line-height:1.7;color:#b9c9d4}a{color:#d7ecff}</style></head>
          <body><main><h1>Mosharrof</h1><p>Mosharrof Karim — Intelligent Entity and AI Brain Architecture.</p><p>Core public entry point.</p><a href="https://github.com/mosharrof0000-ux/Mosharrof">GitHub Repository</a></main></body>
          </html>
          EOF
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
