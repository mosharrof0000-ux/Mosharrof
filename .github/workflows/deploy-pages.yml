name: Deploy Mosharrof Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Enforce file and folder size budgets
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main^' }}
        run: python3 scripts/mosharrof_size_gate.py --base "$BASE_REF"
      - run: python -m pytest -q
      - name: Verify Pages artifact
        shell: bash
        run: |
          test -f web/index.html
          grep -q 'MOSHARROF AI' web/index.html
      - name: Prepare candidate organ runtime assets
        run: python3 scripts/prepare_web_organ_runtime.py
      - name: Install Chromium for candidate runtime smoke test
        run: python -m pip install playwright && python -m playwright install chromium
      - name: Start candidate Pages server
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --directory web >/tmp/mosharrof-pages.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo "Candidate Pages server ready."
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/mosharrof-pages.log
              echo "Candidate Pages server exited before becoming ready."
              exit 1
            fi
            sleep 1
          done
          cat /tmp/mosharrof-pages.log
          echo "Candidate Pages server readiness timed out."
          exit 1
      - name: Test candidate organ runtime in Chromium
        env:
          PAGE_URL: http://127.0.0.1:4173/
        run: python3 scripts/live_organ_browser_health.py
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/prepare_web_organ_runtime.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Install Chromium for Live runtime health check
        run: python -m pip install playwright && python -m playwright install chromium
      - name: Live deployment health check
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/live_organ_browser_health.py
