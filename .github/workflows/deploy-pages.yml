name: Deploy Mosharrof Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Verify Pages artifact
        shell: bash
        run: |
          test -f web/index.html
          grep -q 'MOSHARROF AI' web/index.html
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Live deployment health check
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, urllib.request
          url=os.environ["PAGE_URL"]
          with urllib.request.urlopen(url, timeout=30) as r:
              body=r.read(200000).decode("utf-8","ignore")
              assert r.status == 200
              assert "MOSHARROF AI" in body
          print("LIVE HEALTH CHECK: PASS")
          PY
