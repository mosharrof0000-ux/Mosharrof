name: Deploy Mosharrof Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Enforce file and folder size budgets
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main^' }}
        run: python3 scripts/mosharrof_size_gate.py --base "$BASE_REF"
      - run: python -m pytest -q
      - name: Verify Pages artifact
        shell: bash
        run: |
          test -f web/index.html
          grep -q 'MOSHARROF AI' web/index.html
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/prepare_web_organ_runtime.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Live deployment health check
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base=os.environ["PAGE_URL"].rstrip("/") + "/"
          def read(path): return urllib.request.urlopen(base+path,timeout=30).read().decode("utf-8","ignore")
          assert "MOSHARROF AI" in read("")
          ids={x["id"] for x in json.loads(read("runtime/organs.registry.json"))["organs"]}
          assert {"chat","notes"}.issubset(ids)
          for p in ("entities/organ-bootstrap.js","runtime/core/organ-runtime/index.js","runtime/core/organ-runtime/persistent-memory.js","runtime/core/organ-runtime/scoped-api.js","organs/chat/index.js"): read(p)
          print("LIVE ORGAN RUNTIME HEALTH CHECK: PASS")
          PY
