name: Deploy Mosharrof Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enforce architecture before tests and promotion
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "ARCHITECTURE GATE: FAIL — missing push base; refusing promotion."
              exit 2
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE="HEAD^"
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            BASE="origin/main"
          fi
          python3 scripts/mosharrof_architecture_gate.py "$BASE"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate all organ manifests and declared links
        run: python3 scripts/mosharrof_registry.py --validate-only
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Verify Pages artifact
        shell: bash
        run: |
          test -f web/index.html
          grep -q 'MOSHARROF AI' web/index.html
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate registry from organ manifests
        run: python3 scripts/mosharrof_registry.py --output web/runtime/organs.registry.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Live deployment health check
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, urllib.request
          url=os.environ["PAGE_URL"]
          with urllib.request.urlopen(url, timeout=30) as r:
              body=r.read(200000).decode("utf-8","ignore")
              assert r.status == 200
              assert "MOSHARROF AI" in body
          print("LIVE HEALTH CHECK: PASS")
          PY
