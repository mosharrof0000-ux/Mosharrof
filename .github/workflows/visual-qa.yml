name: Mosharrof Visual QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: "URL to inspect"
        required: false
        default: "https://mosharrof0000-ux.github.io/Mosharrof/"
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --directory web >/tmp/server.log 2>&1 &
      - name: Capture screenshots and inspect UI
        env:
          TARGET_URL: ${{ inputs.url || 'http://127.0.0.1:4173/' }}
        run: node scripts/visual_qa.mjs "$TARGET_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: mosharrof-visual-qa-${{ github.sha }}
          path: visual-qa/
          retention-days: 30
