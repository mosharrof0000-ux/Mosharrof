name: Mosharrof Visual QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: visual-qa-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Install browser QA dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Start local preview
        run: |
          nohup python3 -m http.server 4173 --directory web >/tmp/mosharrof-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ && break; sleep 1; done
      - name: Render, screenshot and inspect
        run: python3 scripts/visual_qa.py
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-visual-qa
          path: artifacts/visual-qa/**
