name: Mosharrof Visual QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: visual-qa-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          path: candidate
      - name: Checkout current main for visual baseline
        uses: actions/checkout@v6
        with:
          ref: main
          path: baseline
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install browser QA dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Start rendered baseline and candidate
        run: |
          nohup python3 -m http.server 4173 --directory baseline/web >/tmp/base.log 2>&1 &
          nohup python3 -m http.server 4174 --directory candidate/web >/tmp/candidate.log 2>&1 &
          for port in 4173 4174; do
            for i in {1..30}; do curl -fsS http://127.0.0.1:$port/ >/dev/null && break; sleep 1; done
          done
      - name: Render, screenshot and compare
        working-directory: candidate
        env:
          MOSHARROF_BASE_URL: http://127.0.0.1:4173/
          MOSHARROF_QA_URL: http://127.0.0.1:4174/
        run: python3 scripts/visual_qa.py
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-visual-qa
          path: candidate/artifacts/visual-qa/**
