name: Mosharrof Visual QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: read
  pull-requests: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install browser test tools
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run visual QA
        env:
          LIVE_URL: https://mosharrof0000-ux.github.io/Mosharrof/
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/mosharrof_visual_qa.py
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-visual-qa-${{ github.run_id }}
          path: visual-qa-result.json
          if-no-files-found: ignore
