name: Mosharrof Visual QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory web >/tmp/server.log 2>&1 &
          sleep 2
      - run: python3 scripts/visual_qa.py --url http://127.0.0.1:4173/ --output artifacts/candidate.png
      - run: python3 scripts/visual_qa.py --url https://mosharrof0000-ux.github.io/Mosharrof/ --output artifacts/live.png
      - name: Gemini visual comparison
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/visual_compare.py --candidate artifacts/candidate.png --live artifacts/live.png --report artifacts/visual-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: mosharrof-visual-qa
          path: artifacts/
