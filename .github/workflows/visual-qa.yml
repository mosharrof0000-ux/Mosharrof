name: Mosharrof Visual QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Start candidate
        run: python3 -m http.server 4173 --directory web >/tmp/candidate.log 2>&1 &
      - name: Candidate screenshots
        run: python3 scripts/visual_qa.py capture --url http://127.0.0.1:4173
      - name: Main baseline
        run: |
          git fetch origin main --depth=1
          git worktree add --detach /tmp/mosharrof-main origin/main
          python3 -m http.server 4174 --directory /tmp/mosharrof-main/web >/tmp/baseline.log 2>&1 &
          sleep 2
      - name: Baseline screenshots
        run: python3 scripts/visual_qa.py baseline --url http://127.0.0.1:4174
      - name: Pixel comparison
        run: python3 scripts/visual_qa.py compare
      - name: Gemini visual review
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/visual_qa.py ai-review
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-visual-qa
          path: visual-qa/
          if-no-files-found: ignore
