name: Personal Memory Browser Smoke Test

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/personal-memory-browser-smoke.yml"
      - "tests/e2e/personal-memory-browser-smoke.mjs"
      - "core/personal-memory-engine.js"
      - "core/personal-memory-bridge.js"
      - "organs/chat/index.js"
      - "scripts/prepare_web_organ_runtime.py"
      - "web/core/personal-memory-engine.js"
      - "web/core/personal-memory-bridge.js"
      - "web/index.html"
  workflow_dispatch:
    inputs:
      test_url:
        description: "MOSHARROF site URL; a live run sends two test chat requests"
        required: true
        default: "https://mosharrof0000-ux.github.io/Mosharrof/"

permissions:
  contents: read

concurrency:
  group: memory-browser-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-memory-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare candidate Pages runtime for pull requests
        if: github.event_name == 'pull_request'
        run: python3 scripts/prepare_web_organ_runtime.py
      - name: Start candidate Pages server
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          nohup python3 -m http.server 4173 --directory web >/tmp/mosharrof-memory-pages.log 2>&1 &
          pid=$!
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            kill -0 "$pid" 2>/dev/null || { cat /tmp/mosharrof-memory-pages.log; exit 1; }
            sleep 1
          done
          cat /tmp/mosharrof-memory-pages.log
          echo "Candidate Pages server did not become ready."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test send, persistent storage, and recall after reload
        env:
          MOSHARROF_TEST_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173/' || (inputs.test_url || 'https://mosharrof0000-ux.github.io/Mosharrof/') }}
          MOSHARROF_TEST_TIMEOUT_MS: "45000"
        run: node tests/e2e/personal-memory-browser-smoke.mjs
