name: Apply TTS download button payload
on:
  push:
    branches: [feat/tts-download-button-v2]
    paths:
      - "scripts/tts-download-payload/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tts-download-button-v2
      - name: Apply payload to web/index.html
        run: python3 scripts/tts-download-payload/apply.py
      - name: Commit and push if changed
        run: |
          git config user.name "mosharrof0000-ux"
          git config user.email "mosharrof0000@gmail.com"
          git add web/index.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Apply progressive TTS playback and auto download button"
            git push
          fi
