name: Cloudflare Token Router Worker Tests

on:
  pull_request:
    paths:
      - "cloudflare-token-router-worker/**"
      - ".github/workflows/cloudflare-token-router-worker-tests.yml"
  push:
    branches:
      - "feature/cloudflare-token-router-v1"
    paths:
      - "cloudflare-token-router-worker/**"
      - ".github/workflows/cloudflare-token-router-worker-tests.yml"

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run isolated router policy tests
        run: node --experimental-default-type=module --test cloudflare-token-router-worker/index.test.js
