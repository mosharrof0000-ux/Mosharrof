name: MOSHARROF Parallel Android Real Chat QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# One matrix run may use six isolated emulators in parallel. Separate workflow
# runs are serialized to avoid competing against the same provider quota.
concurrency:
  group: mosharrof-parallel-android-chat-qa
  cancel-in-progress: false

jobs:
  parallel-real-chat:
    name: "Replica ${{ matrix.replica }} — installed APK real chat"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        replica: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact tested source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate smoke test and emulator script
        run: |
          python -m py_compile scripts/android/apk_webview_real_chat_smoke.py
          bash -n scripts/android/run_apk_webview_smoke.sh

      - name: Install WebView CDP client
        run: python -m pip install --disable-pip-version-check websocket-client

      - name: Find and download APK built from the exact tested SHA
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 150); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-apk.yml --branch "$SOURCE_BRANCH" --limit 30 --json databaseId,headSha,status,conclusion --jq 'first(.[] | select(.headSha == env.SOURCE_SHA and .status == "completed" and .conclusion == "success")) | .databaseId // empty')"
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          test -n "$run_id"
          mkdir -p artifacts/apk
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name MOSHARROF-AI-Android-APK --dir artifacts/apk
          test -s artifacts/apk/app-debug.apk
          sha256sum artifacts/apk/app-debug.apk | tee artifacts/apk-sha256.txt

      - name: Download latest successful main APK for manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-apk.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id" && test "$run_id" != "null"
          mkdir -p artifacts/apk
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name MOSHARROF-AI-Android-APK --dir artifacts/apk
          test -s artifacts/apk/app-debug.apk
          sha256sum artifacts/apk/app-debug.apk | tee artifacts/apk-sha256.txt

      - name: Install APK and run isolated real chat round-trip
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          cores: 3
          ram-size: 3072M
          heap-size: 768M
          emulator-port: 5554
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            mkdir -p artifacts/apk-webview-chat
            bash scripts/android/run_apk_webview_smoke.sh

      - name: Add replica metadata to evidence
        if: always()
        env:
          REPLICA: ${{ matrix.replica }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts/apk-webview-chat
          printf 'replica=%s\nsource_sha=%s\nrun_id=%s\n' "$REPLICA" "$SOURCE_SHA" "$GITHUB_RUN_ID" > artifacts/apk-webview-chat/replica-metadata.txt
          if [ -f artifacts/apk-sha256.txt ]; then cp artifacts/apk-sha256.txt artifacts/apk-webview-chat/; fi

      - name: Upload isolated replica evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-parallel-chat-replica-${{ matrix.replica }}-${{ github.run_id }}
          path: |
            artifacts/apk-webview-chat/**
            artifacts/apk-sha256.txt
          if-no-files-found: warn
          retention-days: 30
