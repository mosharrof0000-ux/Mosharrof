name: Mosharrof Visual Browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Checkout stable main for visual baseline
        run: git fetch origin main && git worktree add /tmp/mosharrof-baseline origin/main
      - name: Start candidate and baseline servers
        run: |
          python3 -m http.server 4173 --directory web > /tmp/candidate.log 2>&1 &
          python3 -m http.server 4174 --directory /tmp/mosharrof-baseline/web > /tmp/baseline.log 2>&1 &
      - name: Compare rendered candidate against stable main
        env:
          BASE_URL: http://127.0.0.1:4173
          BASELINE_URL: http://127.0.0.1:4174
        run: npm run visual:test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-visual-qa
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30