name: Mosharrof Visual Browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --directory web > /tmp/mosharrof-server.log 2>&1 &
      - run: npm run visual:test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosharrof-visual-qa
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore