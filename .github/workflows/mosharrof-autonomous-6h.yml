name: Mosharrof Autonomous 6-Hour Cycle

on:
  schedule:
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      request:
        description: "One-line task for Mosharrof"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mosharrof-autonomous
  cancel-in-progress: true

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Baseline verification
        run: python -m pytest -q
      - name: Autonomous work
        env:
          HAS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_AGENT_ACCESS_TOKEN: ${{ secrets.AGENT_ACCESS_TOKEN != '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_ACCESS_TOKEN: ${{ secrets.AGENT_ACCESS_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AUTONOMOUS_REQUEST: ${{ inputs.request }}
          GH_REPO: ${{ github.repository }}
        if: ${{ env.HAS_GEMINI_API_KEY == 'true' && env.HAS_AGENT_ACCESS_TOKEN == 'true' }}
        run: python scripts/autonomous_agent.py
      - name: Safe pause
        if: ${{ env.HAS_GEMINI_API_KEY != 'true' || env.HAS_AGENT_ACCESS_TOKEN != 'true' }}
        run: echo "No autonomous write performed; required secrets are not configured."