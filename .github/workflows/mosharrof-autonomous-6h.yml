name: Mosharrof Autonomous 6-Hour Cycle

on:
  push:
    paths:
      - ".github/workflows/mosharrof-autonomous-6h.yml"
  schedule:
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      request:
        description: "One-line task for Mosharrof"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

# Queue new runs instead of terminating an active run.
concurrency:
  group: mosharrof-autonomous
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Baseline verification
        run: python -m pytest -q
      # GitHub Actions does not allow the secrets context in an if expression.
      # Evaluate secret availability in the shell instead so the workflow parses
      # and reports a safe pause when credentials are absent.
      - name: Autonomous work or safe pause
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_ACCESS_TOKEN: ${{ secrets.AGENT_ACCESS_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AUTONOMOUS_REQUEST: ${{ inputs.request }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GEMINI_API_KEY:-}" && -n "${AGENT_ACCESS_TOKEN:-}" ]]; then
            python scripts/autonomous_agent.py
          else
            echo "SAFE PAUSE: no autonomous write performed; GEMINI_API_KEY and/or AGENT_ACCESS_TOKEN is not configured."
          fi
