name: Cloudflare Token Router — Isolated Deploy

on:
  push:
    branches:
      - ops/router-isolated-deploy-20261102
  workflow_dispatch:
    inputs:
      confirm_isolated_deploy:
        description: "Deploy only the isolated router Worker (no route, no workers.dev URL)"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: cloudflare-token-router-isolated-deploy
  cancel-in-progress: false

jobs:
  deploy-isolated-worker:
    if: ${{ github.event_name == 'push' || inputs.confirm_isolated_deploy == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Worker tests
        run: npm --prefix cloudflare-token-router-worker test

      - name: Validate required deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set CLOUDFLARE_API_TOKEN as the existing repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID as the existing repository secret."; exit 1; }

      - name: Diagnose Cloudflare token without exposing it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          verify=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "$verify" | jq '{success, errors, result: {id: .result.id, status: .result.status, expires_on: .result.expires_on}}'
          access=$(curl -sS -o /tmp/cf-workers.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts?per_page=1")
          echo "Workers Scripts API HTTP status: $access"
          jq '{success, errors}' /tmp/cf-workers.json
      - name: Deploy isolated Worker without route
        working-directory: cloudflare-token-router-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.90.0 deploy --config wrangler.toml --dry-run=false

      - name: Verify isolated workers.dev health endpoint
        run: |
          set -euo pipefail
          base="https://mosharrof-cloudflare-token-router.mosharrof0000.workers.dev"
          health=$(curl --fail --silent --show-error --max-time 20 "$base/health")
          echo "$health" | jq -e '.ok == true and .service == "mosharrof-cloudflare-token-router"'
          ready_code=$(curl --silent --show-error --max-time 20 -o /tmp/router-ready.json -w "%{http_code}" "$base/ready")
          echo "Readiness HTTP status: $ready_code"
          jq '{ok, mode, access_configured, profiles_configured, profile_config_valid, enabled_profiles_count, enabled_profiles_with_secret_count}' /tmp/router-ready.json
          if [ "$ready_code" = "200" ]; then
            echo "Router readiness checks passed."
          elif [ "$ready_code" = "503" ]; then
            echo "::warning::Worker is reachable, but runtime access/profile secrets are not configured yet."
          else
            echo "::error::Unexpected readiness response."
            exit 1
          fi

      - name: Report safety boundary
        run: |
          echo "Deployment command completed. This workflow does not configure routes, workers.dev, or Worker secrets."
          echo "The router remains unavailable to callers until its secrets and reviewed private test path are configured separately."
