name: Build MOSHARROF Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout MOSHARROF
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify edge-to-edge web contract
        run: |
          test -s web/index.html
          test -s web/edge-to-edge.css
          grep -q 'viewport-fit=cover' web/index.html
          grep -q 'edge-to-edge' web/edge-to-edge.css
          grep -q 'safe-area-inset-top' web/edge-to-edge.css
          grep -q 'safe-area-inset-bottom' web/edge-to-edge.css
          # Keep the live website independent from Android-only styles and controls.
          if grep -q 'edge-to-edge.css' web/index.html; then
            echo "Website must not load Android-only edge-to-edge stylesheet" >&2
            exit 1
          fi
          echo "Android-only edge-to-edge contract: PASS"

      - name: Prepare Capacitor Android wrapper
        run: |
          npm init -y
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          rm -rf android-web
          cp -a web android-web
          python - <<'PY'
          from pathlib import Path
          page = Path("android-web/index.html")
          html = page.read_text(encoding="utf-8")
          link = '<link rel="stylesheet" href="./edge-to-edge.css?v=20261013-6">'
          if link not in html:
              html = html.replace("</head>", f"  {link}\n</head>", 1)
          if link not in html:
              raise SystemExit("Android-only stylesheet injection failed")
          # Use the native Android overlay as the single movable voice control.
          # Speak replies generated from a voice command, using MOSHARROF's configured TTS path.
          html = html.replace('var pendingImage=null;', 'var pendingImage=null;\n  var nativeVoiceReplyPending=false;', 1)
          html = html.replace(
              'msgEl.appendChild(n);bottom();\n    if(!skipSave)',
              '''msgEl.appendChild(n);bottom();
          if(role==="ai"&&nativeVoiceReplyPending){nativeVoiceReplyPending=false;window.setTimeout(function(){var speakButton=n.querySelector(".message-speak-shortcut");if(speakButton)speakButton.click();},150);}
          if(!skipSave)''',
              1
          )
          # Let the native Android voice manager submit speech transcripts through the existing chat pipeline.
          bridge = '''  window.mosharrofNativeVoiceCommand = function (text) {
            try { window.mosharrofAutoSpeakNext = true; input.value = String(text || ""); resize(); send(); return true; }
            catch (error) { console.error("Native voice command could not be sent", error); return false; }
          };
          '''
          marker = "})();\n</script>"
          at = html.rfind(marker)
          if at < 0:
              raise SystemExit("Could not find chat script closure for native voice bridge")
          html = html[:at] + bridge + html[at:]
          response_hook = r"""request.then(function(r){var elapsedMs=performance.now()-requestStartedAt;untype();if(imageMode){addGeneratedImage(r);}else{addMsg("ai",r.text,undefined,false,null,undefined,elapsedMs,r.responseMeta);}busy=false;sendBtn.disabled=false;input.focus();})"""
          response_replacement = r"""request.then(function(r){var elapsedMs=performance.now()-requestStartedAt;untype();if(imageMode){addGeneratedImage(r);}else{addMsg("ai",r.text,undefined,false,null,undefined,elapsedMs,r.responseMeta);if(window.mosharrofAutoSpeakNext){window.mosharrofAutoSpeakNext=false;window.setTimeout(function(){var nodes=msgEl.querySelectorAll(".message.ai");var last=nodes[nodes.length-1];var speak=last&&last.querySelector(".message-speak-shortcut");if(speak)speak.click();},250);}}busy=false;sendBtn.disabled=false;input.focus();})"""
          if response_hook not in html:
              raise SystemExit("Could not find chat response hook for Android voice auto-read")
          html = html.replace(response_hook, response_replacement, 1)
          page.write_text(html, encoding="utf-8")
          PY
          grep -q 'edge-to-edge.css' android-web/index.html
          grep -q 'window.mosharrofNativeVoiceCommand' android-web/index.html
          grep -q 'window.mosharrofAutoSpeakNext' android-web/index.html
          npx cap init "MOSHARROF AI" "com.mosharrof.ai" --web-dir android-web
          npx cap add android
          npx cap sync android

      - name: Add Android global voice manager
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text(encoding="utf-8")
          queries = """
          <queries>
              <package android:name="com.google.android.youtube" />
              <package android:name="com.facebook.katana" />
              <package android:name="com.instagram.android" />
              <package android:name="com.whatsapp" />
              <package android:name="com.android.chrome" />
              <package android:name="com.zhiliaoapp.musically" />
              <package android:name="com.google.android.apps.maps" />
              <package android:name="com.google.android.gm" />
              <intent>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
              </intent>
          </queries>
          """
          if "<queries>" not in xml:
            xml = xml.replace("<application", queries + "\n    <application", 1)
          permissions = [
            '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />',
            '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
            '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />',
            '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]
          for item in permissions:
            if item not in xml:
              xml = xml.replace("<application", item + "\n    <application", 1)
          launcher_queries = """  <queries>
              <intent>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
              </intent>
          </queries>
          """
          if "<queries>" not in xml:
            xml = xml.replace("<application", launcher_queries + "\n    <application", 1)
          components = """
              <activity
                  android:name=".VoiceCommandActivity"
                  android:exported="false"
                  android:excludeFromRecents="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar" />
              <service
                  android:name=".VoiceOverlayService"
                  android:exported="false"
                  android:foregroundServiceType="specialUse">
                  <property
                      android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                      android:value="User-enabled movable MOSHARROF voice manager overlay" />
              </service>
          """
          if 'android:name=".VoiceOverlayService"' not in xml:
            xml = xml.replace("</application>", components + "\n</application>", 1)
          manifest.write_text(xml, encoding="utf-8")
          PY
          mkdir -p android/app/src/main/java/com/mosharrof/ai
          cat > android/app/src/main/java/com/mosharrof/ai/VoiceOverlayService.java <<'JAVA'
          package com.mosharrof.ai;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;
          import android.widget.Toast;

          public class VoiceOverlayService extends Service {
              private static final String CHANNEL = "mosharrof_voice_manager";
              private static final int NOTIFICATION_ID = 5801;
              private static final String ACTION_STOP = "com.mosharrof.ai.STOP_VOICE_OVERLAY";
              private WindowManager windowManager;
              private MicBubbleView bubble;
              private WindowManager.LayoutParams params;
              private boolean compact = false;
              private boolean hidden = false;
              private long downAt;
              private float downRawX, downRawY;
              private int startX, startY;
              private boolean moved;

              @Override public void onCreate() {
                  super.onCreate();
                  createChannel();
                  hidden = getSharedPreferences("mosharrof_voice_overlay", MODE_PRIVATE).getBoolean("hidden", false);
                  startForeground(NOTIFICATION_ID, notification());
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "MOSHARROF ভাসমান বাটনের জন্য Display over other apps অনুমতি দিন", Toast.LENGTH_LONG).show();
                      stopSelf();
                  } else if (!hidden) {
                      showBubble();
                  }
              }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  String action = intent == null ? null : intent.getAction();
                  if ("com.mosharrof.ai.HIDE_VOICE_OVERLAY".equals(action)) {
                      hidden = true;
                      getSharedPreferences("mosharrof_voice_overlay", MODE_PRIVATE).edit().putBoolean("hidden", true).apply();
                      removeBubble();
                      startForeground(NOTIFICATION_ID, notification());
                      return START_STICKY;
                  }
                  if ("com.mosharrof.ai.SHOW_VOICE_OVERLAY".equals(action)) {
                      hidden = false;
                      getSharedPreferences("mosharrof_voice_overlay", MODE_PRIVATE).edit().putBoolean("hidden", false).apply();
                      if (Settings.canDrawOverlays(this) && bubble == null) showBubble();
                      startForeground(NOTIFICATION_ID, notification());
                      return START_STICKY;
                  }
                  if (ACTION_STOP.equals(action)) {
                      removeBubble();
                      stopForeground(true);
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (Settings.canDrawOverlays(this) && bubble == null && !hidden) showBubble();
                  return START_STICKY;
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel = new NotificationChannel(CHANNEL, "MOSHARROF Voice Manager", NotificationManager.IMPORTANCE_LOW);
                      channel.setDescription("Notification to keep the user-enabled floating voice manager available");
                      ((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(channel);
                  }
              }

              private Notification notification() {
                  Intent open = new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent openPi = PendingIntent.getActivity(this, 5802, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Intent toggle = new Intent(this, VoiceOverlayService.class).setAction(hidden ? "com.mosharrof.ai.SHOW_VOICE_OVERLAY" : "com.mosharrof.ai.HIDE_VOICE_OVERLAY");
                  PendingIntent togglePi = PendingIntent.getService(this, 5803, toggle, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CHANNEL) : new Notification.Builder(this);
                  b.setSmallIcon(android.R.drawable.ic_btn_speak_now).setContentTitle("MOSHARROF Voice Manager")
                   .setContentText(hidden ? "ভাসমান মাইক্রোফোন লুকানো আছে" : "ভাসমান মাইক্রোফোন চালু আছে")
                   .setContentIntent(openPi).setOngoing(true).addAction(android.R.drawable.ic_menu_view, hidden ? "দেখান" : "লুকান", togglePi);
                  return b.build();
              }

              private void showBubble() {
                  if (bubble != null) return;
                  windowManager = (WindowManager)getSystemService(WINDOW_SERVICE);
                  bubble = new MicBubbleView(this);
                  bubble.setContentDescription("MOSHARROF ভয়েস ম্যানেজার");
                  bubble.setElevation(dp(8));
                  params = new WindowManager.LayoutParams(dp(36), dp(36),
                      Build.VERSION.SDK_INT >= 26 ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT);
                  params.gravity = Gravity.TOP | Gravity.START;
                  android.content.SharedPreferences savedPosition = getSharedPreferences("mosharrof_voice_overlay", MODE_PRIVATE);
                  params.x = savedPosition.getInt("x", dp(12)); params.y = savedPosition.getInt("y", dp(220));
                  bubble.setOnTouchListener((v, event) -> {
                      switch (event.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              downAt = System.currentTimeMillis(); downRawX = event.getRawX(); downRawY = event.getRawY();
                              startX = params.x; startY = params.y; moved = false; return true;
                          case MotionEvent.ACTION_MOVE:
                              float dx = event.getRawX() - downRawX, dy = event.getRawY() - downRawY;
                              if (Math.abs(dx) > dp(5) || Math.abs(dy) > dp(5)) moved = true;
                              if (moved) { params.x = Math.max(0, startX + (int)dx); params.y = Math.max(0, startY + (int)dy); try { windowManager.updateViewLayout(bubble, params); } catch (Exception ignored) {} }
                              return true;
                          case MotionEvent.ACTION_UP:
                              long held = System.currentTimeMillis() - downAt;
                              if (moved) getSharedPreferences("mosharrof_voice_overlay", MODE_PRIVATE).edit().putInt("x", params.x).putInt("y", params.y).apply();
                              if (!moved && held >= 650) {
                                  hidden = true;
                                  getSharedPreferences("mosharrof_voice_overlay", MODE_PRIVATE).edit().putBoolean("hidden", true).apply();
                                  Toast.makeText(VoiceOverlayService.this, "MOSHARROF আইকন লুকানো হয়েছে · নোটিফিকেশনের ‘দেখান’ চাপলে ফিরবে", Toast.LENGTH_LONG).show();
                                  removeBubble();
                                  startForeground(NOTIFICATION_ID, notification());
                              }
                              else if (!moved) {
                                  if (compact) { compact = false; styleBubble(); }
                                  else { Intent voice = new Intent(VoiceOverlayService.this, VoiceCommandActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(voice); }
                              }
                              return true;
                      }
                      return true;
                  });
                  try { windowManager.addView(bubble, params); } catch (Exception e) { bubble = null; stopSelf(); }
              }

              private void toggleCompact() {
                  compact = !compact;
                  styleBubble();
                  Toast.makeText(this, compact ? "ম্যানেজার ছোট করা হয়েছে · ট্যাপ করলে আবার খুলবে" : "ভয়েস ম্যানেজার প্রস্তুত", Toast.LENGTH_SHORT).show();
              }

              private void styleBubble() {
                  if (bubble == null || params == null) return;
                  params.width = dp(compact ? 16 : 36); params.height = dp(compact ? 30 : 36);
                  bubble.setCompact(compact);
                  try { windowManager.updateViewLayout(bubble, params); } catch (Exception ignored) {}
              }


              private final class MicBubbleView extends View {
                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private boolean isCompact;
                  MicBubbleView(android.content.Context context) { super(context); setWillNotDraw(false); }
                  void setCompact(boolean value) { isCompact = value; invalidate(); }
                  @Override protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      float w = getWidth(), h = getHeight();
                      paint.setStyle(Paint.Style.FILL);
                      paint.setColor(isCompact ? Color.rgb(45,45,45) : Color.rgb(8,8,8));
                      canvas.drawRoundRect(new RectF(0, 0, w, h), dp(isCompact ? 8 : 10), dp(isCompact ? 8 : 10), paint);
                      paint.setStyle(Paint.Style.STROKE);
                      paint.setStrokeWidth(dp(1));
                      paint.setColor(Color.argb(105,255,255,255));
                      canvas.drawRoundRect(new RectF(dp(1)/2f, dp(1)/2f, w-dp(1)/2f, h-dp(1)/2f), dp(isCompact ? 8 : 10), dp(isCompact ? 8 : 10), paint);
                      if (isCompact) {
                          paint.setStyle(Paint.Style.FILL);
                          paint.setColor(Color.WHITE);
                          canvas.drawCircle(w/2f, h/2f, dp(2), paint);
                          return;
                      }
                      paint.setColor(Color.WHITE);
                      paint.setStrokeWidth(dp(1.8f));
                      paint.setStrokeCap(Paint.Cap.ROUND);
                      paint.setStyle(Paint.Style.STROKE);
                      canvas.drawRoundRect(new RectF(w*.40f, h*.20f, w*.60f, h*.57f), dp(5), dp(5), paint);
                      canvas.drawArc(new RectF(w*.25f, h*.31f, w*.75f, h*.75f), 0, 180, false, paint);
                      canvas.drawLine(w*.50f, h*.75f, w*.50f, h*.86f, paint);
                      canvas.drawLine(w*.38f, h*.86f, w*.62f, h*.86f, paint);
                  }
              }
\n              private int dp(int value) { return Math.round(value * getResources().getDisplayMetrics().density); }
              private void removeBubble() { if (windowManager != null && bubble != null) { try { windowManager.removeView(bubble); } catch (Exception ignored) {} } bubble = null; }
              @Override public void onDestroy() { removeBubble(); super.onDestroy(); }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          JAVA
          cat > android/app/src/main/java/com/mosharrof/ai/VoiceCommandActivity.java <<'JAVA'
          package com.mosharrof.ai;

          import android.app.Activity;
          import android.content.Intent;
          import android.speech.RecognizerIntent;
          import android.os.Bundle;
          import android.widget.Toast;
          import android.content.pm.ResolveInfo;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          public class VoiceCommandActivity extends Activity {
              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  Intent speech = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  speech.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  speech.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD");
                  speech.putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "bn-BD");
                  speech.putExtra(RecognizerIntent.EXTRA_PROMPT, "MOSHARROF-কে বলুন: কোনো অ্যাপ খুলুন অথবা প্রশ্ন করুন");
                  try { startActivityForResult(speech, 5804); }
                  catch (Exception e) { Toast.makeText(this, "এই ডিভাইসে Android voice recognition পাওয়া যায়নি। MOSHARROF অ্যাপ খুলে মাইক্রোফোন ব্যবহার করুন।", Toast.LENGTH_LONG).show(); finish(); }
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != 5804) { finish(); return; }
                  if (resultCode != RESULT_OK || data == null) { finish(); return; }
                  ArrayList<String> matches = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                  if (matches == null || matches.isEmpty()) { finish(); return; }
                  String spoken = matches.get(0).trim();
                  String normalized = spoken.toLowerCase(Locale.ROOT);
                  String pkg = null;
                  if (hasAppWord(normalized, "youtube", "ইউটিউব")) pkg = "com.google.android.youtube";
                  else if (hasAppWord(normalized, "facebook", "ফেসবুক")) pkg = "com.facebook.katana";
                  else if (hasAppWord(normalized, "instagram", "ইনস্টাগ্রাম")) pkg = "com.instagram.android";
                  else if (hasAppWord(normalized, "whatsapp", "হোয়াটসঅ্যাপ", "হোয়াটসঅ্যাপ")) pkg = "com.whatsapp";
                  else if (hasAppWord(normalized, "chrome", "ক্রোম", "browser", "ব্রাউজার")) pkg = "com.android.chrome";
                  else if (hasAppWord(normalized, "tiktok", "টিকটক", "টিক টক")) pkg = "com.zhiliaoapp.musically";
                  else if (hasAppWord(normalized, "maps", "গুগল ম্যাপ", "ম্যাপ")) pkg = "com.google.android.apps.maps";
                  else if (hasAppWord(normalized, "gmail", "জিমেইল")) pkg = "com.google.android.gm";
                  else if (hasAppWord(normalized, "settings", "সেটিংস")) {
                      try { startActivity(new Intent(android.provider.Settings.ACTION_SETTINGS)); } catch (Exception ignored) {}
                      finish(); return;
                  }
                  boolean launchVerb = normalized.matches(".*(খোলো|খুলুন|চালু কর|যাও|open|launch|go to|খুলে দাও|খুলে ফেল).*");
                  if (pkg == null && launchVerb) pkg = findInstalledLauncher(normalized);
                  if (pkg != null && launchVerb) {
                      Intent launch = getPackageManager().getLaunchIntentForPackage(pkg);
                      if (launch != null) { launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(launch); finish(); return; }
                      Toast.makeText(this, "এই অ্যাপটি ইনস্টল করা নেই; MOSHARROF-এ প্রশ্নটি পাঠাচ্ছি।", Toast.LENGTH_SHORT).show();
                  }
                  Intent chat = new Intent(this, MainActivity.class);
                  chat.putExtra("mosharrof_voice_command", spoken);
                  chat.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  startActivity(chat);
                  finish();
              }

              private String findInstalledLauncher(String spoken) {
                  String target = spoken.toLowerCase(Locale.ROOT)
                      .replaceAll("খোলো|খুলুন|চালু করো?|যাও|চলে যাও|open|launch|go to|খুলে দাও|খুলে ফেল", " ")
                      .trim();
                  if (target.isEmpty()) return null;
                  Intent launcher = new Intent(Intent.ACTION_MAIN);
                  launcher.addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> apps = getPackageManager().queryIntentActivities(launcher, 0);
                  for (ResolveInfo item : apps) {
                      if (item.activityInfo == null) continue;
                      String label = String.valueOf(item.loadLabel(getPackageManager())).toLowerCase(Locale.ROOT);
                      String packageName = item.activityInfo.packageName.toLowerCase(Locale.ROOT);
                      if (!label.isEmpty() && (target.contains(label) || label.contains(target))) return item.activityInfo.packageName;
                      if (target.length() >= 3 && packageName.contains(target)) return item.activityInfo.packageName;
                  }
                  return null;
              }

              private boolean hasAppWord(String text, String... words) {
                  for (String word : words) if (text.contains(word)) return true;
                  return false;
              }
          }
          JAVA
          echo "Android global voice manager sources: PASS"

      - name: Apply native Android edge-to-edge shell
        run: |
          cat > android/app/src/main/java/com/mosharrof/ai/MainActivity.java <<'JAVA'
          package com.mosharrof.ai;

          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Window;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              private static final int OVERLAY_REQUEST = 5805;
              private static boolean askedForOverlayThisSession = false;
              private final Handler handler = new Handler(Looper.getMainLooper());

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  WindowCompat.setDecorFitsSystemWindows(window, false);
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.TRANSPARENT);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) window.setNavigationBarContrastEnforced(false);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = window.getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                      window.setAttributes(lp);
                  }
                  window.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);
                  WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(window, window.getDecorView());
                  if (controller != null) {
                      int nightMode = getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK;
                      boolean lightTheme = nightMode != Configuration.UI_MODE_NIGHT_YES;
                      controller.setAppearanceLightStatusBars(lightTheme);
                      controller.setAppearanceLightNavigationBars(lightTheme);
                  }
                  handleVoiceIntent(getIntent());
                  if (Settings.canDrawOverlays(this)) startVoiceOverlay();
                  else if (!askedForOverlayThisSession) {
                      askedForOverlayThisSession = true;
                      new AlertDialog.Builder(this)
                        .setTitle("MOSHARROF ভয়েস ম্যানেজার")
                        .setMessage("হোমস্ক্রিন ও অন্য অ্যাপের ওপর ছোট ভাসমান মাইক্রোফোন ব্যবহার করতে 'Display over other apps' অনুমতি দিন। চাইলে এখন নয় নির্বাচন করতে পারেন।")
                        .setPositiveButton("অনুমতি দিন", (d, w) -> {
                            Intent permission = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                            try { startActivityForResult(permission, OVERLAY_REQUEST); }
                            catch (Exception e) { startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION)); }
                        })
                        .setNegativeButton("এখন নয়", (d, w) -> {})
                        .show();
                  }
              }

              @Override protected void onResume() {
                  super.onResume();
                  if (Settings.canDrawOverlays(this)) startVoiceOverlay();
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == OVERLAY_REQUEST && Settings.canDrawOverlays(this)) startVoiceOverlay();
              }

              @Override protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleVoiceIntent(intent);
              }

              private void startVoiceOverlay() {
                  Intent service = new Intent(this, VoiceOverlayService.class);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(service); else startService(service);
              }

              private void handleVoiceIntent(Intent intent) {
                  if (intent == null) return;
                  String command = intent.getStringExtra("mosharrof_voice_command");
                  if (command == null || command.trim().isEmpty()) return;
                  intent.removeExtra("mosharrof_voice_command");
                  deliverVoiceCommand(command.trim(), 0);
              }

              private void deliverVoiceCommand(String command, int attempt) {
                  if (attempt > 30 || isFinishing()) return;
                  try {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          String js = "(function(){if(window.mosharrofNativeVoiceCommand){window.mosharrofNativeVoiceCommand(" + JSONObject.quote(command) + ");return true;}return false;})()";
                          getBridge().getWebView().evaluateJavascript(js, value -> {
                              if (!"true".equals(value)) handler.postDelayed(() -> deliverVoiceCommand(command, attempt + 1), 350);
                          });
                          return;
                      }
                  } catch (Exception ignored) {}
                  handler.postDelayed(() -> deliverVoiceCommand(command, attempt + 1), 350);
              }
          }
