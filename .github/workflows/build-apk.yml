name: Build MOSHARROF Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout MOSHARROF
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify edge-to-edge web contract
        run: |
          test -s web/index.html
          test -s web/edge-to-edge.css
          grep -q 'viewport-fit=cover' web/index.html
          grep -q 'edge-to-edge' web/edge-to-edge.css
          grep -q 'safe-area-inset-top' web/edge-to-edge.css
          grep -q 'safe-area-inset-bottom' web/edge-to-edge.css
          grep -q 'backdrop-filter' web/edge-to-edge.css
          echo "Edge-to-edge web contract: PASS"

      - name: Prepare Capacitor Android wrapper
        run: |
          npm init -y
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MOSHARROF AI" "com.mosharrof.ai" --web-dir web
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          if "<queries>" not in source:
              packages = [
                  "com.android.chrome", "com.google.android.youtube", "com.whatsapp",
                  "org.telegram.messenger", "com.facebook.katana", "com.instagram.android",
                  "com.google.android.gm", "com.google.android.apps.messaging",
                  "com.android.settings", "com.google.android.apps.maps",
                  "com.spotify.music", "com.google.android.dialer",
              ]
              query_block = "    <queries>\\n" + "".join(
                  f'        <package android:name="{package}" />\\n' for package in packages
              ) + "    </queries>\\n    "
              if "<application" not in source:
                  raise SystemExit("Android manifest application element not found")
              source = source.replace("<application", query_block + "<application", 1)
              manifest.write_text(source, encoding="utf-8")
          PY

      - name: Apply native Android edge-to-edge shell
        run: |
          mkdir -p android/app/src/main/java/com/mosharrof/ai
          cat > android/app/src/main/java/com/mosharrof/ai/MainActivity.java <<'JAVA'
          package com.mosharrof.ai;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;

          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MosharrofDeviceControlPlugin.class);
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();

                  // Draw the WebView behind the status/navigation bars.
                  WindowCompat.setDecorFitsSystemWindows(window, false);

                  // Transparent bars: the MOSHARROF canvas supplies the background.
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.TRANSPARENT);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      window.setNavigationBarContrastEnforced(false);
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = window.getAttributes();
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                      window.setAttributes(lp);
                  }

                  window.setSoftInputMode(
                      WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE
                  );

                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(window, window.getDecorView());

                  if (controller != null) {
                      controller.setAppearanceLightStatusBars(false);
                      controller.setAppearanceLightNavigationBars(false);
                  }
              }
          }
          JAVA

          grep -q 'WindowCompat.setDecorFitsSystemWindows'             android/app/src/main/java/com/mosharrof/ai/MainActivity.java
          grep -q 'setNavigationBarContrastEnforced(false)'             android/app/src/main/java/com/mosharrof/ai/MainActivity.java
          cp android-src/MosharrofDeviceControlPlugin.java             android/app/src/main/java/com/mosharrof/ai/MosharrofDeviceControlPlugin.java
          grep -q '@CapacitorPlugin(name = "MosharrofDeviceControl")'             android/app/src/main/java/com/mosharrof/ai/MosharrofDeviceControlPlugin.java
          grep -q 'registerPlugin(MosharrofDeviceControlPlugin.class)'             android/app/src/main/java/com/mosharrof/ai/MainActivity.java
          echo "Native Android edge-to-edge shell and device bridge: PASS"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          echo "APK size:"
          du -h android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOSHARROF-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG"             android/app/build/outputs/apk/debug/app-debug.apk             --title "MOSHARROF AI Android APK ${{ github.run_number }}"             --notes "Built and verified from main commit ${{ github.sha }}."
