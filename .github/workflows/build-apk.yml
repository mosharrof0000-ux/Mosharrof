name: Build MOSHARROF Android APK

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout MOSHARROF
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify edge-to-edge web contract
        run: |
          test -s web/index.html
          test -s web/edge-to-edge.css
          test -s core/android-edge-to-edge.css
          grep -q 'viewport-fit=cover' web/index.html
          grep -q 'edge-to-edge' web/edge-to-edge.css
          grep -q 'safe-area-inset-top' web/edge-to-edge.css
          grep -q 'safe-area-inset-bottom' web/edge-to-edge.css
          grep -q 'edge-to-edge' core/android-edge-to-edge.css
          grep -q 'safe-area-inset-top' core/android-edge-to-edge.css
          grep -q 'safe-area-inset-bottom' core/android-edge-to-edge.css
          grep -q 'backdrop-filter' web/edge-to-edge.css
          echo "Edge-to-edge web contract: PASS"

      # Check committed source before the build-time voice-manager generators
      # create temporary derived edits in the working tree.
      - name: Enforce file and folder size budgets
        run: python3 scripts/mosharrof_size_gate.py --base origin/main

      - name: Prepare Android full-screen voice manager
        run: bash scripts/android/prepare-and-install-voice.sh

      - name: Verify Android agent contract suite
        run: bash scripts/android/test-agent-contracts.sh

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          echo "APK size:"
          du -h android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOSHARROF-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG"             android/app/build/outputs/apk/debug/app-debug.apk             --title "MOSHARROF AI Android APK ${{ github.run_number }}"             --notes "Built and verified from main commit ${{ github.sha }}."
