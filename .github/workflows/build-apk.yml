name: Build MOSHARROF Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout MOSHARROF
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify edge-to-edge web contract
        run: |
          test -s web/index.html
          test -s web/edge-to-edge.css
          grep -q 'viewport-fit=cover' web/index.html
          grep -q 'edge-to-edge' web/edge-to-edge.css
          grep -q 'safe-area-inset-top' web/edge-to-edge.css
          grep -q 'safe-area-inset-bottom' web/edge-to-edge.css
          grep -q 'backdrop-filter' web/edge-to-edge.css
          # The source website remains unchanged; full-screen CSS is packaged only in Android.
          if grep -q 'edge-to-edge.css' web/index.html; then
            echo "Website must not load Android-only edge-to-edge stylesheet" >&2
            exit 1
          fi
          echo "Android-only edge-to-edge contract: PASS"

      - name: Prepare Capacitor Android wrapper
        run: |
          npm init -y
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          # Bundle a private copy for Android; never alter the live website source.
          rm -rf android-web
          cp -a web android-web
          python - <<'PY'
          from pathlib import Path
          page = Path("android-web/index.html")
          html = page.read_text(encoding="utf-8")
          link = '<link rel="stylesheet" href="./edge-to-edge.css?v=20261013-4">'
          if link not in html:
              html = html.replace("</head>", f"  {link}\n</head>", 1)
          if link not in html:
              raise SystemExit("Android-only stylesheet injection failed")
          # Add a floating Android-only microphone control without changing the website source.
          fab = """<button id="mosharrofVoiceFab" type="button" aria-label="ভয়েস সহকারী" title="টেনে সরান · চেপে ধরে লুকান"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button>
          <script>
          (function () {
            var fab = document.getElementById("mosharrofVoiceFab");
            var mic = document.getElementById("composerVoiceBtn");
            if (!fab || !mic) return;
            var sx=0,sy=0,ox=0,oy=0,moved=false,longPress=false,longTimer=null;
            try { var saved=JSON.parse(localStorage.getItem("mosharrof_voice_fab_pos")||"null"); if(saved&&Number.isFinite(saved.x)&&Number.isFinite(saved.y)){fab.style.left=saved.x+"px";fab.style.top=saved.y+"px";fab.style.right="auto";fab.style.bottom="auto";} } catch(e){}
            fab.addEventListener("pointerdown",function(e){
              sx=e.clientX;sy=e.clientY;var r=fab.getBoundingClientRect();ox=r.left;oy=r.top;moved=false;longPress=false;
              try{fab.setPointerCapture(e.pointerId);}catch(err){}
              longTimer=setTimeout(function(){longPress=true;if(window.MosharrofNative&&MosharrofNative.hideOverlay)MosharrofNative.hideOverlay();fab.title="ভাসমান সহকারী লুকানো হয়েছে · আবার চাপুন চালু করতে";},750);
            });
            fab.addEventListener("pointermove",function(e){
              if(!fab.hasPointerCapture||!fab.hasPointerCapture(e.pointerId))return;
              var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>7||Math.abs(dy)>7){moved=true;if(longTimer){clearTimeout(longTimer);longTimer=null;}}
              if(moved){fab.style.left=Math.max(0,Math.min(window.innerWidth-40,ox+dx))+"px";fab.style.top=Math.max(0,Math.min(window.innerHeight-40,oy+dy))+"px";fab.style.right="auto";fab.style.bottom="auto";}
            });
            fab.addEventListener("pointerup",function(){
              if(longTimer){clearTimeout(longTimer);longTimer=null;}
              if(moved){try{localStorage.setItem("mosharrof_voice_fab_pos",JSON.stringify({x:parseFloat(fab.style.left)||0,y:parseFloat(fab.style.top)||0}));}catch(e){}}
            });
            fab.addEventListener("click",function(e){
              if(moved||longPress){e.preventDefault();e.stopImmediatePropagation();moved=false;longPress=false;return;}
              if(window.MosharrofNative&&MosharrofNative.showOverlay)MosharrofNative.showOverlay();
              mic.click();
            });
            function sync() {
              ["is-listening", "is-processing", "is-transcription-success", "is-transcription-error"].forEach(function (name) { fab.classList.toggle(name, mic.classList.contains(name)); });
              fab.setAttribute("aria-pressed", mic.getAttribute("aria-pressed") || "false");
              if(!mic.classList.contains("is-listening")&&!mic.classList.contains("is-processing"))fab.title="টেনে সরান · চেপে ধরে ভাসমান আইকন লুকান";
              else fab.title=mic.title||"ভয়েস ইনপুট";
            }
            new MutationObserver(sync).observe(mic, { attributes: true, attributeFilter: ["class", "title", "aria-pressed"] });
            sync();
          })();
          </script>"""
          if 'id="mosharrofVoiceFab"' not in html:
              html = html.replace("</body>", fab + "\n</body>", 1)
          page.write_text(html, encoding="utf-8")
          PY
          grep -q 'edge-to-edge.css' android-web/index.html
          grep -q 'id="mosharrofVoiceFab"' android-web/index.html
          grep -q 'new MutationObserver(sync)' android-web/index.html
          npx cap init "MOSHARROF AI" "com.mosharrof.ai" --web-dir android-web
          npx cap add android
          npx cap sync android

      - name: Prepare native movable system-wide assistant overlay
        run: |
          python scripts/prepare_android_overlay.py
          grep -q 'MosharrofOverlayService' android/app/src/main/AndroidManifest.xml
          grep -q 'SYSTEM_ALERT_WINDOW' android/app/src/main/AndroidManifest.xml
          grep -q 'setDecorFitsSystemWindows' android/app/src/main/java/com/mosharrof/ai/MainActivity.java
          grep -q 'JavascriptInterface' android/app/src/main/java/com/mosharrof/ai/MainActivity.java
          grep -q 'ACTION_MANAGE_OVERLAY_PERMISSION' android/app/src/main/java/com/mosharrof/ai/MainActivity.java
          echo "Native movable system-wide assistant overlay: PASS"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          echo "APK size:"
          du -h android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOSHARROF-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG"             android/app/build/outputs/apk/debug/app-debug.apk             --title "MOSHARROF AI Android APK ${{ github.run_number }}"             --notes "Built and verified from main commit ${{ github.sha }}."
