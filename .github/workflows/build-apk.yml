name: Build MOSHARROF Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout MOSHARROF
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify edge-to-edge web contract
        run: |
          test -s web/index.html
          test -s web/edge-to-edge.css
          grep -q 'viewport-fit=cover' web/index.html
          grep -q 'edge-to-edge' web/edge-to-edge.css
          grep -q 'safe-area-inset-top' web/edge-to-edge.css
          grep -q 'safe-area-inset-bottom' web/edge-to-edge.css
          grep -q 'backdrop-filter' web/edge-to-edge.css
          # The source website remains unchanged; full-screen CSS is packaged only in Android.
          if grep -q 'edge-to-edge.css' web/index.html; then
            echo "Website must not load Android-only edge-to-edge stylesheet" >&2
            exit 1
          fi
          echo "Android-only edge-to-edge contract: PASS"

      - name: Prepare Capacitor Android wrapper
        run: |
          npm init -y
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          # Bundle a private copy for Android; never alter the live website source.
          rm -rf android-web
          cp -a web android-web
          python - <<'PY'
          from pathlib import Path
          page = Path("android-web/index.html")
          html = page.read_text(encoding="utf-8")
          link = '<link rel="stylesheet" href="./edge-to-edge.css?v=20261013-4">'
          if link not in html:
              html = html.replace("</head>", f"  {link}\n</head>", 1)
          if link not in html:
              raise SystemExit("Android-only stylesheet injection failed")
          # Add a floating Android-only microphone control without changing the website source.
          fab = """<button id="mosharrofVoiceFab" type="button" aria-label="ভয়েস ইনপুট" title="ভয়েস ইনপুট"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button>
          <script>
          (function () {
            var fab = document.getElementById("mosharrofVoiceFab");
            var mic = document.getElementById("composerVoiceBtn");
            if (!fab || !mic) return;
            fab.addEventListener("click", function () { mic.click(); });
            function sync() {
              ["is-listening", "is-processing", "is-transcription-success", "is-transcription-error"].forEach(function (name) {
                fab.classList.toggle(name, mic.classList.contains(name));
              });
              fab.setAttribute("aria-pressed", mic.getAttribute("aria-pressed") || "false");
              fab.title = mic.title || "ভয়েস ইনপুট";
            }
            new MutationObserver(sync).observe(mic, { attributes: true, attributeFilter: ["class", "title", "aria-pressed"] });
            sync();
          })();
          </script>"""
          if 'id="mosharrofVoiceFab"' not in html:
              html = html.replace("</body>", fab + "\n</body>", 1)
          page.write_text(html, encoding="utf-8")
          PY
          grep -q 'edge-to-edge.css' android-web/index.html
          grep -q 'id="mosharrofVoiceFab"' android-web/index.html
          grep -q 'new MutationObserver(sync)' android-web/index.html
          npx cap init "MOSHARROF AI" "com.mosharrof.ai" --web-dir android-web
          npx cap add android
          npx cap sync android

      - name: Apply native Android edge-to-edge shell
        run: |
          mkdir -p android/app/src/main/java/com/mosharrof/ai
          cat > android/app/src/main/java/com/mosharrof/ai/MainActivity.java <<'JAVA'
          package com.mosharrof.ai;

          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;

          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();

                  // Draw the WebView behind the status/navigation bars.
                  WindowCompat.setDecorFitsSystemWindows(window, false);

                  // Transparent bars: the MOSHARROF canvas supplies the background.
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.TRANSPARENT);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      window.setNavigationBarContrastEnforced(false);
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = window.getAttributes();
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                      window.setAttributes(lp);
                  }

                  window.setSoftInputMode(
                      WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE
                  );

                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(window, window.getDecorView());

                  if (controller != null) {
                      // Dark system icons on a light device theme; white icons at night.
                      int nightMode = getResources().getConfiguration().uiMode
                          & Configuration.UI_MODE_NIGHT_MASK;
                      boolean lightTheme = nightMode != Configuration.UI_MODE_NIGHT_YES;
                      controller.setAppearanceLightStatusBars(lightTheme);
                      controller.setAppearanceLightNavigationBars(lightTheme);
                  }
              }
          }
          JAVA

          grep -q 'WindowCompat.setDecorFitsSystemWindows'             android/app/src/main/java/com/mosharrof/ai/MainActivity.java
          grep -q 'setNavigationBarContrastEnforced(false)'             android/app/src/main/java/com/mosharrof/ai/MainActivity.java
          grep -q 'Configuration.UI_MODE_NIGHT_MASK' android/app/src/main/java/com/mosharrof/ai/MainActivity.java
          grep -q 'controller.setAppearanceLightStatusBars(lightTheme)' android/app/src/main/java/com/mosharrof/ai/MainActivity.java
          echo "Native Android edge-to-edge shell: PASS"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          echo "APK size:"
          du -h android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOSHARROF-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG"             android/app/build/outputs/apk/debug/app-debug.apk             --title "MOSHARROF AI Android APK ${{ github.run_number }}"             --notes "Built and verified from main commit ${{ github.sha }}."
