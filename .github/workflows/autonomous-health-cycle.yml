name: Mosharrof Autonomous Health Cycle

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mosharrof-health-cycle
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full test suite
        run: python -m pytest -q
      - name: Verify protected Pages artifact
        run: |
          test -f web/index.html
          grep -q 'MOSHARROF AI' web/index.html
      - name: Record healthy cycle
        run: echo "Mosharrof autonomous health cycle PASSED."
